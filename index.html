        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 600; const ratio = Math.min(MAX/img.width, MAX/img.height);
                canvas.width = img.width*ratio; canvas.height = img.height*ratio;
                canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                cb(canvas.toDataURL('image/jpeg', 0.82));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

                        return { ...existing, ...incoming, nombre, email, uid };

                        if (existingKey && byEmail[existingKey]) {
                            byEmail[existingKey] = mergeVendedor(byEmail[existingKey], v);

                            const key = ek || v.id;

                        // Registrar uid en índice si el doc lo tiene

                                                                <span className="badge-dot"/>{p.estado||'Sin estado'}

                                                            {despachadosCard>0&&<div style={{fontSize:'11px',color:'var(--text-dim)'}}><span style={{fontFamily:'Fira Code',fontWeight:'700',color:'var(--text)'}}>{entregadosCard}</span>/{despachadosCard} entregados</div>}

                                        </div>
                                    </div>
                                </div>

                        </>
                    );

                    // ── Detalle de producto ──
                    const p = productos.find(x=>x.id===activeProducto.id) || activeProducto;
                    const inv = p.inventario||{};
                    // Unidades vendidas = suma de lo registrado para este producto en Cierre Diario (por nombre exacto), no un campo manual.
                    const unidadesVendidasCalc = cierresScoped.reduce((s,c) => s + (c.productos||[]).filter(f=>f.nombre===p.nombre).reduce((s2,f)=>s2+(f.cantidad||0),0), 0);
                    // Ganancia total / neta = utilidad real de Contabilidad (Libro Diario, partida doble),
                    // misma fórmula que Contabilidad → Por Producto — no un estimado de Cierre Diario.
                    const contabProd = calcularUtilidadesPorProducto(
                        cuentas.filter(perteneceATienda),
                        asientos.filter(perteneceATienda),
                        productos.filter(pr=>pr.estado==='Activo'),
                    ).filas.find(f=>f.id===p.id) || { ingresos:0, gastos:0, utilidad:0 };
                    const gananciaTotal = contabProd.ingresos;
                    const gananciaNeta  = contabProd.utilidad;

                    // ── Lotes: Pedidos del producto viven POR LOTE; lo de arriba
                    // (Despachados/Entregados) es la suma de todos los lotes juntos.
                    // Migra en caliente los datos viejos (sin lotes) a un "Lote 1" la primera vez
                    // que se guarda algo, sin perder lo ya registrado.
                    const lotesActuales = (p.lotes && p.lotes.length) ? p.lotes
                        : ((p.pedidos?.length || Object.keys(p.finanzas||{}).length) ? [{ id:'lote_legacy', nombre:'Lote 1', pedidos:p.pedidos||[], finanzas:p.finanzas||{} }] : []);

                    const todosPedidos = lotesActuales.flatMap(l=>l.pedidos||[]);
                    const totalDespachados = todosPedidos.reduce((s,e)=>s+(e.despachados||0),0);
                    const totalEntregados  = todosPedidos.reduce((s,e)=>s+(e.entregados||0),0);
                    const tasaEntrega = totalDespachados>0 ? (totalEntregados/totalDespachados*100) : null;
                    const totalRecibidas = lotesActuales.reduce((s,l)=>s+(l.unidadesRecibidas||0),0);
                    const stockDisponible = totalRecibidas - totalDespachados;

                    const guardarLotes = nuevoLotes => db.collection('productos').doc(p.id).update({
                        lotes: nuevoLotes, pedidos: firebase.firestore.FieldValue.delete(), finanzas: firebase.firestore.FieldValue.delete(),
                    }).catch(console.error);

                    const crearLote = () => {
                        const nuevo = { id:'lote_'+Date.now(), nombre:`Lote ${lotesActuales.length+1}`, unidadesRecibidas:0, pedidos:[], finanzas:{} };
                        guardarLotes([...lotesActuales, nuevo]);
                        setLoteActivo(nuevo.id);
                    };
                    const renombrarLote = (loteId, nombre) => guardarLotes(lotesActuales.map(l=>l.id===loteId?{...l,nombre}:l));
                    // Cantidad de unidades que llegaron físicamente en ese lote/envío — distinto de
                    // despachados/entregados, que son el seguimiento de los pedidos ya enviados al cliente.
                    const actualizarRecibidasLote = (loteId, unidades) => guardarLotes(lotesActuales.map(l=>l.id===loteId?{...l,unidadesRecibidas:Math.max(0,parseInt(unidades)||0)}:l));
                    const agregarPedidoLote = (loteId, fecha, despachados, entregados) => {
                        const entrada = { despachados: parseInt(despachados)||0, entregados: parseInt(entregados)||0, fecha: fecha || fechaLocalISO() };
                        guardarLotes(lotesActuales.map(l=>l.id===loteId?{...l,pedidos:[...(l.pedidos||[]),entrada]}:l));
                    };
                    const borrarPedidoLote = (loteId, idx) => {
                        guardarLotes(lotesActuales.map(l=>{
                            if (l.id!==loteId) return l;
                            const arr=[...(l.pedidos||[])]; arr.splice(idx,1); return {...l,pedidos:arr};
                        }));
                    };
                    const loteSel = lotesActuales.find(l=>l.id===loteActivo) || lotesActuales[0] || null;

                    const TABS = ['General','Inventario'];
                    const CONTENT_GROUPS = contenidoGrupos || [];
                    const analisis = p.analisis || {};
                    const analisisScore = ANALISIS_CHECKS.filter(([k,,,favorable='si'])=>(analisis.checks||{})[k]===favorable).length;
                    const angulosValidos = !!(analisis.angulo1Titulo && analisis.angulo1Titulo.trim());
                    const posibleGanador = analisisScore >= 6 && angulosValidos;
                    return (
                        <>
                            <div className="page-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
                                <div style={{display:'flex',alignItems:'center',gap:12}}>
                                    <button className="btn btn-glass btn-sm" onClick={()=>{setActiveProducto(null);setEditSeccion(null);}}>← Productos</button>
                                    <div>
                                        <h1 style={{display:'flex',alignItems:'center',gap:10}}>{p.nombre} <span className={`badge ${PROD_ESTADO_COLOR[p.estado]||'badge-gray'}`}><span className="badge-dot"/>{p.estado}</span></h1>
                                        {p.proveedor&&<p>{p.proveedor}</p>}
                                    </div>
                                </div>
                                <div style={{display:'flex',gap:8}}>
                                    <button className="btn btn-glass" onClick={()=>openEditProd(p)}>{I.edit} Editar</button>
                                    <button className="btn btn-glass" onClick={()=>{ if(confirm('¿Eliminar este producto?')) deleteProd(p.id); }} style={{color:'#8B3535'}}>Eliminar</button>
                                </div>
                            </div>

                            {/* Tabs */}
                            <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
                                {TABS.map(t=>(
                                    <button key={t} className={`btn ${productoTab===t.toLowerCase()?'btn-gold':'btn-glass'}`}
                                        onClick={()=>{setProductoTab(t.toLowerCase());setEditSeccion(null);}}>{t}</button>
                                ))}
                            </div>

                            {/* ── Tab General ── */}
                            {productoTab==='general' && (
                                <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:20,alignItems:'start'}}>

                                        <div style={{height:'260px',background:'var(--glass-bg-mid)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
                                            {p.imagen ? <img src={p.imagen} alt={p.nombre} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <span style={{fontSize:'64px'}}>📦</span>}
                                        </div>
                                        <div style={{padding:'14px 16px'}}>
                                            <div style={{fontSize:'11px',color:'var(--text-dimmer)',marginBottom:6,textTransform:'uppercase',letterSpacing:'1px',fontWeight:'700'}}>Estado</div>
                                            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                                {PROD_ESTADOS.map(e=>(
                                                    <button key={e} onClick={()=>{ db.collection('productos').doc(p.id).update({estado:e}).catch(console.error); setActiveProducto(prev=>({...prev,estado:e})); }}
                                                        className={`btn btn-sm ${p.estado===e?'btn-gold':'btn-glass'}`}>{e}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{display:'flex',flexDirection:'column',gap:16}}>
                                        <div className="card glass" style={{padding:'20px'}}>

                                                        const desp = (l.pedidos||[]).reduce((s,e)=>s+(e.despachados||0),0);

                                                    </div>

                                        <div className="card glass" style={{padding:'16px'}}>

                                            <div style={{fontFamily:'Fira Code',fontWeight:'700',fontSize:'20px',color:'var(--text)',marginTop:6}}>{unidadesVendidasCalc||'—'}</div>
                                        </div>
                                    </div>
                                </div>

                            {/* ── Tab Análisis ── */}

                                editSeccion==='analisis' ? (

                                            <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Nombre del proveedor</label><input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm.proveedor} onChange={e=>setAnalisisForm(f=>({...f,proveedor:e.target.value}))} /></div>
                                        </div>

                                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px'}}>
                                            {ANALISIS_CHECKS.map(([k,label,nota,favorable='si'])=>{
                                                const v = (analisisForm.checks||{})[k] || '';
                                                return (
                                                <div key={k} style={{padding:'10px 12px',borderRadius:10,background:'var(--surface-3)',border:'1px solid var(--glass-border)'}}>
                                                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
                                                        <span style={{fontSize:'12px',fontWeight:'600',color:'var(--text)',lineHeight:1.3}}>{label}</span>
                                                        <div style={{display:'flex',gap:5,flexShrink:0}}>
                                                            {['si','no'].map(opt=>{
                                                                const bueno = opt===favorable;
                                                                return (
                                                                    <button key={opt} onClick={()=>setAnalisisForm(f=>({...f,checks:{...(f.checks||{}),[k]:opt}}))}
                                                                        style={{padding:'4px 11px',borderRadius:7,fontSize:'10.5px',fontWeight:'700',cursor:'pointer',fontFamily:'inherit',textTransform:'uppercase',
                                                                            border:'1px solid '+(v===opt?(bueno?'rgba(74,120,89,0.4)':'rgba(160,56,56,0.35)'):'var(--glass-border)'),
                                                                            background:v===opt?(bueno?'rgba(74,120,89,0.14)':'rgba(160,56,56,0.10)'):'transparent',
                                                                            color:v===opt?(bueno?'#3D6646':'#A03B3B'):'var(--text-dimmer)'}}>{opt}</button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                    {nota && <div style={{fontSize:'10.5px',color:'var(--text-dimmer)',lineHeight:1.45,marginTop:6}}>{nota}</div>}
                                                </div>
                                                );
                                            })}
                                        </div>

                                        <div style={{margin:'22px 0 12px'}}>
                                            <span style={{fontSize:'11px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.2px'}}>Ángulos de venta</span>
                                        </div>
                                        {[['1','Principal'],['2','Secundario'],['3','Terciario']].map(([n,lbl])=>(
                                            <div key={n} style={{marginBottom:16,padding:'14px 16px',borderRadius:'var(--r-sm)',border:'1px solid var(--glass-border)',background:'var(--surface-2)'}}>
                                                <div style={{fontSize:'10px',fontWeight:'800',color:'var(--orange)',textTransform:'uppercase',letterSpacing:'1.5px',marginBottom:10}}>Ángulo #{n} — {lbl}</div>
                                                <div className="form-group" style={{marginBottom:8}}><label style={{color:'var(--text-dim)'}}>Título</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`angulo${n}Titulo`]} onChange={e=>setAnalisisForm(f=>({...f,[`angulo${n}Titulo`]:e.target.value}))} placeholder="Ej: Dolor de rodilla sin cirugía" /></div>
                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Descripción</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`angulo${n}Desc`]} onChange={e=>setAnalisisForm(f=>({...f,[`angulo${n}Desc`]:e.target.value}))} placeholder="Ej: Emocional / aspiracional — vida activa recuperada" /></div>
                                            </div>
                                        ))}

                                        <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.2px',margin:'22px 0 12px'}}>Análisis de competencia</div>
                                        {[['1'],['2']].map(([n])=>(
                                            <div key={n} style={{display:'grid',gridTemplateColumns:'1fr 140px',gap:10,marginBottom:10}}>
                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Nombre tienda #{n}</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`comp${n}Nombre`]} onChange={e=>setAnalisisForm(f=>({...f,[`comp${n}Nombre`]:e.target.value}))} placeholder="Ej: TiendaXY.com" /></div>
                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Precio</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`comp${n}Precio`]} onChange={e=>setAnalisisForm(f=>({...f,[`comp${n}Precio`]:e.target.value}))} placeholder="RD$1,500" /></div>
                                            </div>
                                        ))}

                                        <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.2px',margin:'22px 0 12px'}}>Creativo validado</div>
                                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
                                            {CREATIVO_CHECKS.map(([k,label,favorable='si'])=>{
                                                const v = (analisisForm.creativoChecks||{})[k];
                                                const setV = val => setAnalisisForm(f=>({...f, creativoChecks:{...(f.creativoChecks||{}),[k]:val}}));

                {activeTab === 'costeo' && (() => {
                    const productos = productosScoped; // filtrado por tienda activa (selector "Cargar producto")
                    const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
                    const conf = Math.min(Math.max(n(costeo.pctConfirmacion),1),100)/100;
                    const entr = Math.min(Math.max(n(costeo.pctEntrega),1),100)/100;
                    const tasa = Math.max(n(costeo.tasaCambio),1);
                    const carrier = costeo.logistica[costeo.logisticaActiva] || costeo.logistica[0] || {costoEnvio:'0',devolucionActiva:false};
                    const fleteAjustado = carrier.devolucionActiva ? n(carrier.costoEnvio)/entr : n(carrier.costoEnvio);
                    const cpaReal = n(costeo.cpaAds)/(conf*entr);
                    const extras = (costeo.costosExtra||[]).reduce((s,e)=>s+n(e.monto),0);
                    const suscripciones = (costeo.suscripciones||[]).reduce((s,e)=>s+n(e.monto),0);
                    const precio = n(costeo.precioVenta);
                    const costosOp = n(costeo.costoProducto) + fleteAjustado + extras + suscripciones;
                    const costosTotales = costosOp + cpaReal;
                    const profit = precio - costosTotales;
                    const roi = costosTotales>0 ? profit/costosTotales : 0;
                    const margenActual = precio>0 ? profit/precio*100 : 0;
                    const cpaBreakeven = precio - costosOp;
                    // Precio de comparación: el que subes en Shopify (compare_at_price). Se calcula como
                    // precio ÷ (1 - %) para que el badge de descuento de Shopify diga exactamente ese %
                    // (un markup directo, ej. precio×1.20, da un badge menor: 1900→2280 solo marca 17% off).
                    // Paquetes y downsells usan este número como referencia "antes", no el precio real,
                    // para que el % de descuento que ve el cliente se vea más alto.
                    const pctComp = Math.min(Math.max(n(costeo.pctComparacion), 0), 99) / 100;
                    const precioComparacion = precio / (1 - pctComp);
                    const mObj = n(costeo.margenObjetivo)/100;
                    const precioOptimoRaw = mObj<1 ? costosTotales/(1-mObj) : costosTotales;

                    const usd = costeoMoneda==='USD';
                    const sym = usd ? 'US$' : 'RD$';
                    const disp = v => usd ? v/tasa : v;
                    const fmt = (v,dec=0) => disp(v).toLocaleString('es-DO',{minimumFractionDigits:dec,maximumFractionDigits:dec});
                    const money = (v,dec=0) => `${sym}${fmt(v,dec)}`;
                    const segs = [
                        { label:'Producto (Costo)', val:n(costeo.costoProducto), color:'#3B82C4' },
                        { label:'Publicidad (CPA Real)', val:cpaReal, color:'var(--orange)' },
                        { label:'Flete '+(carrier.devolucionActiva?'(Ajustado)':'(Base)'), val:fleteAjustado, color:'#17493F' },
                        { label:'Extras (Empaque)', val:extras, color:'#FF7A63' },
                        { label:'Suscripciones', val:suscripciones, color:'#6B5FA8' },
                    ];
                    const upd = (k,v) => setCosteo(c=>({...c,[k]:v}));
                    const updCarrier = (i,k,v) => setCosteo(c=>({...c, logistica:c.logistica.map((l,idx)=>idx===i?{...l,[k]:v}:l)}));
                    const addCarrier = () => setCosteo(c=>({...c, logistica:[...c.logistica,{nombre:'Transportadora '+String.fromCharCode(65+c.logistica.length),costoEnvio:'150',devolucionActiva:false}], logisticaActiva:c.logistica.length}));
                    const delCarrier = (i) => setCosteo(c=>{ if(c.logistica.length<=1) return c; const logistica=c.logistica.filter((_,idx)=>idx!==i); return {...c, logistica, logisticaActiva:Math.min(c.logisticaActiva,logistica.length-1)};});
                    const updExtra = (i,k,v) => setCosteo(c=>({...c, costosExtra:c.costosExtra.map((e,idx)=>idx===i?{...e,[k]:v}:e)}));
                    const addExtra = () => setCosteo(c=>({...c, costosExtra:[...(c.costosExtra||[]),{nombre:'Nuevo costo',monto:'0'}]}));
                    const delExtra = (i) => setCosteo(c=>({...c, costosExtra:c.costosExtra.filter((_,idx)=>idx!==i)}));
                    const updSuscripcion = (i,k,v) => setCosteo(c=>({...c, suscripciones:(c.suscripciones||[]).map((e,idx)=>idx===i?{...e,[k]:v}:e)}));
                    const addSuscripcion = () => setCosteo(c=>({...c, suscripciones:[...(c.suscripciones||[]),{nombre:'Nueva suscripción',monto:'0'}]}));
                    const delSuscripcion = (i) => setCosteo(c=>({...c, suscripciones:(c.suscripciones||[]).filter((_,idx)=>idx!==i)}));
                    const addCalc = () => setCalcList(arr=>[...arr, (arr[arr.length-1]||0)+1]);
                    const delCalc = (id) => { try { sessionStorage.removeItem('calcStateV1_'+id); } catch {} setCalcList(arr=> arr.length<=1 ? arr : arr.filter(x=>x!==id)); };
                    const tabs = [['calculadora','Calculadora Precio'],['paquetes','Paquetes & Downsells'],['multi','Calculadoras'],['proyeccion','Proyección']];

                    // ── FUNCIONES PARA PAQUETES Y DOWNSELLS ──
                    // El precio base (precio) ya cubre flete, CPA y % de entrega/confirmación de UN pedido.
                    // Por cada unidad extra en el mismo pedido solo se suma su costo de producto + la misma
                    // ganancia unitaria (el envío, el CPA y las tasas de entrega/confirmación no se repiten).
                    const calcularPaquete = (unidades) => {
                        const costoUnit = n(costeo.costoProducto);
                        const precioFinal = precio + (unidades - 1) * (costoUnit + profit);
                        // Referencia "antes": el precio de comparación (el que se ve tachado en Shopify),
                        // no el precio real, para que el % de descuento mostrado sea más alto.
                        const precioSinCombo = precioComparacion * unidades;
                        const ahorro = precioSinCombo - precioFinal;
                        const descuentoEfectivo = precioSinCombo > 0 ? (ahorro / precioSinCombo) * 100 : 0;
                        const costosTotalPaq = costoUnit * unidades + fleteAjustado + extras + suscripciones + cpaReal;
                        const gananciaBruta = precioFinal - costosTotalPaq;
                        const margenPaq = precioFinal > 0 ? (gananciaBruta / precioFinal) * 100 : 0;
                        const roiPaq = costosTotalPaq > 0 ? gananciaBruta / costosTotalPaq : 0;
                        return { precioSinCombo, ahorro, descuentoEfectivo, precioFinal, costosTotalPaq, gananciaBruta, margenPaq, roiPaq, unidades };
                    };

                    // Downsell de N unidades: parte del precio real del paquete de N (calcularPaquete)
                    // y le aplica el % de descuento. Los costos no cambian con el descuento.
                    const calcularDownsell = (unidades, descuentoPct) => {
                        const basePaquete = calcularPaquete(unidades);
                        // El descuento real se aplica sobre el precio real del paquete: así se calculan
                        // bien la ganancia y el margen, que no pueden inflarse.
                        const precioDownsell = basePaquete.precioFinal * (1 - descuentoPct / 100);
                        const costosDownsell = basePaquete.costosTotalPaq;
                        const gananciaDownsell = precioDownsell - costosDownsell;
                        const margenDownsell = precioDownsell > 0 ? (gananciaDownsell / precioDownsell) * 100 : 0;
                        const margenMinimoPct = 10; // margen mínimo aceptable, aunque el precio esté rebajado
                        const esViable = margenDownsell >= margenMinimoPct;
                        // "Antes" que ve el cliente: el precio de comparación (Shopify) de ese mismo paquete,
                        // no el precio real. Por eso el % de descuento mostrado es más alto que el descuentoPct.
                        const precioBase = precioComparacion + (unidades - 1) * (n(costeo.costoProducto) + profit);
                        const descuentoVisual = precioBase > 0 ? ((precioBase - precioDownsell) / precioBase) * 100 : 0;
                        return { precioBase, precioDownsell, gananciaDownsell, margenDownsell, esViable, margenMinimoPct, descuentoVisual };
                    };

                    return <>
                    <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
                        <div><h1>Calculadora de Costeo 🇩🇴</h1><p>Define tu precio de venta ideal para asegurar un margen saludable por cada unidad vendida.</p></div>
                        <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            <div style={{display:'flex',background:'var(--cream-dark)',borderRadius:10,padding:3,border:'1px solid var(--glass-border)'}}>
                                {['DOP','USD'].map(m=>(
                                    <button key={m} onClick={()=>setCosteoMoneda(m)} className="cst-tab" style={{padding:'7px 14px',...(costeoMoneda===m?{background:'var(--surface-3)',color:'var(--orange)',boxShadow:'0 1px 4px rgba(11,38,34,0.10)'}:{})}}>{m}</button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="cst-tabbar">
                        {tabs.map(([k,label])=>(
                            <button key={k} className={`cst-tab ${costeoTab===k?'active':''}`} onClick={()=>setCosteoTab(k)}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {costeoTab==='proyeccion' ? (
                        <div className="card glass" style={{padding:'32px 28px'}}>
                            <div style={{fontSize:14,fontWeight:800,marginBottom:6}}>¿Cuántas unidades planeas vender?</div>
                            <p style={{fontSize:12,color:'var(--text-dimmer)',marginBottom:24}}>Basado en la utilidad neta por unidad de Calculadora Precio: <strong style={{color:profit>=0?'var(--orange)':'#A03B3B'}}>{money(profit)}</strong> c/u.</p>
                            <input type="range" min="1" max="1000" step="1" value={proyeccionCantidad}
                                onChange={e=>setProyeccionCantidad(parseInt(e.target.value)||1)}
                                style={{width:'100%',accentColor:'var(--orange)'}} />
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10}}>
                                <span style={{fontSize:11,color:'var(--text-dimmer)'}}>1</span>
                                <span style={{fontSize:22,fontWeight:800,fontFamily:'Fira Code',color:'var(--text)'}}>{proyeccionCantidad} unidades</span>
                                <span style={{fontSize:11,color:'var(--text-dimmer)'}}>1000</span>
                            </div>
                            <div style={{marginTop:28,padding:'22px 26px',borderRadius:14,background:profit>=0?'var(--orange-dim)':'rgba(160,56,56,0.08)',border:`1px solid ${profit>=0?'var(--orange-border)':'rgba(160,56,56,0.24)'}`}}>
                                <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:6}}>Utilidad neta proyectada</div>
                                <div style={{fontSize:34,fontWeight:800,fontFamily:'Fira Code',color:profit>=0?'var(--orange)':'#A03B3B'}}>{money(profit*proyeccionCantidad)}</div>
                            </div>
                        </div>
                    ) : costeoTab==='paquetes' ? (
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
                            {/* PAQUETES */}
                            <div className="card glass" style={{padding:'26px 28px'}}>
                                <div style={{fontSize:15,fontWeight:800,color:'var(--text)',marginBottom:20}}>📦 Paquetes (Mismo Producto)</div>
                                <p style={{fontSize:12,color:'var(--text-dim)',marginBottom:18}}>Crear ofertas con múltiples unidades del mismo producto a descuento progresivo.</p>
                                <div style={{display:'flex',flexDirection:'column',gap:14}}>
                                    {(costeo.paquetes||[]).map((paq,i)=>{
                                        const calcPaq = calcularPaquete(paq.unidades);
                                        return (
                                            <div key={i} style={{padding:'16px',borderRadius:12,background:'var(--surface-3)',border:'1px solid var(--glass-border)',cursor:'pointer'}} onClick={()=>setPaqueteSeleccionado(i)} className={paqueteSeleccionado===i?'':''}>
                                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'start',marginBottom:12}}>
                                                    <div>
                                                        <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:4}}>{paq.nombre}</div>
                                                        <div style={{fontSize:11,color:'var(--text-dimmer)'}}>{money(precio)} + {paq.unidades-1} × ({money(n(costeo.costoProducto))} costo + {money(profit)} ganancia)</div>
                                                    </div>
                                                    <div style={{textAlign:'right'}}>
                                                        <div style={{fontSize:11,color:'var(--text-dimmer)',textDecoration:'line-through'}}>{money(calcPaq.precioSinCombo)}</div>
                                                        <span style={{fontSize:18,fontWeight:800,color:'var(--orange)',fontFamily:'Fira Code'}}>{money(calcPaq.precioFinal)}</span>
                                                        <div style={{fontSize:10,fontWeight:700,color:'var(--orange)'}}>−{calcPaq.descuentoEfectivo.toFixed(1)}% de descuento real</div>
                                                    </div>
                                                </div>
                                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,fontSize:11}}>

                                                        <div style={{color:calcPaq.margenPaq>=30?'var(--orange)':'#FF7A63',fontWeight:700}}>{calcPaq.margenPaq.toFixed(1)}%</div>
                                                    </div>
                                                </div>

                                        );

                                    ))}
                                </div>
                                <div style={{display:'flex',flexDirection:'column',gap:14}}>
                                    {[5,10,15].map((desc)=>{
                                        const calcDown = calcularDownsell(downsellUnidades, desc);
                                        return (
                                            <div key={desc} style={{padding:'16px',borderRadius:12,background:calcDown.esViable?'var(--orange-dim)':'rgba(160,56,56,0.08)',border:`1px solid ${calcDown.esViable?'var(--orange-border)':'rgba(160,56,56,0.24)'}`,cursor:'pointer'}} onClick={()=>setDownsellSeleccionado(desc)}>
                                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'start',marginBottom:12}}>
                                                    <div>
                                                        <div style={{fontSize:13,fontWeight:700,color:calcDown.esViable?'var(--text)':'#A03B3B',marginBottom:4}}>−{desc}% descuento real · −{calcDown.descuentoVisual.toFixed(1)}% en Shopify</div>
                                                        <div style={{fontSize:11,color:'var(--text-dimmer)'}}><span style={{textDecoration:'line-through'}}>{money(calcDown.precioBase)}</span> → {money(calcDown.precioDownsell)}</div>
                                                    </div>
                                                    <span style={{fontSize:16,fontWeight:800,color:calcDown.esViable?'var(--orange)':'#A03B3B',fontFamily:'Fira Code'}}>{calcDown.esViable?'✓':'✗'}</span>
                                                </div>
                                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,fontSize:11}}>
                                                    <div style={{padding:'8px',background:'rgba(0,0,0,0.04)',borderRadius:8}}>
                                                        <div style={{color:'var(--text-dimmer)',fontSize:'10px',marginBottom:2}}>Ganancia</div>
                                                        <div style={{color:calcDown.esViable?'var(--orange)':'#A03B3B',fontWeight:700}}>{money(calcDown.gananciaDownsell)}</div>
                                                    </div>
                                                    <div style={{padding:'8px',background:'rgba(0,0,0,0.04)',borderRadius:8}}>
                                                        <div style={{color:'var(--text-dimmer)',fontSize:'10px',marginBottom:2}}>Margen</div>
                                                        <div style={{color:calcDown.esViable?'var(--orange)':'#A03B3B',fontWeight:700}}>{calcDown.margenDownsell.toFixed(1)}%</div>
                                                    </div>
                                                </div>
                                                {!calcDown.esViable && <div style={{marginTop:10,fontSize:10,color:'#A03B3B',fontWeight:600}}>⚠️ Con este descuento el margen queda en {calcDown.margenDownsell.toFixed(1)}%, por debajo del mínimo de {calcDown.margenMinimoPct}%</div>}
                                            </div>

                                </div>
                            </div>
                        </div>
                    ) : costeoTab==='multi' ? (
                    <div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}}>
                            <p style={{fontSize:12,color:'var(--text-dimmer)',maxWidth:540}}>Calculadoras normales de suma, resta, multiplicación y división — para cuentas rápidas del día a día.</p>
                            <button className="cst-add-btn" onClick={addCalc}>+ Agregar calculadora</button>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:16}}>

                                <BasicCalculator key={id} id={id} title={`Calculadora ${i+1}`} removable={calcList.length>1} onRemove={()=>delCalc(id)} />
                            ))}
                        </div>
                    </div>
                    ) : (
                    <div className="cst-grid">
                        {/* ── PANEL DE PARÁMETROS ── */}
                        <div className="card glass cst-panel">
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                                <div style={{fontSize:'15px',fontWeight:'800',color:'var(--text)',letterSpacing:'-0.3px'}}>Parámetros</div>
                                <button className="cst-add-btn" onClick={()=>setCosteo({...COSTEO_DEFAULTS})}>↺ Reset</button>
                            </div>

                            {productos.length>0 && (
                                <div style={{marginBottom:18,padding:'12px 14px',borderRadius:12,background:'var(--orange-dim)',border:'1px solid var(--orange-border)'}}>
                                    <label className="cst-field-label" style={{color:'var(--orange)'}}>⭐ Cargar producto guardado</label>
                                    <select className="cst-input" style={{fontFamily:'inherit',fontWeight:'600',fontSize:'13px'}} value={costeo.productoIdCargado||''}
                                        onChange={e=>{
                                            const prod = productos.find(x=>x.id===e.target.value); if(!prod) return;
                                            const a = prod.analisis||{}; const inv = prod.inventario||{};
                                            const pp = a.precioProveedor || inv.precioCompra || '';
                                            setCosteo(c=>({...c, costoProducto:String(pp||c.costoProducto), productoIdCargado:prod.id}));
                                        }}>
                                        <option value="">Selecciona un producto…</option>
                                        {productos.map(prod=>(<option key={prod.id} value={prod.id}>{prod.nombre}</option>))}
                                    </select>
                                </div>
                            )}

                            <div style={{marginBottom:18}}>
                                <label className="cst-field-label">Precio de Venta (RD$)</label>
                                <div className="cst-input-wrap">
                                    <span className="cst-prefix">$</span>
                                    <input type="number" className="cst-input has-prefix" value={costeo.precioVenta} onChange={e=>upd('precioVenta',e.target.value)} />
                                </div>
                            </div>

                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:22}}>
                                <div>
                                    <label className="cst-field-label">Costo Producto</label>
                                    <div className="cst-input-wrap"><span className="cst-prefix">$</span>
                                        <input type="number" className="cst-input has-prefix" value={costeo.costoProducto} onChange={e=>upd('costoProducto',e.target.value)} /></div>
                                </div>
                                <div>
                                    <label className="cst-field-label">CPA (Ads)</label>
                                    <div className="cst-input-wrap"><span className="cst-prefix">$</span>
                                        <input type="number" className="cst-input has-prefix" value={costeo.cpaAds} onChange={e=>upd('cpaAds',e.target.value)} /></div>
                                </div>
                            </div>

                            <div className="cst-sec-label">Tasas de conversión</div>
                            {(() => {
                                const dxConf = DX('confirmacion', n(costeo.pctConfirmacion));
                                const dxEntr = DX('entrega', n(costeo.pctEntrega));
                                const colConf = dxConf ? DX_COLORS[dxConf.nivel].dot : 'var(--orange)';
                                const colEntr = dxEntr ? DX_COLORS[dxEntr.nivel].dot : 'var(--orange)';
                                return <>
                                <div style={{marginBottom:16}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8,flexWrap:'wrap'}}>
                                        <span style={{fontSize:'12px',fontWeight:'600',color:'var(--text-dim)'}}>Confirmación</span>
                                        <span style={{display:'flex',alignItems:'center',gap:7}}><DxBadge tipo="confirmacion" valor={n(costeo.pctConfirmacion)} /><span style={{fontSize:'13px',fontWeight:'800',fontFamily:'Fira Code',color:colConf}}>{n(costeo.pctConfirmacion)}%</span></span>
                                    </div>
                                    <input type="range" min="1" max="100" className="cst-range" value={n(costeo.pctConfirmacion)} onChange={e=>upd('pctConfirmacion',e.target.value)}
                                        style={{background:`linear-gradient(90deg, ${colConf} ${n(costeo.pctConfirmacion)}%, var(--stone) ${n(costeo.pctConfirmacion)}%)`}} />
                                </div>
                                <div style={{marginBottom:22}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8,flexWrap:'wrap'}}>
                                        <span style={{fontSize:'12px',fontWeight:'600',color:'var(--text-dim)'}}>Entrega efectiva</span>
                                        <span style={{display:'flex',alignItems:'center',gap:7}}><DxBadge tipo="entrega" valor={n(costeo.pctEntrega)} /><span style={{fontSize:'13px',fontWeight:'800',fontFamily:'Fira Code',color:colEntr}}>{n(costeo.pctEntrega)}%</span></span>
                                    </div>
                                    <input type="range" min="1" max="100" className="cst-range" value={n(costeo.pctEntrega)} onChange={e=>upd('pctEntrega',e.target.value)}
                                        style={{background:`linear-gradient(90deg, ${colEntr} ${n(costeo.pctEntrega)}%, var(--stone) ${n(costeo.pctEntrega)}%)`}} />
                                    <div style={{fontSize:'10px',color:'var(--text-dimmer)',marginTop:7,lineHeight:1.5}}>De cada 100 pedidos que genera el anuncio, cuántos terminas entregando. Saludable: Confirmación 70%+, Entrega 80%+.</div>
                                </div>
                                </>;
                            })()}

                            <div className="cst-sec-label" style={{justifyContent:'space-between'}}>
                                <span>🚚 Logística</span>
                                <button className="cst-add-btn" onClick={addCarrier}>+ Nueva</button>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:22}}>
                                {costeo.logistica.map((l,i)=>{
                                    const sel = i===costeo.logisticaActiva;
                                    return (
                                    <div key={i} className={`cst-logi-card ${sel?'sel':''}`} onClick={()=>upd('logisticaActiva',i)}>
                                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>

                                            <div style={{display:'flex',gap:6,alignItems:'center'}}>
                                                {sel && <span style={{fontSize:'9px',fontWeight:'700',color:'var(--orange)',textTransform:'uppercase',letterSpacing:'1px'}}>Activa</span>}

                                        <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
                                            <div style={{flex:1}}>

                            <div className="cst-sec-label" style={{justifyContent:'space-between'}}>

                                    <button className="btn btn-glass" onClick={()=>{setShowLinkModal(false);setEditingLink(null);}}>Cancelar</button>
