                                    <div style={{display:'flex',gap:6}}>
                                        {[
                                            {label:'Este mes', fn:()=>{ const n=new Date(); setDashDesde(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`); setDashHasta(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`); }},
                                            {label:'Mes anterior', fn:()=>{ const n=new Date(new Date().getFullYear(),new Date().getMonth()-1,1); const ult=new Date(new Date().getFullYear(),new Date().getMonth(),0); setDashDesde(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`); setDashHasta(`${ult.getFullYear()}-${String(ult.getMonth()+1).padStart(2,'0')}-${String(ult.getDate()).padStart(2,'0')}`); }},
                                            {label:'Este año', fn:()=>{ const y=new Date().getFullYear(); const n=new Date(); setDashDesde(`${y}-01-01`); setDashHasta(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`); }},
                                        ].map(({label,fn})=>(
                                            <button key={label} className="btn btn-glass btn-sm" onClick={fn}>{label}</button>
                                        ))}
                                    </div>
                                </div>

                                {/* KPIs separados por moneda */}
                                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:20}}>
                                    {[
                                        {label:'Total USD',    val:`$${tUSD.toFixed(2)}`,    sub:`${enRango.filter(g=>g.moneda!=='DOP').length} gastos`,  v:'gold'},
                                        {label:'Total DOP',    val:`RD$${tDOP.toFixed(0)}`,  sub:`${enRango.filter(g=>g.moneda==='DOP').length} gastos`,   v:'white'},
                                        {label:'Pendiente USD',val:`$${pUSD.toFixed(2)}`,    sub:'créditos sin pagar',  v: pUSD>0?'gold':'white'},
                                        {label:'Pendiente DOP',val:`RD$${pDOP.toFixed(0)}`,  sub:'créditos sin pagar',  v: pDOP>0?'gold':'white'},
                                        ...(arrUSD>0||arrDOP>0?[{label:'Arrastre anterior',val: arrUSD>0?`$${arrUSD.toFixed(0)}`:`RD$${arrDOP.toFixed(0)}`,sub:'saldo meses previos',v:'white',rojo:true}]:[]),
                                    ].map((k,i)=>(
                                        <div key={i} className={`kpi-card glass ${i%2===0?'glass-mid':''}`} style={k.rojo?{borderTop:'2px solid #8B3535'}:{}}>
                                            <div className="kpi-top"><div className="kpi-label">{k.label}</div><div className={`kpi-icon ${k.v}`}>{I.dollar}</div></div>
                                            <div className="kpi-val" style={{fontSize:'20px',color:k.rojo?'#8B3535':'var(--text)'}}>{k.val}</div>
                                            <div className="kpi-sub">{k.sub}</div>
                                        </div>
                                    ))}
                                </div>

                                {/* Resumen por categoría */}
                                {porCat.length > 0 && <>
                                    <div className="sec-header" style={{marginBottom:10}}><h2>Por categoría</h2></div>
                                    <div className="card glass" style={{marginBottom:20}}>
                                        <table>
                                            <thead><tr><th>Categoría</th><th>Gastos</th><th>Total USD</th><th>Total DOP</th></tr></thead>
                                            <tbody>
                                                {porCat.map(({cat,usd,dop,n})=>(
                                                    <tr key={cat}>
                                                        <td><strong>{cat}</strong></td>
                                                        <td style={{color:'var(--text-dim)'}}>{n}</td>
                                                        <td className="td-num">{usd>0?<strong>${usd.toFixed(2)}</strong>:'—'}</td>
                                                        <td className="td-num">{dop>0?<strong>RD${dop.toFixed(0)}</strong>:'—'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </>}

                                {/* Resumen mensual */}
                                {mesesRango.length > 1 && <>
                                    <div className="sec-header" style={{marginBottom:10}}><h2>Por mes</h2></div>
                                    <div className="card glass" style={{marginBottom:20}}>
                                        <table>
                                            <thead><tr><th>Mes</th><th>Gastos</th><th>USD</th><th>DOP</th><th>Pend. USD</th><th>Pend. DOP</th></tr></thead>
                                            <tbody>
                                                {mesesRango.map(key=>{
                                                    const lst=enRango.filter(g=>keyOf(g)===key);
                                                    const [y,m]=key.split('-');
                                                    const label=new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
                                                    return (
                                                        <tr key={key} style={{cursor:'pointer'}} onClick={()=>{setMesSeleccionado(key);setGastoVista('mensual');}}>
                                                            <td style={{fontWeight:'600',color:'var(--sand-dark)',textDecoration:'underline',textUnderlineOffset:'3px'}}>{label}</td>
                                                            <td style={{color:'var(--text-dim)'}}>{lst.length}</td>
                                                            <td className="td-num">{sumUSD(lst)>0?`$${sumUSD(lst).toFixed(0)}`:'—'}</td>
                                                            <td className="td-num">{sumDOP(lst)>0?`RD$${sumDOP(lst).toFixed(0)}`:'—'}</td>
                                                            <td className="td-num" style={{color:pendUSD(lst)>0?'var(--sand-dark)':'var(--text-dimmer)'}}>{pendUSD(lst)>0?`$${pendUSD(lst).toFixed(0)}`:'—'}</td>
                                                            <td className="td-num" style={{color:pendDOP(lst)>0?'var(--sand-dark)':'var(--text-dimmer)'}}>{pendDOP(lst)>0?`RD$${pendDOP(lst).toFixed(0)}`:'—'}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </>}

                                {enRango.length===0 && <div className="card glass"><div className="empty"><div className="empty-icon">{I.dollar}</div><h3>Sin gastos en este período</h3><p>Ajusta las fechas o registra un nuevo gasto.</p></div></div>}
                            </>
                        );
                    }

                    // ── Vista mensual ──
                    if (!activeCat && gastoVista === 'mensual') {
                        const mesLabel = key => { const [y,m]=key.split('-'); return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'}); };
                        const navMes = delta => {
                            const [y,m] = mesSeleccionado.split('-').map(Number);
                            const d = new Date(y, m-1+delta, 1);
                            setMesSeleccionado(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
                        };
                        const keyOf = g => { const d=g.fecha?.toDate?.(); if(!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
                        const gastosDelMes     = gastos.filter(g => keyOf(g) === mesSeleccionado);
                        const gastosAnteriores = gastos.filter(g => keyOf(g) < mesSeleccionado && keyOf(g) !== '');
                        const tMesUSD = sumUSD(gastosDelMes), tMesDOP = sumDOP(gastosDelMes);
                        const creditosMes      = gastosDelMes.filter(g=>g.esCredito);
                        const pMesUSD = pendUSD(gastosDelMes), pMesDOP = pendDOP(gastosDelMes);
                        const arrUSD = pendUSD(gastosAnteriores), arrDOP = pendDOP(gastosAnteriores);
                        const totalRegularizar = pMesUSD + pMesDOP + arrUSD + arrDOP;

                        return (
                            <>
                                {navBar}
                                <div className="page-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                    <h1>Gastos — {mesLabel(mesSeleccionado)}</h1>
                                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                                        <button className="btn btn-glass btn-sm" onClick={()=>navMes(-1)}>← Anterior</button>
                                        <button className="btn btn-glass btn-sm" onClick={()=>navMes(1)}>Siguiente →</button>
                                    </div>
                                </div>

                                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:20}}>
                                    {[
                                        {label:'USD gastado',    val:`$${tMesUSD.toFixed(2)}`,    sub:`${gastosDelMes.filter(g=>g.moneda!=='DOP').length} gastos`, v:'gold'},
                                        {label:'DOP gastado',    val:`RD$${tMesDOP.toFixed(0)}`,  sub:`${gastosDelMes.filter(g=>g.moneda==='DOP').length} gastos`,  v:'white'},
                                        {label:'Pend. USD mes',  val:`$${pMesUSD.toFixed(2)}`,    sub:`${creditosMes.filter(g=>g.moneda!=='DOP').length} créditos`,  v: pMesUSD>0?'gold':'white'},
                                        {label:'Pend. DOP mes',  val:`RD$${pMesDOP.toFixed(0)}`,  sub:`${creditosMes.filter(g=>g.moneda==='DOP').length} créditos`,  v: pMesDOP>0?'gold':'white'},
                                        ...(arrUSD>0?[{label:'Arrastre USD', val:`$${arrUSD.toFixed(0)}`,   sub:'meses anteriores', v:'white', rojo:true}]:[]),
                                        ...(arrDOP>0?[{label:'Arrastre DOP', val:`RD$${arrDOP.toFixed(0)}`, sub:'meses anteriores', v:'white', rojo:true}]:[]),
                                    ].map((k,i)=>(
                                        <div key={i} className={`kpi-card glass ${i%2===0?'glass-mid':''}`} style={k.rojo?{borderTop:'2px solid #8B3535'}:{}}>
                                            <div className="kpi-top"><div className="kpi-label">{k.label}</div><div className={`kpi-icon ${k.v}`}>{I.dollar}</div></div>
                                            <div className="kpi-val" style={{fontSize:'19px',color:k.rojo?'#8B3535':'var(--text)'}}>{k.val}</div>
                                            <div className="kpi-sub">{k.sub}</div>
                                        </div>
                                    ))}
                                </div>

                                {totalRegularizar > 0 && (
                                    <div style={{background:'rgba(139,53,53,0.07)',border:'1px solid rgba(139,53,53,0.2)',borderRadius:'var(--r)',padding:'14px 20px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
                                        <div>
                                            <div style={{fontWeight:'700',color:'#8B3535',fontSize:'13px'}}>Total a regularizar</div>
                                            <div style={{fontSize:'11.5px',color:'var(--text-dim)',marginTop:2}}>
                                                {pMesUSD>0?`$${pMesUSD.toFixed(0)} USD del mes`:''}
                                                {pMesDOP>0?` · RD$${pMesDOP.toFixed(0)} DOP del mes`:''}
                                                {arrUSD>0?` + $${arrUSD.toFixed(0)} arrastre USD`:''}
                                                {arrDOP>0?` + RD$${arrDOP.toFixed(0)} arrastre DOP`:''}
                                            </div>
                                        </div>
                                        <div style={{display:'flex',gap:12}}>
                                            {(pMesUSD+arrUSD)>0&&<span style={{fontFamily:'Fira Code',fontWeight:'700',fontSize:'18px',color:'#8B3535'}}>${(pMesUSD+arrUSD).toFixed(0)} USD</span>}
                                            {(pMesDOP+arrDOP)>0&&<span style={{fontFamily:'Fira Code',fontWeight:'700',fontSize:'18px',color:'#8B3535'}}>RD${(pMesDOP+arrDOP).toFixed(0)}</span>}
                                        </div>
                                    </div>
                                )}

                                <div className="card glass">
                                    {gastosDelMes.length > 0 ? (
                                        <table>
                                            <thead><tr><th>Categoría</th><th>Descripción</th><th>Proveedor</th><th>Pago</th><th>Monto</th><th>Estado crédito</th><th></th></tr></thead>
                                            <tbody>
                                                {gastosDelMes.map((g,i)=>{
                                                    const sym = g.moneda==='DOP'?'RD$':'$';
                                                    const restante = Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                                    return (
                                                        <tr key={i}>
                                                            <td><span className="badge badge-gray"><span className="badge-dot"/>{g.categoria}</span></td>
                                                            <td><strong>{g.descripcion||'—'}</strong></td>
                                                            <td style={{color:'var(--text-dim)',fontSize:'12px'}}>{g.proveedor||'—'}</td>
                                                            <td style={{fontSize:'12px'}}>{g.medioPago}{g.terminal?` · ${g.terminal}`:''}<br/><span style={{color:'var(--text-dimmer)',fontSize:'10.5px'}}>{g.propietario}</span></td>
                                                            <td className="td-num"><strong>{sym}{(g.monto||0).toFixed(2)}</strong></td>
                                                            <td>
                                                                {!g.esCredito
                                                                    ? <span className="badge badge-gray"><span className="badge-dot"/>Contado</span>
                                                                    : restante<=0
                                                                        ? <span className="badge badge-green"><span className="badge-dot"/>Pagado</span>
                                                                        : (g.montoAbonado||0)>0
                                                                            ? <><span className="badge badge-gold"><span className="badge-dot"/>Abonado</span><br/><span style={{fontSize:'11px',color:'var(--sand-dark)',fontFamily:'Fira Code'}}>{sym}{restante.toFixed(0)} resta</span></>
                                                                            : <span className="badge badge-gray"><span className="badge-dot"/>Pendiente</span>}
                                                            </td>
                                                            <td>
                                                                <div style={{display:'flex',gap:6}}>
                                                                    <button className="btn btn-glass btn-sm" onClick={()=>openEditGasto(g)}>{I.edit} Editar</button>
                                                                    {g.esCredito&&restante>0&&<button className="btn btn-glass btn-sm" onClick={()=>{setSelectedGasto(g);setAbonoMonto('');setShowAbonoModal(true);}}>+ Abono</button>}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <div className="empty">
                                            <div className="empty-icon">{I.dollar}</div>
                                            <h3>Sin gastos en {mesLabel(mesSeleccionado)}</h3>
                                            <p>Registra el primer gasto de este mes.</p>
                                        </div>
                                    )}
                                </div>

                                {(arrUSD+arrDOP) > 0 && gastosAnteriores.filter(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0).length > 0 && (
                                    <>
                                        <div className="sec-header" style={{marginTop:24}}>
                                            <h2 style={{color:'#8B3535'}}>Saldo arrastrado de meses anteriores</h2>
                                        </div>
                                        <div className="card glass">
                                            <table>
                                                <thead><tr><th>Mes</th><th>Descripción</th><th>Categoría</th><th>Total</th><th>Abonado</th><th>Pendiente</th><th></th></tr></thead>
                                                <tbody>
                                                    {gastosAnteriores.filter(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0).map((g,i)=>{
                                                        const sym=g.moneda==='DOP'?'RD$':'$';
                                                        const restante=Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                                        const d=g.fecha?.toDate?.();
                                                        return (
                                                            <tr key={i}>
                                                                <td style={{fontSize:'12px',color:'var(--text-dimmer)',fontFamily:'Fira Code'}}>{d?d.toLocaleDateString('es-CO',{month:'short',year:'numeric'}):'—'}</td>
                                                                <td><strong>{g.descripcion||'—'}</strong></td>
                                                                <td><span className="badge badge-gray"><span className="badge-dot"/>{g.categoria}</span></td>
                                                                <td className="td-num">{sym}{(g.monto||0).toFixed(0)}</td>
                                                                <td className="td-num" style={{color:'var(--text-dim)'}}>{sym}{(g.montoAbonado||0).toFixed(0)}</td>
                                                                <td className="td-num" style={{color:'#8B3535',fontWeight:'700'}}>{sym}{restante.toFixed(0)}</td>
                                                                <td><button className="btn btn-glass btn-sm" onClick={()=>{setSelectedGasto(g);setAbonoMonto('');setShowAbonoModal(true);}}>+ Abono</button></td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                )}
                            </>
                        );
                    }

                    // ── Vista por medio de pago ──
                    if (!activeCat && gastoVista === 'pago') {
                        // Agrupa: { key: label, gastos: [...] }
                        const grupos = {};
                        gastos.forEach(g => {
                            const key = g.medioPago === 'Tarjeta' && g.terminal
                                ? `Tarjeta — ${g.terminal}`
                                : g.medioPago || 'Efectivo';
                            if (!grupos[key]) grupos[key] = [];
                            grupos[key].push(g);
                        });

                        if (activePago) {
                            const lista = grupos[activePago] || [];
                            const total = lista.reduce((s,g)=>s+(g.monto||0),0);
                            return (
                                <>
                                    {navBar}
                                    <div className="page-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                        <div style={{display:'flex',alignItems:'center',gap:14}}>
                                            <button className="btn btn-glass btn-sm" onClick={()=>setActivePago(null)}>← Tarjetas</button>
                                            <div><h1>{activePago}</h1><p>{lista.length} gasto{lista.length!==1?'s':''} · ${total.toFixed(2)} total</p></div>
                                        </div>
                                    </div>
                                    <div className="card glass">
                                        {lista.length > 0 ? (
                                            <table>
                                                <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Proveedor</th><th>Monto</th><th>Estado</th></tr></thead>
                                                <tbody>
                                                    {lista.map((g,i)=>{
                                                        const sym = g.moneda==='DOP'?'RD$':'$';
                                                        const restante = Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                                        return (
                                                            <tr key={i}>
                                                                <td className="td-num" style={{color:'var(--text-dimmer)',fontSize:'12px'}}>{g.fecha?.toDate?.().toLocaleDateString('es-CO')||'—'}</td>
                                                                <td><strong>{g.descripcion||'—'}</strong></td>
                                                                <td><span className="badge badge-gray"><span className="badge-dot"/>{g.categoria}</span></td>
                                                                <td style={{color:'var(--text-dim)'}}>{g.proveedor||'—'}</td>
                                                                <td className="td-num"><strong>{sym}{(g.monto||0).toFixed(2)}</strong></td>
                                                                <td>{!g.esCredito
                                                                    ? <span className="badge badge-gray"><span className="badge-dot"/>Contado</span>
                                                                    : restante<=0
                                                                        ? <span className="badge badge-green"><span className="badge-dot"/>Pagado</span>
                                                                        : <span className="badge badge-gold"><span className="badge-dot"/>Pendiente</span>}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        ) : <div className="empty"><div className="empty-icon">{I.dollar}</div><h3>Sin gastos</h3></div>}
                                    </div>
                                </>
                            );
                        }

                        return (
                            <>
                                {navBar}
                                <div className="page-header"><h1>Tarjetas y medios de pago</h1><p>Gastos agrupados por método de pago</p></div>
                                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12}}>
                                    {Object.entries(grupos).map(([key, lista]) => {
                                        const total = lista.reduce((s,g)=>s+(g.monto||0),0);
                                        const pendientes = lista.filter(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0).length;
                                        return (
                                            <div key={key} className="card glass"
                                                style={{padding:'22px 18px',cursor:'pointer',transition:'transform var(--t-fast),box-shadow var(--t-fast)'}}
                                                onClick={()=>setActivePago(key)}
                                                onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.08)';}}
                                                onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='';}}>
                                                <div style={{fontSize:'13.5px',fontWeight:'600',color:'var(--text)',marginBottom:6}}>{key}</div>
                                                <div style={{fontFamily:'Fira Code',fontWeight:'700',fontSize:'18px',color:'var(--text)',letterSpacing:'-0.5px',marginBottom:4}}>${total.toFixed(0)}</div>
                                                <div style={{fontSize:'11px',color:'var(--text-dimmer)'}}>{lista.length} gasto{lista.length!==1?'s':''}</div>
                                                {pendientes>0 && <span className="badge badge-gold" style={{fontSize:'10px',marginTop:8}}><span className="badge-dot"/>{pendientes} pendiente{pendientes>1?'s':''}</span>}
                                            </div>
                                        );
                                    })}
                                    {Object.keys(grupos).length === 0 && <div className="empty" style={{gridColumn:'1/-1'}}><div className="empty-icon">{I.dollar}</div><h3>Sin gastos aún</h3></div>}
                                </div>
                            </>
                        );
                    }

                    if (!activeCat) return (
                        <>
                            {navBar}
                            <div className="page-header"><h1>Gastos</h1><p>Selecciona una categoría para ver el detalle</p></div>
                            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(148px,1fr))', gap:12}}>
                                {CATEGORIAS.map(cat => {
                                    const pendientes = gastos.filter(g=>g.categoria===cat&&g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0).length;
                                    return (
                                        <div key={cat} className="card glass"
                                            style={{padding:'22px 18px', cursor:'pointer', transition:'transform var(--t-fast), box-shadow var(--t-fast)'}}
                                            onClick={()=>setActiveCat(cat)}
                                            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.08)';}}
                                            onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='';}}>
                                            <div style={{fontSize:'13.5px',fontWeight:'600',color:'var(--text)',marginBottom:pendientes?8:0}}>{cat}</div>
                                            {pendientes>0 && <span className="badge badge-gold" style={{fontSize:'10px'}}><span className="badge-dot"/>{pendientes} crédito{pendientes>1?'s':''} pendiente{pendientes>1?'s':''}</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    );
                    // ── Dashboard por categoría ──
                    const navBarCat = (
                        <div className="sec-header" style={{marginBottom:20}}>
                            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                                <button className="btn btn-glass" onClick={()=>{setActiveCat(null);setGastoVista('dashboard');}}>Dashboard</button>
                                <button className="btn btn-gold" onClick={()=>setActiveCat(null)}>← Categorías</button>
                                <button className="btn btn-glass" onClick={()=>{setActiveCat(null);setGastoVista('pago');setActivePago(null);}}>Tarjetas</button>
                                <button className="btn btn-glass" onClick={()=>{setActiveCat(null);setGastoVista('mensual');}}>Meses</button>
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                {gastos.some(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0) && (
                                    <button className="btn btn-glass" onClick={()=>setShowPagoRapidoModal(true)}>{I.dollar} Registrar Pago</button>
                                )}
                                <button className="btn btn-gold" onClick={()=>{setGastoForm(f=>({...f,categoria:activeCat}));setShowGastoModal(true);}}>{I.plus} Nuevo Gasto</button>
                            </div>
                        </div>
                    );
                    const catDesdeD = new Date(catDesde + 'T00:00:00');
                    const catHastaD = new Date(catHasta + 'T23:59:59');
                    const setCatAtajo = (d,h) => { setCatDesde(d); setCatHasta(h); };
                    const hoy = new Date();
                    const todosLosDeLaCat = gastos.filter(g=>g.categoria===activeCat);
                    const catEnRango = todosLosDeLaCat.filter(g=>{ const d=g.fecha?.toDate?.(); return d&&d>=catDesdeD&&d<=catHastaD; });
                    const catAnteriores = todosLosDeLaCat.filter(g=>{ const d=g.fecha?.toDate?.(); return d&&d<catDesdeD; });
                    const cUSD = sumUSD(catEnRango), cDOP = sumDOP(catEnRango);
                    const cpUSD = pendUSD(catEnRango), cpDOP = pendDOP(catEnRango);
                    const caUSD = pendUSD(catAnteriores), caDOP = pendDOP(catAnteriores);
                    return (
                        <>
                            {navBarCat}
                            {/* Header */}
                            <div className="page-header">
                                <h1>{activeCat}</h1>
                                <p>{todosLosDeLaCat.length} gastos registrados en total</p>
                            </div>

                            {/* Selector de fechas */}
                            <div className="card glass" style={{padding:'14px 18px',marginBottom:18,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                                <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:'220px'}}>
                                    <label style={{fontSize:'10.5px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1px',whiteSpace:'nowrap'}}>Desde</label>
                                    <input type="date" className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)',padding:'7px 10px',fontSize:'12.5px',flex:1}} value={catDesde} onChange={e=>setCatDesde(e.target.value)} />
                                </div>
                                <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:'220px'}}>
                                    <label style={{fontSize:'10.5px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1px',whiteSpace:'nowrap'}}>Hasta</label>
                                    <input type="date" className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)',padding:'7px 10px',fontSize:'12.5px',flex:1}} value={catHasta} onChange={e=>setCatHasta(e.target.value)} />
                                </div>
                                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                    {[
                                        {label:'Este mes', fn:()=>setCatAtajo(`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-01`,`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`)},
                                        {label:'Mes anterior', fn:()=>{ const p=new Date(hoy.getFullYear(),hoy.getMonth()-1,1); const u=new Date(hoy.getFullYear(),hoy.getMonth(),0); setCatAtajo(`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-01`,`${u.getFullYear()}-${String(u.getMonth()+1).padStart(2,'0')}-${String(u.getDate()).padStart(2,'0')}`); }},
                                        {label:'Este año', fn:()=>setCatAtajo(`${hoy.getFullYear()}-01-01`,`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`)},
                                        {label:'Todo', fn:()=>setCatAtajo('2000-01-01',`${hoy.getFullYear()}-12-31`)},
                                    ].map(({label,fn})=>(
                                        <button key={label} className="btn btn-glass btn-sm" onClick={fn}>{label}</button>
                                    ))}
                                </div>
                            </div>

                            {/* KPIs separados por moneda */}
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:18}}>
                                {[
                                    {label:'Total USD',     val:`$${cUSD.toFixed(2)}`,    sub:`${catEnRango.filter(g=>g.moneda!=='DOP').length} gastos`, v:'gold'},
                                    {label:'Total DOP',     val:`RD$${cDOP.toFixed(0)}`,  sub:`${catEnRango.filter(g=>g.moneda==='DOP').length} gastos`,  v:'white'},
                                    {label:'Pend. USD',     val:`$${cpUSD.toFixed(2)}`,   sub:'créditos sin pagar',  v: cpUSD>0?'gold':'white'},
                                    {label:'Pend. DOP',     val:`RD$${cpDOP.toFixed(0)}`, sub:'créditos sin pagar',  v: cpDOP>0?'gold':'white'},
                                    ...(caUSD>0?[{label:'Arrastre USD', val:`$${caUSD.toFixed(0)}`,   sub:'meses anteriores', v:'white', rojo:true}]:[]),
                                    ...(caDOP>0?[{label:'Arrastre DOP', val:`RD$${caDOP.toFixed(0)}`, sub:'meses anteriores', v:'white', rojo:true}]:[]),
                                ].map((k,i)=>(
                                    <div key={i} className={`kpi-card glass ${i%2===0?'glass-mid':''}`} style={k.rojo?{borderTop:'2px solid #8B3535'}:{}}>
                                        <div className="kpi-top"><div className="kpi-label">{k.label}</div><div className={`kpi-icon ${k.v}`}>{I.dollar}</div></div>
                                        <div className="kpi-val" style={{fontSize:'18px',color:k.rojo?'#8B3535':'var(--text)'}}>{k.val}</div>
                                        <div className="kpi-sub">{k.sub}</div>
                                    </div>
                                ))}
                            </div>

                            {/* Tabla filtrada */}
                            <div className="card glass">
                                {catEnRango.length > 0 ? (
                                    <table>
                                        <thead><tr><th>Fecha</th><th>Descripción</th><th>Proveedor</th><th>Pago</th><th>Monto</th><th>Estado</th><th>Abonos</th><th></th></tr></thead>
                                        <tbody>
                                            {catEnRango.map((g,i)=>{
                                                const restante=Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                                const sym=g.moneda==='DOP'?'RD$':'$';
                                                const historial=g.historialAbonos||[];
                                                return (
                                                    <tr key={i}>
                                                        <td className="td-num" style={{color:'var(--text-dimmer)',fontSize:'12px'}}>{g.fecha?.toDate?.().toLocaleDateString('es-CO')||'—'}</td>
                                                        <td><strong>{g.descripcion||'—'}</strong></td>
                                                        <td style={{color:'var(--text-dim)'}}>{g.proveedor||'—'}</td>
                                                        <td style={{fontSize:'12px'}}>{g.medioPago}{g.terminal?<span style={{color:'var(--text-dimmer)'}}> · {g.terminal}</span>:''}<br/><span style={{fontSize:'11px',color:'var(--text-dimmer)'}}>{g.propietario}</span></td>
                                                        <td className="td-num"><strong>{sym}{(g.monto||0).toFixed(2)}</strong><br/><span style={{fontSize:'10px',color:'var(--text-dimmer)'}}>{g.moneda||'USD'}</span></td>
                                                        <td>{!g.esCredito?<span className="badge badge-gray"><span className="badge-dot"/>Contado</span>:restante<=0?<span className="badge badge-green"><span className="badge-dot"/>Pagado</span>:(g.montoAbonado||0)>0?<><span className="badge badge-gold"><span className="badge-dot"/>Abonado</span><br/><span style={{fontSize:'11px',color:'var(--sand-dark)',fontFamily:'Fira Code'}}>{sym}{restante.toFixed(0)} resta</span></>:<span className="badge badge-gray"><span className="badge-dot"/>Pendiente</span>}</td>
                                                        <td style={{fontSize:'11.5px',minWidth:'140px'}}>
                                                            {historial.length>0?historial.map((a,ai)=>(
                                                                <div key={ai} style={{marginBottom:4,display:'flex',gap:4,alignItems:'center'}}>
                                                                    <span style={{fontFamily:'Fira Code',fontWeight:'600',color:'var(--text)'}}>{sym}{(a.monto||0).toFixed(0)}</span>
                                                                    <span style={{color:'var(--text-dimmer)',fontSize:'10px'}}>{new Date(a.fecha).toLocaleDateString('es-CO')}</span>
                                                                    <button onClick={()=>openEditAbono(g,ai)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-dimmer)',fontSize:'12px',lineHeight:1,padding:'0 2px'}} onMouseEnter={e=>e.currentTarget.style.color='var(--sand-dark)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-dimmer)'}>✎</button>
                                                                    <button onClick={()=>revertirAbono(g,ai)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-dimmer)',fontSize:'13px',lineHeight:1,padding:'0 2px'}} onMouseEnter={e=>e.currentTarget.style.color='#8B3535'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-dimmer)'}>×</button>
                                                                </div>
                                                            )):<span style={{color:'var(--text-dimmer)'}}>—</span>}
                                                        </td>
                                                        <td><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                                            <button className="btn btn-glass btn-sm" onClick={()=>openEditGasto(g)}>{I.edit} Editar</button>
                                                            {g.esCredito&&restante>0&&<button className="btn btn-glass btn-sm" onClick={()=>{setSelectedGasto(g);setAbonoMonto('');setShowAbonoModal(true);}}>+ Abono</button>}
                                                        </div></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                ):(
                                    <div className="empty"><div className="empty-icon">{I.dollar}</div><h3>Sin gastos en este período</h3><p>Ajusta las fechas o agrega un nuevo gasto.</p></div>
                                )}
                            </div>
                        </>
                    );
                })()}

                {showModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Nuevo Vendedor</h2>
                                <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre completo</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    ref={firstInputRef} value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Ej. Maria Lopez" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Correo electronico</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="maria@casabrumi.com" />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => setShowModal(false)}>Cancelar</button>
                                <button className="btn btn-gold" onClick={addVendedor} disabled={saving}>
                                    {saving ? 'Guardando...' : <>{I.plus} Crear Vendedor</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showAbonoModal && selectedGasto && (
                    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:380}}>
                            <div className="modal-hd">
                                <h2>Registrar Abono</h2>
                                <button className="modal-close" onClick={()=>{setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}>×</button>
                            </div>
                            <div style={{background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',padding:'14px 16px',marginBottom:18,fontSize:'13px'}}>
                                <div style={{fontWeight:'600',color:'var(--text)',marginBottom:6}}>{selectedGasto.descripcion}</div>
                                <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                                    <span style={{color:'var(--text-dim)'}}>Total: <strong style={{color:'var(--text)'}}>${(selectedGasto.monto||0).toFixed(2)}</strong></span>
                                    <span style={{color:'var(--text-dim)'}}>Abonado: <strong style={{color:'var(--text)'}}>${(selectedGasto.montoAbonado||0).toFixed(2)}</strong></span>
                                    <span style={{color:'var(--text-dim)'}}>Resta: <strong style={{color:'var(--sand-dark)'}}>${Math.max(0,(selectedGasto.monto||0)-(selectedGasto.montoAbonado||0)).toFixed(2)}</strong></span>
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Monto del abono (USD)</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    type="number" min="0" step="0.01" inputMode="decimal" autoFocus
                                    value={abonoMonto} onChange={e=>setAbonoMonto(e.target.value)} placeholder="0.00" />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}>Cancelar</button>
                                <button className="btn btn-gold" onClick={handleAddAbono} style={{flex:1,justifyContent:'center'}}>Registrar Abono</button>
                            </div>
                        </div>
                    </div>
                )}

                {showPagoRapidoModal && (() => {
                    const pendientes = gastos.filter(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0);
                    const gastoSel   = pendientes.find(g=>g.id===pagoRapidoId);
                    const sym        = gastoSel?.moneda==='DOP'?'RD$':'$';
                    return (
                        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}}>
                            <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:420}}>
                                <div className="modal-hd">
                                    <h2>Registrar Pago</h2>
                                    <button className="modal-close" onClick={()=>{setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}>×</button>
                                </div>
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Selecciona el gasto</label>
                                    <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        value={pagoRapidoId} onChange={e=>setPagoRapidoId(e.target.value)}>
                                        <option value="">— Seleccionar —</option>
                                        {pendientes.map(g=>{
                                            const r = Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                            const s = g.moneda==='DOP'?'RD$':'$';
                                            return <option key={g.id} value={g.id}>{g.descripcion} · {g.categoria} · {s}{r.toFixed(0)} pendiente</option>;
                                        })}
                                    </select>
                                </div>
                                {gastoSel && (
                                    <div style={{background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',padding:'12px 14px',marginBottom:14,fontSize:'12.5px'}}>
                                        <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                                            <span style={{color:'var(--text-dim)'}}>Total: <strong>{sym}{(gastoSel.monto||0).toFixed(2)}</strong></span>
                                            <span style={{color:'var(--text-dim)'}}>Abonado: <strong>{sym}{(gastoSel.montoAbonado||0).toFixed(2)}</strong></span>
                                            <span style={{color:'var(--text-dim)'}}>Resta: <strong style={{color:'var(--sand-dark)'}}>{sym}{Math.max(0,(gastoSel.monto||0)-(gastoSel.montoAbonado||0)).toFixed(2)}</strong></span>
                                        </div>
                                    </div>
                                )}
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Monto del abono</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={abonoMonto} onChange={e=>setAbonoMonto(e.target.value)} placeholder="0.00" />
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-glass" onClick={()=>{setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}>Cancelar</button>
                                    <button className="btn btn-gold" onClick={handlePagoRapido} disabled={!pagoRapidoId||!abonoMonto} style={{flex:1,justifyContent:'center'}}>Registrar Pago</button>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {showGastoModal && (
                    <div className="modal-overlay" onClick={e=>{if(!savingGasto && e.target===e.currentTarget)setShowGastoModal(false);}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:480}}>
                            <div className="modal-hd">
                                <h2>Nuevo Gasto</h2>
                                <button className="modal-close" onClick={()=>{ if(!savingGasto) setShowGastoModal(false); }} style={{opacity: savingGasto ? 0.3 : 1}}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Categoría</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.categoria} onChange={e=>setGastoForm({...gastoForm,categoria:e.target.value})}>
                                    {CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Descripción</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    ref={firstGastoRef} value={gastoForm.descripcion} onChange={e=>setGastoForm({...gastoForm,descripcion:e.target.value})}
                                    placeholder="Ej. Flete desde Venezuela" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Proveedor</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.proveedor} onChange={e=>setGastoForm({...gastoForm,proveedor:e.target.value})}
                                    placeholder="Nombre del proveedor o empresa" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Monto</label>
                                <div style={{display:'flex',gap:8}}>
                                    <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',width:'100px',flexShrink:0}}
                                        value={gastoForm.moneda} onChange={e=>setGastoForm({...gastoForm,moneda:e.target.value})}>
                                        <option value="USD">USD $</option>
                                        <option value="DOP">DOP RD$</option>
                                    </select>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',flex:1}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={gastoForm.monto} onChange={e=>setGastoForm({...gastoForm,monto:e.target.value})} placeholder="0.00" />
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Medio de pago</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.medioPago} onChange={e=>setGastoForm({...gastoForm,medioPago:e.target.value,terminal:''})}>
                                    <option>Efectivo</option>
                                    <option>Tarjeta</option>
                                    <option>Transferencia</option>
                                </select>
                            </div>
                            {gastoForm.medioPago === 'Tarjeta' && (
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Terminal / Banco</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        value={gastoForm.terminal} onChange={e=>setGastoForm({...gastoForm,terminal:e.target.value})}
                                        placeholder="Ej. Bancolombia, Davivienda..." />
                                </div>
                            )}
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Propietario</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.propietario} onChange={e=>setGastoForm({...gastoForm,propietario:e.target.value})}>
                                    {PROPIETARIOS.map(p=><option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <button type="button"
                                    style={{width:'100%',padding:'11px',border:`2px solid ${gastoForm.esCredito?'var(--text)':'var(--glass-border-h)'}`,borderRadius:'var(--r-sm)',background:gastoForm.esCredito?'var(--text)':'transparent',color:gastoForm.esCredito?'#FFFFFF':'var(--text-dim)',fontFamily:'inherit',fontWeight:'700',fontSize:'12px',letterSpacing:'1.5px',cursor:'pointer',transition:'all var(--t-fast)',textTransform:'uppercase'}}
                                    onClick={()=>setGastoForm({...gastoForm,esCredito:!gastoForm.esCredito,montoAbonado:''})}>
                                    {gastoForm.esCredito ? '✓ Crédito activo' : 'Crédito'}
                                </button>
                            </div>
                            {gastoForm.esCredito && (
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Ya abonado (USD) — dejar en 0 si no has pagado nada</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={gastoForm.montoAbonado} onChange={e=>setGastoForm({...gastoForm,montoAbonado:e.target.value})} placeholder="0.00" />
                                </div>
                            )}
                            {gastoError && <div className="error-msg" style={{marginBottom:0,marginTop:4}}>{gastoError}</div>}
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowGastoModal(false);setGastoError('');}} disabled={savingGasto}>Cancelar</button>
                                <button className="btn btn-gold" onClick={addGasto} disabled={savingGasto} style={{flex:1,justifyContent:'center'}}>
                                    {savingGasto?'Guardando...':<>{I.plus} Registrar Gasto</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showEditGastoModal && editingGasto && (
                    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowEditGastoModal(false);setEditingGasto(null);}}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:480}}>
                            <div className="modal-hd">
                                <h2>Editar Gasto</h2>
                                <button className="modal-close" onClick={()=>{setShowEditGastoModal(false);setEditingGasto(null);}}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Categoría</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={editGastoForm.categoria} onChange={e=>setEditGastoForm({...editGastoForm,categoria:e.target.value})}>
                                    {CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Descripción</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    autoFocus value={editGastoForm.descripcion} onChange={e=>setEditGastoForm({...editGastoForm,descripcion:e.target.value})}
                                    placeholder="Ej. Flete desde Venezuela" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Proveedor</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={editGastoForm.proveedor} onChange={e=>setEditGastoForm({...editGastoForm,proveedor:e.target.value})}
                                    placeholder="Nombre del proveedor o empresa" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Monto</label>
                                <div style={{display:'flex',gap:8}}>
                                    <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',width:'100px',flexShrink:0}}
                                        value={editGastoForm.moneda} onChange={e=>setEditGastoForm({...editGastoForm,moneda:e.target.value})}>
                                        <option value="USD">USD $</option>
                                        <option value="DOP">DOP RD$</option>
                                    </select>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',flex:1}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={editGastoForm.monto} onChange={e=>setEditGastoForm({...editGastoForm,monto:e.target.value})} placeholder="0.00" />
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Medio de pago</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={editGastoForm.medioPago} onChange={e=>setEditGastoForm({...editGastoForm,medioPago:e.target.value,terminal:''})}>
                                    <option>Efectivo</option>
                                    <option>Tarjeta</option>
                                    <option>Transferencia</option>
                                </select>
                            </div>
                            {editGastoForm.medioPago === 'Tarjeta' && (
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Terminal / Banco</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        value={editGastoForm.terminal} onChange={e=>setEditGastoForm({...editGastoForm,terminal:e.target.value})}
                                        placeholder="Ej. Bancolombia, Davivienda..." />
                                </div>
                            )}
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Propietario</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={editGastoForm.propietario} onChange={e=>setEditGastoForm({...editGastoForm,propietario:e.target.value})}>
                                    {PROPIETARIOS.map(p=><option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <button type="button"
                                    style={{width:'100%',padding:'11px',border:`2px solid ${editGastoForm.esCredito?'var(--text)':'var(--glass-border-h)'}`,borderRadius:'var(--r-sm)',background:editGastoForm.esCredito?'var(--text)':'transparent',color:editGastoForm.esCredito?'#FFFFFF':'var(--text-dim)',fontFamily:'inherit',fontWeight:'700',fontSize:'12px',letterSpacing:'1.5px',cursor:'pointer',transition:'all var(--t-fast)',textTransform:'uppercase'}}
                                    onClick={()=>setEditGastoForm({...editGastoForm,esCredito:!editGastoForm.esCredito})}>
                                    {editGastoForm.esCredito ? '✓ Crédito activo' : 'Crédito'}
                                </button>
                            </div>
                            {editGastoError && <div className="error-msg" style={{marginBottom:0,marginTop:4}}>{editGastoError}</div>}
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowEditGastoModal(false);setEditingGasto(null);}}>Cancelar</button>
                                <button className="btn btn-glass" onClick={deleteGasto}
                                    style={{color:'#8B3535',borderColor:'rgba(160,56,56,0.3)'}}
                                    onMouseEnter={e=>{e.currentTarget.style.background='rgba(160,56,56,0.08)';}}
                                    onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
                                    Eliminar
                                </button>
                                <button className="btn btn-gold" onClick={saveEditGasto} disabled={savingEditGasto} style={{flex:1,justifyContent:'center'}}>
                                    {savingEditGasto?'Guardando...':<>{I.edit} Guardar Cambios</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showEditAbonoModal && editingAbonoGasto && (
                    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowEditAbonoModal(false);setEditingAbonoGasto(null);setEditingAbonoIdx(null);setEditingAbonoMonto('');}}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:380}}>
                            <div className="modal-hd">
                                <h2>Editar Abono</h2>
                                <button className="modal-close" onClick={()=>{setShowEditAbonoModal(false);setEditingAbonoGasto(null);setEditingAbonoIdx(null);setEditingAbonoMonto('');}}>×</button>
                            </div>
                            <div style={{background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',padding:'12px 14px',marginBottom:18,fontSize:'13px',color:'var(--text-dim)'}}>
                                {editingAbonoGasto.descripcion}
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nuevo monto del abono</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    type="number" min="0" step="0.01" inputMode="decimal" autoFocus
                                    value={editingAbonoMonto} onChange={e=>setEditingAbonoMonto(e.target.value)} placeholder="0.00" />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowEditAbonoModal(false);setEditingAbonoGasto(null);setEditingAbonoIdx(null);setEditingAbonoMonto('');}}>Cancelar</button>
                                <button className="btn btn-gold" onClick={saveEditAbono} style={{flex:1,justifyContent:'center'}}>Guardar Cambio</button>
                            </div>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
}

// ── VENDEDOR PANEL ──
function VendedorPanel({ user, onLogout, onPhotoChange }) {
    const [activeTab, setActiveTab] = useState('ventas');
    const [ventas,    setVentas]    = useState([]);
    const [form,      setForm]      = useState({ cliente: '', producto: '', monto: '' });
    const [saving,    setSaving]    = useState(false);

    useEffect(() => {
        const unsub = db.collection('ventas').onSnapshot(snap => {
            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setVentas(all.filter(v => v.vendedorId === user.uid));
        });
        return unsub;
    }, [user.uid]);

    const addVenta = async () => {
        if (!form.monto || saving) return;
        setSaving(true);
        try {
            await db.collection('ventas').add({
                cliente:       form.cliente,
                producto:      form.producto,
                monto:         parseFloat(form.monto),
                vendedorId:    user.uid,
                vendedorEmail: user.email,
                fecha:         firebase.firestore.FieldValue.serverTimestamp(),
                estado:        'Pendiente',
            });
            setForm({ cliente: '', producto: '', monto: '' });
            setActiveTab('ventas');
        } catch(e) {
            console.error('Error al registrar venta:', e);
        }
        setSaving(false);
    };

    const total = ventas.reduce((s, v) => s + (v.monto || 0), 0);

    const navSections = [
        { label: 'Mi Trabajo', items: [
            { key: 'ventas',   label: 'Mis Ventas',  icon: I.chart },
            { key: 'registro', label: 'Nueva Venta', icon: I.plus  },
        ]},
    ];

    return (
        <div className="app-root">
            <img src={LOGO} aria-hidden="true" style={{position:'fixed',top:'50%',left:'50%',transform:'translate(calc(-50% + 110px), -50%)',width:'520px',maxWidth:'55vw',opacity:0.055,filter:'brightness(0)',pointerEvents:'none',userSelect:'none',zIndex:0}} />
            <Header user={user} onLogout={onLogout} activeTab={activeTab} navSections={navSections} onPhotoChange={onPhotoChange} />
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} navSections={navSections} />
            <main className="main">
                {activeTab === 'ventas' && <>
                    <div className="kpi-grid" style={{gridTemplateColumns:'repeat(2,1fr)', maxWidth:460, marginBottom:20}}>
                        <div className="kpi-card glass glass-mid">
                            <div className="kpi-top"><div className="kpi-label">Registradas</div><div className="kpi-icon gold">{I.invoice}</div></div>
                            <div className="kpi-val">{ventas.length}</div>
                            <div className="kpi-sub">ventas en total</div>
                        </div>
                        <div className="kpi-card glass glass-mid">
                            <div className="kpi-top"><div className="kpi-label">Monto total</div><div className="kpi-icon gold">{I.dollar}</div></div>
                            <div className="kpi-val">${total.toFixed(0)}</div>
                            <div className="kpi-sub">pendiente aprobacion</div>
                        </div>
                    </div>
                    <div className="sec-header">
                        <h2>Historial</h2>
                        <button className="btn btn-gold" onClick={() => setActiveTab('registro')}>{I.plus} Nueva venta</button>
                    </div>
                    <div className="card glass">
                        {ventas.length > 0 ? (
                            <table>
                                <thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Monto</th><th>Estado</th></tr></thead>
                                <tbody>
                                    {ventas.map((v, i) => (
                                        <tr key={i}>
                                            <td className="td-num" style={{color:'var(--text-dimmer)', fontSize:'12px'}}>
                                                {v.fecha?.toDate?.().toLocaleDateString('es') || '—'}
                                            </td>
                                            <td><strong>{v.cliente || '—'}</strong></td>
                                            <td style={{color:'var(--text-dim)'}}>{v.producto || '—'}</td>
                                            <td className="td-num"><strong>${(v.monto||0).toFixed(2)}</strong></td>
                                            <td><span className="badge badge-gray"><span className="badge-dot"/>{v.estado}</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty">
                                <div className="empty-icon">{I.inbox}</div>
                                <h3>Sin ventas aun</h3>
                                <p>Registra tu primera venta y aparecera aqui.</p>
                            </div>
                        )}
                    </div>
                </>}

                {activeTab === 'registro' && <>
                    <div className="page-header"><h1>Nueva Venta</h1><p>Completa los datos de la venta</p></div>
                    <div className="card glass card-body" style={{maxWidth:500, borderRadius:'var(--r)'}}>
                        <div className="form-group">
                            <label style={{color:'var(--text-dim)'}}>Cliente</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                value={form.cliente} onChange={e => setForm({...form, cliente: e.target.value})} placeholder="Nombre del cliente" />
                        </div>
                        <div className="form-group">
                            <label style={{color:'var(--text-dim)'}}>Producto</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                value={form.producto} onChange={e => setForm({...form, producto: e.target.value})} placeholder="Descripcion del producto" />
                        </div>
                        <div className="form-group" style={{marginBottom:22}}>
                            <label style={{color:'var(--text-dim)'}}>Monto (USD)</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                type="number" min="0" step="0.01" inputMode="decimal"
                                value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} placeholder="0.00" />
                        </div>
                        <div style={{display:'flex', gap:10}}>
                            <button className="btn btn-glass" onClick={() => setActiveTab('ventas')}>Cancelar</button>
                            <button className="btn btn-gold" onClick={addVenta} disabled={saving} style={{flex:1, justifyContent:'center'}}>
                                {saving ? 'Guardando...' : <>{I.plus} Registrar Venta</>}
                            </button>
                        </div>
                    </div>
                </>}
            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
