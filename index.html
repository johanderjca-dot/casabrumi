            <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        .cst-margin-input::-webkit-inner-spin-button, .cst-margin-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
        :root {
            /* === TEAL/CORAL PALETTE === */
            --cream:       #F5FAF9;
            --cream-dark:  #E7F3F1;
            --stone:       #D3E6E3;
            --stone-mid:   #B3CDC9;
            --stone-dark:  #7FA19C;
            --parchment:   #FBFEFD;

            --earth:       #103630;
            --earth-2:     #17493F;
            --earth-dim:   rgba(11,38,34,0.50);
            --earth-dimmer:rgba(11,38,34,0.28);

            --orange:      #129A8F;
            --orange-light:#3DBBB0;
            --orange-dim:  rgba(18,154,143,0.12);
            --orange-border:rgba(18,154,143,0.28);

            /* Coral brand — secondary accent */
            --sand:        #FF7A63;
            --sand-light:  #FFA391;
            --sand-dark:   #E85A42;
            --sand-dim:    rgba(255,122,99,0.16);
            --sand-border: rgba(255,122,99,0.32);
            --bronze:      #E85A42;
            --gold:        #FF7A63;

            --ink:         #0B2622;
            --ink-2:       #123A33;
            --on-ink:      #EFFBF9;
            --on-ink-dim:  rgba(239,251,249,0.65);
            --on-ink-dimmer:rgba(239,251,249,0.36);

            --bg:          #EAF6F4;
            --surface-1:   #F1FAF8;
            --surface-2:   #F8FDFC;
            --surface-3:   #FFFFFF;
            --sidebar-bg:  #FFFFFF;

            --glass-bg:      var(--surface-2);
            --glass-bg-mid:  var(--surface-1);
            --glass-bg-high: var(--surface-3);
            --glass-border:  rgba(11,38,34,0.08);
            --glass-border-h:rgba(11,38,34,0.16);
            --glass-shadow:  0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 12px rgba(11,38,34,0.07);
            --glass-shadow-lg: 0 1px 0 rgba(255,255,255,0.8) inset, 0 16px 48px rgba(11,38,34,0.14);

            --text:        #0D211D;
            --text-dim:    rgba(13,33,29,0.72);
            --text-dimmer: rgba(13,33,29,0.48);

            --header-h:  56px;
            --sidebar-w: 220px;
            --r:    18px;
            --r-sm:  12px;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --t-fast:   150ms cubic-bezier(0.23, 1, 0.32, 1);
            --t-normal: 260ms cubic-bezier(0.22, 0.68, 0.32, 1);
            --grad-ink:  linear-gradient(135deg, #129A8F 0%, #0D6C63 100%);
            --grad-gold: linear-gradient(135deg, #FF7A63 0%, #E85A42 100%);
        }
        html, body, #root { height: 100%; }
        body { font-family: 'Fira Sans', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: var(--text); overflow-x: hidden; background: var(--bg); }
        ::selection { background: rgba(18,154,143,0.18); }
        *::-webkit-scrollbar { width: 5px; height: 5px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: var(--stone); border-radius: 99px; }
        *::-webkit-scrollbar-thumb:hover { background: var(--stone-mid); }

        /* SCENE — very subtle warm grain */
        .scene { position: fixed; inset: 0; z-index: 0; background: var(--bg); overflow: hidden; }
        .scene::before { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"); opacity: 0.6; pointer-events: none; }
        .scene::after  { content: ''; position: absolute; top: -20vh; right: -10vw; width: 55vw; height: 55vw; border-radius: 50%; background: radial-gradient(circle, rgba(18,154,143,0.06) 0%, transparent 65%); pointer-events: none; }
        @keyframes rise   { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes pop    { from { opacity: 0; transform: scale(0.95) translateY(10px); filter: blur(3px); } }

        /* SURFACES */
        .glass { background: var(--surface-2); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); position: relative; }
        .glass::before { display: none; }
        .glass > * { position: relative; z-index: 1; }
        .glass-mid  { background: var(--surface-1); }
        .glass-high { background: var(--surface-3); box-shadow: var(--glass-shadow-lg); }

        /* ========= AUTH ========= */
        .auth-wrap { position: relative; z-index: 1; min-height: 100vh; display: grid; grid-template-columns: 55fr 45fr; }
        @media (max-width: 768px) { .auth-wrap { grid-template-columns: 1fr; } .auth-left { display: none; } }
        .auth-left { display: flex; align-items: center; justify-content: flex-start; padding: 72px 64px; position: relative; background: var(--earth); overflow: hidden; }
        .auth-left::before { content: ''; position: absolute; bottom: -30%; left: -15%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(18,154,143,0.22) 0%, transparent 65%); pointer-events: none; }
        .auth-left::after  { content: ''; position: absolute; top: -10%; right: -20%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 65%); pointer-events: none; }
        .auth-left-glow { display: none; }
        .auth-logo-wrap { position: relative; z-index: 1; display: flex; align-items: flex-start; }
        .auth-logo-wrap img { filter: brightness(0) invert(1); opacity: 0.95; user-select: none; }
        .auth-right { display: flex; align-items: center; justify-content: center; padding: 48px 56px; background: var(--cream); }
        .auth-form-box { width: 100%; max-width: 360px; }
        .auth-form-box h2 { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.6px; margin-bottom: 4px; }
        .auth-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; color: var(--earth-dimmer); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 1.5px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-dimmer); pointer-events: none; }
        .input-icon svg { width: 14px; height: 14px; display: block; }
        .form-input { width: 100%; padding: 12px 14px 12px 40px; font-size: 14px; font-family: inherit; color: var(--text); outline: none; border-radius: var(--r-sm); border: 1.5px solid var(--glass-border); background: var(--parchment); transition: border-color var(--t-fast), box-shadow var(--t-fast); cursor: text; }
        .form-input.no-icon { padding-left: 14px; }
        .form-input::placeholder { color: var(--text-dimmer); }
        .form-input:focus { border-color: var(--orange) !important; box-shadow: 0 0 0 3px var(--orange-dim) !important; outline: none; }
        .error-msg { background: rgba(180,40,40,0.07); border: 1px solid rgba(180,40,40,0.20); border-radius: var(--r-sm); padding: 10px 14px; font-size: 12.5px; color: #9B3030; margin-bottom: 14px; }
        .hint-box { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-radius: var(--r-sm); font-size: 11.5px; color: var(--earth-2); font-family: 'Fira Code', monospace; font-weight: 500; margin-bottom: 18px; }
        .hint-box svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: var(--r-sm); font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer; color: #FFFFFF; background: var(--orange); transition: transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out); letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 0 4px 18px -4px rgba(18,154,143,0.45); }
        @media (hover: hover) and (pointer: fine) { .btn-submit:hover { box-shadow: 0 8px 24px -4px rgba(18,154,143,0.55); transform: translateY(-1px); } }
        .btn-submit:active { transform: scale(0.97); box-shadow: 0 2px 8px -2px rgba(18,154,143,0.30); }
        .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
        .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dimmer); }
        .auth-switch a { color: var(--orange); font-weight: 700; cursor: pointer; text-decoration: none; }

        /* ========= LAYOUT ========= */
        .app-root { position: relative; z-index: 1; display: flex; min-height: 100vh; }

        /* ========= HEADER ========= */
        .app-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 200; display: flex; align-items: center; background: rgba(255,255,255,0.90); border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .app-header-logo { width: var(--sidebar-w); flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start; height: 100%; border-right: 1px solid var(--glass-border); padding: 0 22px; }
        .app-header-logo img { height: 30px; filter: brightness(0); opacity: 0.75; object-fit: contain; }
        .app-header-title { flex: 1; padding: 0 28px; display: flex; align-items: center; gap: 10px; }
        .app-header-title strong { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.1px; }
        .app-header-title span { font-size: 11px; color: var(--text-dimmer); }
        .app-header-right { display: flex; align-items: center; gap: 10px; padding-right: 22px; }
        .app-header-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--earth); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--cream); flex-shrink: 0; box-shadow: 0 0 0 2px var(--stone); transition: transform 140ms var(--ease-out); cursor: pointer; overflow: hidden; }
        @media (hover: hover) and (pointer: fine) { .app-header-avatar:hover { transform: scale(1.06); } }
        .app-header-divider { width: 1px; height: 18px; background: var(--glass-border); }
        .hdr-role  { font-size: 8px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: 2px; }
        .hdr-email { font-size: 11px; color: var(--text-dimmer); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cmdk-hint { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 99px; background: var(--cream-dark); border: 1px solid var(--glass-border); color: var(--text-dim); font-size: 11px; font-family: inherit; cursor: pointer; transition: transform 140ms var(--ease-out), border-color 140ms ease, background 140ms ease; }
        @media (hover: hover) and (pointer: fine) { .cmdk-hint:hover { background: var(--parchment); border-color: var(--stone-mid); color: var(--text); transform: translateY(-1px); } }
        .cmdk-hint:active { transform: scale(0.97); }
        .cmdk-hint kbd { font-family: 'Fira Code', monospace; font-size: 10px; background: var(--stone); border: none; border-radius: 4px; padding: 1px 6px; color: var(--earth-2); }

        /* ========= SIDEBAR — EDITORIAL STYLE ========= */
        .sidebar { width: var(--sidebar-w); position: fixed; top: var(--header-h); left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; background: var(--sidebar-bg); border-right: 1px solid var(--glass-border); overflow-y: auto; }
        .sidebar-nav { flex: 1; padding: 24px 0; }
        .nav-label { font-size: 8px; font-weight: 800; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 3px; padding: 0 22px; margin: 28px 0 8px; }
        .nav-label:first-child { margin-top: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin: 0 10px 3px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-dim); transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease; position: relative; border-radius: 12px; }
        .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; transition: transform 150ms var(--ease-out); }
        @media (hover: hover) and (pointer: fine) { .nav-item:hover { background: rgba(11,38,34,0.05); color: var(--text); } }
        .nav-item:active { transform: scale(0.98); }
        .nav-item.active { color: #FFFFFF; font-weight: 700; background: var(--orange); box-shadow: 0 6px 16px -6px rgba(18,154,143,0.55); }
        .nav-item.active svg { color: #FFFFFF; }
        .nav-item.active::before { display: none; }
        .sidebar-footer { padding: 14px 0; border-top: 1px solid var(--glass-border); }
        .user-tile { display: flex; align-items: center; gap: 10px; padding: 10px 22px; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--earth); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--cream); flex-shrink: 0; }
        .user-tile-info { flex: 1; min-width: 0; }
        .user-role  { font-size: 8px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: 2px; }
        .user-email { font-size: 11px; color: var(--text-dimmer); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .btn-logout { background: none; border: none; cursor: pointer; color: var(--text-dimmer); padding: 5px; border-radius: 6px; display: flex; align-items: center; transition: color 140ms ease, background 140ms ease; flex-shrink: 0; }
        .btn-logout:hover { color: #9B3030; background: rgba(155,48,48,0.08); }
        .btn-logout svg { width: 15px; height: 15px; }

        /* ========= MAIN ========= */
        .main { margin-left: var(--sidebar-w); flex: 1; padding: calc(var(--header-h) + 32px) 40px 48px; min-height: 100vh; background: transparent; }
        .main > * { animation: rise 0.50s cubic-bezier(0.22, 0.68, 0.32, 1) backwards; }
        .main > *:nth-child(2) { animation-delay: 0.06s; }
        .main > *:nth-child(3) { animation-delay: 0.12s; }
        .main > *:nth-child(4) { animation-delay: 0.18s; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.9px; margin-bottom: 4px; }
        .page-header p  { font-size: 13px; color: var(--text-dim); }

        .banner { border-radius: var(--r); padding: 24px 28px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; overflow: hidden; background: var(--earth) !important; border: none !important; }
        .banner-text h2 { font-size: 16px; font-weight: 700; color: var(--on-ink); letter-spacing: -0.3px; margin-bottom: 4px; }
        .banner-text p  { font-size: 13px; color: var(--on-ink-dim); }
        .banner-stat { border-radius: 8px; padding: 12px 18px; text-align: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); }
        .banner-stat-val   { font-size: 20px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.8px; font-family: 'Fira Code', monospace; }
        .banner-stat-label { font-size: 9px; color: var(--on-ink-dimmer); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-top: 3px; }

        /* ========= KPI GRID — FEATURE CARD LAYOUT ========= */
        .kpi-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media (max-width: 1200px) { .kpi-grid { grid-template-columns: 1fr 1fr 1fr; } }
        .kpi-card { border-radius: var(--r); padding: 22px 24px; transition: transform var(--t-normal), box-shadow var(--t-normal); cursor: default; position: relative; overflow: hidden; animation: rise 0.52s cubic-bezier(0.22, 0.68, 0.32, 1) backwards; border: 1px solid var(--glass-border); background: var(--surface-2); }
        .kpi-grid .kpi-card:first-child { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; background: var(--earth); border-color: transparent; }
        .kpi-grid .kpi-card:first-child .kpi-label { color: rgba(239,251,249,0.55); }
        .kpi-grid .kpi-card:first-child .kpi-val { font-size: 48px; letter-spacing: -2px; color: var(--cream); -webkit-text-fill-color: var(--cream); }
        .kpi-grid .kpi-card:first-child .kpi-sub { color: rgba(239,251,249,0.45); }
        .kpi-grid .kpi-card:first-child .kpi-icon.gold { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.15); color: var(--sand-light); }
        .kpi-grid .kpi-card:nth-child(2) { animation-delay: 0.08s; }
        .kpi-grid .kpi-card:nth-child(3) { animation-delay: 0.12s; }
        .kpi-grid .kpi-card:nth-child(4) { animation-delay: 0.16s; }
        .kpi-grid .kpi-card:nth-child(5) { animation-delay: 0.20s; }
        .kpi-grid .kpi-card:nth-child(6) { animation-delay: 0.24s; }
        .kpi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--orange) 0%, var(--orange-light) 100%); opacity: 0; transition: opacity var(--t-normal); }
        @media (hover: hover) and (pointer: fine) { .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px -8px rgba(11,38,34,0.16); } .kpi-card:hover::after { opacity: 1; } }
        .kpi-grid .kpi-card:first-child::after { display: none; }

        /* ========= HERO ========= */
        .hero { border-radius: var(--r); padding: 28px 32px; margin-bottom: 20px; background: linear-gradient(135deg, var(--earth) 0%, var(--earth-2) 60%, #17493F 100%); border: none; box-shadow: 0 16px 40px -12px rgba(11,38,34,0.40), inset 0 1px 0 rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; overflow: hidden; position: relative; }
        .hero::before { content: ''; position: absolute; top: -50%; right: -8%; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(18,154,143,0.30), transparent 65%); pointer-events: none; }
        .hero::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 36%; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.05) 50%, transparent 80%); transform: translateX(-130%) skewX(-16deg); animation: heroShine 7s ease-in-out infinite; pointer-events: none; }
        @keyframes heroShine { 0% { transform: translateX(-130%) skewX(-16deg); } 55%, 100% { transform: translateX(420%) skewX(-16deg); } }
        .hero h2 { font-size: 20px; font-weight: 800; color: var(--on-ink); letter-spacing: -0.5px; margin-bottom: 5px; }
        .hero p { font-size: 12px; color: var(--on-ink-dim); }
        .hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
        .hero-stat { border-radius: 10px; padding: 12px 18px; text-align: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); min-width: 96px; transition: transform var(--t-fast), background var(--t-fast); }
        @media (hover: hover) and (pointer: fine) { .hero-stat:hover { transform: translateY(-2px); background: rgba(255,255,255,0.11); } }
        .hero-stat-val { font-size: 18px; font-weight: 700; letter-spacing: -0.6px; font-family: 'Fira Code', monospace; color: var(--cream); }
        .hero-stat-label { font-size: 8.5px; color: var(--on-ink-dimmer); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-top: 4px; }

        /* ========= COMMAND PALETTE ========= */
        .cmdk-overlay { position: fixed; inset: 0; background: rgba(11,38,34,0.35); backdrop-filter: blur(10px); display: flex; align-items: flex-start; justify-content: center; z-index: 2000; padding: 12vh 20px 20px; animation: fadeIn 0.15s ease; }
        .cmdk { width: 100%; max-width: 520px; background: var(--parchment); border-radius: 16px; box-shadow: 0 32px 80px rgba(11,38,34,0.28), 0 0 0 1px var(--glass-border) inset; overflow: hidden; border: 1px solid var(--glass-border); animation: pop 0.24s cubic-bezier(0.34, 1.4, 0.45, 1) backwards; }
        .cmdk-input { width: 100%; padding: 16px 20px; font-size: 14px; font-family: inherit; border: none; outline: none; color: var(--text); background: transparent; border-bottom: 1px solid var(--glass-border); }
        .cmdk-input::placeholder { color: var(--text-dimmer); }
        .cmdk-list { max-height: 300px; overflow-y: auto; padding: 8px; }
        .cmdk-group { font-size: 9px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 2px; padding: 10px 12px 4px; }
        .cmdk-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: background 120ms ease; }
        .cmdk-item:hover, .cmdk-item.sel { background: var(--orange-dim); }
        .cmdk-item svg { width: 15px; height: 15px; color: var(--orange); flex-shrink: 0; }
        .cmdk-item .cmdk-kind { margin-left: auto; font-size: 9.5px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1px; }
        .cmdk-empty { padding: 28px; text-align: center; font-size: 13px; color: var(--text-dim); }

        /* COSTEO CALCULADORA */
        .cst-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 1100px) { .cst-grid { grid-template-columns: 1fr; } }
        .cst-panel { padding: 22px; }
        .cst-sec-label { font-size: 10px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 7px; margin-bottom: 14px; }
        .cst-field-label { font-size: 9.5px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; display: block; }
        .cst-input { width: 100%; padding: 11px 13px; font-size: 15px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--text); background: var(--cream-dark); border: 1px solid var(--glass-border); border-radius: 10px; outline: none; transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease; }
        .cst-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); background: var(--surface-3); }
        .cst-input-wrap { position: relative; }
        .cst-input-wrap .cst-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--text-dimmer); font-family: 'Fira Code', monospace; pointer-events: none; }
        .cst-input.has-prefix { padding-left: 30px; }
        .cst-range { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 99px; outline: none; cursor: pointer; }
        .cst-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--orange); border: 3px solid var(--surface-3); box-shadow: 0 1px 6px rgba(18,154,143,0.45); cursor: pointer; transition: transform 120ms ease; }
        .cst-range::-webkit-slider-thumb:hover { transform: scale(1.18); }
        .cst-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--orange); border: 3px solid var(--surface-3); box-shadow: 0 1px 6px rgba(18,154,143,0.45); cursor: pointer; }
        .cst-card { padding: 18px 20px; border-radius: 14px; }
        .calc-card { max-width: 320px; }
        .calc-display { font-family: 'Fira Code', monospace; font-size: 28px; font-weight: 700; color: var(--text); background: var(--cream-dark); border: 1px solid var(--glass-border); border-radius: 10px; padding: 14px 16px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 12px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { padding: 14px 0; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--surface-3); color: var(--text); font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 120ms ease; }
        .calc-btn:hover { background: var(--orange-dim); border-color: var(--orange-border); color: var(--orange); }
        .calc-btn:active { transform: scale(0.94); }
        .calc-btn-fn { color: var(--earth-2); background: var(--cream-dark); }
        .calc-btn-op { color: var(--orange); font-weight: 800; }
        .calc-btn-eq { background: var(--orange); border-color: var(--orange); color: #FFFFFF; }
        .calc-btn-eq:hover { background: var(--orange-light); color: #FFFFFF; }
        .cst-bar-track { height: 9px; border-radius: 99px; background: var(--stone); overflow: hidden; }
        .cst-bar-fill { height: 100%; border-radius: 99px; transition: width 450ms cubic-bezier(0.22,0.68,0.32,1); }
        .cst-hero { border-radius: 18px; padding: 30px 32px; background: linear-gradient(125deg, #129A8F 0%, #0D6C63 55%, #093D38 100%); position: relative; overflow: hidden; box-shadow: 0 24px 50px -16px rgba(18,154,143,0.45); }
        .cst-hero::after { content: ''; position: absolute; top: -50%; right: -6%; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 68%); pointer-events: none; }
        .cst-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 99px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.22); }
        .cst-pill-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; background: rgba(255,255,255,0.95); color: var(--orange); border: none; transition: transform 140ms ease, box-shadow 140ms ease; box-shadow: 0 4px 14px rgba(0,0,0,0.14); }
        .cst-pill-btn:hover { transform: translateY(-1.5px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
        .cst-add-btn { font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--surface-3); color: var(--earth-2); cursor: pointer; transition: all 140ms ease; }
        .cst-add-btn:hover { background: var(--orange-dim); border-color: var(--orange-border); color: var(--orange); }
        .cst-tabbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; background: var(--cream-dark); padding: 5px; border-radius: 13px; border: 1px solid var(--glass-border); width: fit-content; }
        .cst-tab { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 140ms ease; white-space: nowrap; }
        .cst-tab:hover { color: var(--text); }
        .cst-tab.active { background: var(--surface-3); color: var(--orange); box-shadow: 0 1px 4px rgba(11,38,34,0.10); }
        .cst-logi-card { padding: 14px 16px; border-radius: 13px; border: 1.5px solid var(--glass-border); background: var(--surface-3); cursor: pointer; transition: all 150ms ease; position: relative; }
        .cst-logi-card.sel { border-color: var(--orange-border); background: var(--orange-dim); box-shadow: 0 4px 14px -6px rgba(18,154,143,0.30); }
        .cst-extra-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--glass-border); margin-bottom: 8px; }

        /* ========= KPI INTERNALS ========= */
        .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .kpi-label { font-size: 9px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1.5px; }
        .kpi-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: transform var(--t-normal); }
        .kpi-card:hover .kpi-icon { transform: scale(1.08) rotate(-3deg); }
        .kpi-icon svg { width: 14px; height: 14px; }
        .kpi-icon.gold  { background: var(--orange-dim); border: 1px solid var(--orange-border); color: var(--orange); }
        .kpi-icon.white { background: rgba(11,38,34,0.06); border: 1px solid var(--glass-border); color: var(--text-dim); }
        .kpi-val { font-size: 30px; font-weight: 700; letter-spacing: -1.2px; font-family: 'Fira Code', monospace; line-height: 1; margin-bottom: 6px; color: var(--text); }
        .kpi-sub { font-size: 11px; color: var(--text-dimmer); }

        /* ========= SECTION HEADER ========= */
        .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .sec-header h2 { font-size: 9.5px; font-weight: 700; color: var(--text-dimmer); letter-spacing: 1.8px; text-transform: uppercase; }

        /* ========= BUTTONS ========= */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; border: 1px solid transparent; transition: transform 140ms var(--ease-out), box-shadow 200ms var(--ease-out), background 140ms ease, color 140ms ease, border-color 140ms ease; white-space: nowrap; letter-spacing: 0.2px; }
        .btn svg { width: 13px; height: 13px; }
        .btn-gold { background: var(--orange); color: #FFFFFF; border: none; box-shadow: 0 4px 14px -4px rgba(18,154,143,0.40); }
        @media (hover: hover) and (pointer: fine) { .btn-gold:hover { transform: translateY(-1.5px); box-shadow: 0 8px 20px -4px rgba(18,154,143,0.50); } }
        .btn-gold:active { transform: scale(0.97); box-shadow: 0 2px 6px -2px rgba(18,154,143,0.25); }
        .btn-glass { background: var(--cream-dark); border-color: var(--glass-border); color: var(--text-dim); }
        @media (hover: hover) and (pointer: fine) { .btn-glass:hover { background: var(--stone); color: var(--text); border-color: var(--stone-mid); transform: translateY(-1px); } }
        .btn-glass:active { transform: scale(0.97); }
        .btn-sm { padding: 5px 11px; font-size: 11px; border-radius: 6px; }

        /* ========= CARDS & TABLES ========= */
        .card { border-radius: var(--r); overflow: hidden; transition: box-shadow var(--t-normal), border-color var(--t-normal); border: 1px solid var(--glass-border); background: var(--surface-2); }
        .card:hover { border-color: var(--stone-mid); box-shadow: 0 8px 28px -8px rgba(11,38,34,0.12); }
        .card-body { padding: 22px; }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 10px 16px; text-align: left; font-size: 9px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1.5px solid var(--stone); background: var(--cream-dark); white-space: nowrap; }
        tbody td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid rgba(11,38,34,0.06); color: var(--text); transition: background 120ms ease; }
        tbody tr:last-child td { border-bottom: none; }
        tfoot td { padding: 14px 16px; font-size: 13px; }
        tbody td:first-child { position: relative; }
        tbody td:first-child::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2.5px; background: var(--orange); opacity: 0; transition: opacity 150ms ease; }
        @media (hover: hover) and (pointer: fine) { tbody tr:hover td { background: rgba(18,154,143,0.04); } tbody tr:hover td:first-child::before { opacity: 1; } }

<script>
const firebaseConfig = {

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false });

// App secundaria de Firebase: crea cuentas de usuarios nuevos sin cerrar la sesión del master
// (el SDK de cliente cambia la sesión activa a la cuenta recién creada si se usa la app principal).
const crearUsuarioConAuth = async (email, password) => {
    const secApp = firebase.apps.find(a => a.name === 'Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
    const secAuth = secApp.auth();
    try {
        const cred = await secAuth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        await secAuth.signOut();
        return uid;
    } catch (err) {
        try { await secAuth.signOut(); } catch(e) {}
        throw err;
    }
};
</script>
