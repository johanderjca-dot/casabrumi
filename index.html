// ── APP ──
function App() {
    const [user,       setUser]       = useState(null);
    const [loading,    setLoading]    = useState(true);
    const [email,      setEmail]      = useState('');
    const [password,   setPassword]   = useState('');
    const [isLogin,    setIsLogin]    = useState(true);
    const [error,      setError]      = useState('');
    const [busy,       setBusy]       = useState(false);
    const [resetSent,  setResetSent]  = useState(false);

    const MASTER_EMAIL = 'johanderjca@gmail.com';

    useEffect(() => {
        return auth.onAuthStateChanged(firebaseUser => {
            if (firebaseUser) {
                const isMaster = firebaseUser.email === MASTER_EMAIL;
                // Carga inmediata sin esperar Firestore
                setUser({ uid: firebaseUser.uid, email: firebaseUser.email, role: isMaster ? 'master' : 'vendedor', photoURL: firebaseUser.photoURL || null });
                setLoading(false);
                // Actualiza con datos de Firestore en segundo plano
                db.collection('users').doc(firebaseUser.uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            setUser(prev => ({
                                ...prev,
                                role:     isMaster ? 'master' : (doc.data().role || prev.role),
                                photoURL: doc.data().photoURL || prev.photoURL,
                            }));
                        }
                    })
                    .catch(() => {});
            } else {
                setUser(null);
                setLoading(false);
            }
        });
    }, []);

    const handleAuth = async e => {
        e.preventDefault();
        setError(''); setBusy(true);
        try {
            if (isLogin) {
                await auth.signInWithEmailAndPassword(email, password);
            } else {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const role = email === 'johanderjca@gmail.com' ? 'master' : 'vendedor';
                await db.collection('users').doc(cred.user.uid).set({
                    email, role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                if (role === 'vendedor') {
                    await db.collection('vendedores').add({
                        nombre:          email.split('@')[0],
                        email,
                        uid:             cred.user.uid,
                        activo:          true,
                        autoRegistrado:  true,
                        fechaAlta:       firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }
            }
        } catch (err) {
            const msgs = {
                'auth/user-not-found':   'Usuario no encontrado.',
                'auth/wrong-password':   'Contrasena incorrecta.',
                'auth/email-already-in-use': 'El correo ya esta registrado.',
                'auth/invalid-email':    'Correo invalido.',
                'auth/weak-password':    'La contrasena debe tener al menos 6 caracteres.',
                'auth/invalid-credential': 'Credenciales incorrectas.',
            };
            setError(msgs[err.code] || err.message);
        }
        setBusy(false);
    };

    const handleReset = async () => {
        if (!email) { setError('Ingresa tu correo para restablecer la contraseña.'); return; }
        setBusy(true); setError('');
        try {
            await auth.sendPasswordResetEmail(email);
            setResetSent(true);
        } catch (err) {
            setError('No se pudo enviar el correo. Verifica que el email sea correcto.');
        }
        setBusy(false);
    };

    const handleLogout = () => auth.signOut();

    const handlePhotoChange = async (file) => {
        if (!file || !auth.currentUser) return;
        try {
            const stor     = firebase.storage();
            const ref      = stor.ref(`avatars/${auth.currentUser.uid}`);
            await ref.put(file);
            const photoURL = await ref.getDownloadURL();
            await auth.currentUser.updateProfile({ photoURL });
            await db.collection('users').doc(auth.currentUser.uid).update({ photoURL });
            setUser(prev => ({ ...prev, photoURL }));
        } catch(e) { console.error('Error subiendo foto:', e); }
    };

    if (loading) return (
        <div className="loading-screen glass">
            <div className="spinner" />
        </div>
    );

    if (!user) return (
        <div className="auth-wrap">
            <div className="auth-left">
                <div className="auth-left-glow" />
                <div className="auth-logo-wrap">
                    <img src={LOGO} alt="Casa Brumi Importaciones" />
                </div>
            </div>
            <div className="auth-right">
                <div className="auth-form-box glass glass-mid" style={{borderRadius:'18px', padding:'36px', boxShadow:'var(--glass-shadow-lg)'}}>
                    <h2>{isLogin ? 'Bienvenido de vuelta' : 'Crear cuenta'}</h2>
                    <p className="auth-subtitle">{isLogin ? 'Ingresa tus credenciales para acceder' : 'Completa los datos para registrarte'}</p>
                    <form onSubmit={handleAuth} noValidate>
                        <div className="form-group">
                            <label htmlFor="a-email">Correo electronico</label>
                            <div className="input-wrap">
                                <span className="input-icon">{I.mail}</span>
                                <input id="a-email" className="form-input glass" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="tu@casabrumi.com" required />
                            </div>
                        </div>
                        <div className="form-group" style={{marginBottom:12}}>
                            <label htmlFor="a-pass">Contrasena</label>
                            <div className="input-wrap">
                                <span className="input-icon">{I.lock}</span>
                                <input id="a-pass" className="form-input glass" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
                            </div>
                        </div>
                        {error && <div className="error-msg">{error}</div>}
                        {resetSent && <div style={{background:'rgba(34,197,94,0.12)', border:'1px solid rgba(34,197,94,0.25)', borderRadius:'var(--r-sm)', padding:'10px 13px', fontSize:'12.5px', color:'#4ade80', marginBottom:14}}>Correo enviado. Revisa tu bandeja de entrada.</div>}

                        <button className="btn-submit" type="submit" disabled={busy}>
                            {busy ? 'Cargando...' : (isLogin ? 'Iniciar sesion' : 'Crear cuenta')}
                        </button>
                    </form>
                    {isLogin && (
                        <p style={{textAlign:'center', marginTop:12, fontSize:'12.5px'}}>
                            <a style={{color:'var(--text-dimmer)', cursor:'pointer'}} onClick={handleReset}>¿Olvidaste tu contraseña?</a>
                        </p>
                    )}
                    <p className="auth-switch">
                        {isLogin ? '¿No tienes cuenta? ' : '¿Ya tienes cuenta? '}
                        <a onClick={() => { setIsLogin(!isLogin); setError(''); setResetSent(false); }}>{isLogin ? 'Crear una' : 'Iniciar sesion'}</a>
                    </p>
                </div>
            </div>
        </div>
    );

    return user.role === 'master'
        ? <AdminPanel user={user} onLogout={handleLogout} onPhotoChange={handlePhotoChange} />
        : <VendedorPanel user={user} onLogout={handleLogout} onPhotoChange={handlePhotoChange} />;
}

// ── HEADER ──
function Header({ user, onLogout, activeTab, navSections, onPhotoChange }) {
    const fileRef = React.useRef(null);
    const current = navSections.flatMap(s=>s.items).find(i=>i.key===activeTab);
    const today   = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    return (
        <header className="app-header">
            <div className="app-header-logo">
                <img src={LOGO} alt="Casa Brumi" />
            </div>
            <div className="app-header-title">
                <strong>{current?.label || 'Dashboard'}</strong>
                <span>{today}</span>
            </div>
            <div className="app-header-right">
                <div className="app-header-divider" />
                <div className="app-header-avatar"
                    onClick={() => fileRef.current?.click()}
                    title="Clic para cambiar foto"
                    style={{cursor:'pointer', overflow:'hidden', flexShrink:0}}>
                    {user.photoURL
                        ? <img src={user.photoURL} style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}} alt="foto" />
                        : user.email[0].toUpperCase()
                    }
                    <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}}
                        onChange={e => { if(e.target.files[0]) onPhotoChange(e.target.files[0]); e.target.value=''; }} />
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <span style={{fontSize:'9px',fontWeight:'700',color:'var(--sand-dark)',textTransform:'uppercase',letterSpacing:'1.2px'}}>{user.role}</span>
                    <span style={{fontSize:'11px',color:'var(--text-dimmer)',maxWidth:'160px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.email}</span>
                </div>
                <button className="btn-logout" onClick={onLogout} aria-label="Cerrar sesion">{I.logout}</button>
            </div>
        </header>
    );
}

// ── SIDEBAR ──
function Sidebar({ activeTab, setActiveTab, navSections }) {
    return (
        <aside className="sidebar" style={{borderRadius:0}}>
            <nav className="sidebar-nav">
                {navSections.map((sec, si) => (
                    <div key={si}>
                        <div className="nav-label">{sec.label}</div>
                        {sec.items.map(item => (
                            <div key={item.key} className={`nav-item ${activeTab === item.key ? 'active' : ''}`}
                                onClick={() => setActiveTab(item.key)} role="button" tabIndex={0}
                                onKeyDown={e => e.key === 'Enter' && setActiveTab(item.key)}>
                                <span aria-hidden="true">{item.icon}</span>{item.label}
                            </div>
                        ))}
                    </div>
                ))}
            </nav>
        </aside>
    );
}

// ── ADMIN PANEL ──
function AdminPanel({ user, onLogout, onPhotoChange }) {
    const [activeTab,  setActiveTab]  = useState('dashboard');
    const [vendedores, setVendedores] = useState([]);
    const [ventas,     setVentas]     = useState([]);
    const [showModal,  setShowModal]  = useState(false);
    const [form,       setForm]       = useState({ nombre: '', email: '' });
    const [saving,     setSaving]     = useState(false);
    const firstInputRef  = useRef(null);
    const firstGastoRef  = useRef(null);
    const chartRef       = useRef(null);
    const chartInst      = useRef(null);
    const CATEGORIAS     = ['Operacional','Importación','GROWTH','Logística','Personal','Impuestos','Almacenamiento'];
    const PROPIETARIOS   = ['Johander','Germán'];
    const [gastos,         setGastos]         = useState([]);
    const [showGastoModal, setShowGastoModal] = useState(false);
    const [gastoForm,      setGastoForm]      = useState({ categoria:'Operacional', descripcion:'', monto:'', moneda:'USD', medioPago:'Efectivo', propietario:'Johander', terminal:'', proveedor:'', esCredito:false, montoAbonado:'' });
    const [savingGasto,    setSavingGasto]    = useState(false);
    const [activeCat,           setActiveCat]           = useState(null);
    const [showAbonoModal,      setShowAbonoModal]      = useState(false);
    const [selectedGasto,       setSelectedGasto]       = useState(null);
    const [abonoMonto,          setAbonoMonto]          = useState('');
    const [showPagoRapidoModal, setShowPagoRapidoModal] = useState(false);
    const [pagoRapidoId,        setPagoRapidoId]        = useState('');
    const [gastoError,          setGastoError]          = useState('');
    const [usuarios,            setUsuarios]            = useState([]);

    useEffect(() => {
        const unsub = db.collection('users').onSnapshot(
            snap => setUsuarios(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
            () => {} // ignora error de permisos
        );
        return unsub;
    }, []);

    const cambiarRol = async (uid, nuevoRol) => {
        if (!uid) return;
        await db.collection('users').doc(uid).update({ role: nuevoRol });
    };

    useEffect(() => {
        const unsub = db.collection('vendedores').orderBy('fechaAlta', 'desc').onSnapshot(
            snap => setVendedores(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
            () => {}
        );
        return unsub;
    }, []);

    useEffect(() => {
        const unsub = db.collection('ventas').orderBy('fecha', 'desc').onSnapshot(
            snap => setVentas(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
            () => {}
        );
        return unsub;
    }, []);

    useEffect(() => {
        const unsub = db.collection('gastos').orderBy('fecha', 'desc').onSnapshot(
            snap => setGastos(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
            () => {}
        );
        return unsub;
    }, []);

    useEffect(() => { if (showModal      && firstInputRef.current) firstInputRef.current.focus(); }, [showModal]);
    useEffect(() => { if (showGastoModal && firstGastoRef.current) firstGastoRef.current.focus(); }, [showGastoModal]);

    useEffect(() => {
        if (activeTab !== 'dashboard' || !chartRef.current || typeof Chart === 'undefined') return;
        const days = Array.from({length:7}, (_,i) => { const d=new Date(); d.setDate(d.getDate()-(6-i)); return d; });
        const data = days.map(d => ventas.filter(v => { const vd=v.fecha?.toDate?.(); return vd&&vd.toDateString()===d.toDateString(); }).reduce((s,v)=>s+(v.monto||0),0));
        const labels = days.map(d => d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric'}));
        if (chartInst.current) chartInst.current.destroy();
        chartInst.current = new Chart(chartRef.current, {
            type: 'bar',
            data: { labels, datasets: [{ data, backgroundColor:'rgba(28,24,20,0.82)', hoverBackgroundColor:'#B8A48C', borderRadius:6, borderSkipped:false }] },
            options: {
                responsive:true, maintainAspectRatio:false,
                plugins: {
                    legend:{ display:false },
                    tooltip:{ backgroundColor:'#1C1814', titleColor:'#fff', bodyColor:'rgba(255,255,255,0.65)', padding:10, cornerRadius:8,
                        callbacks:{ label: ctx => ` $${ctx.raw.toFixed(2)}` } }
                },
                scales: {
                    y: { grid:{ color:'rgba(28,24,20,0.05)' }, ticks:{ color:'rgba(28,24,20,0.35)', font:{family:'Fira Code',size:11} }, border:{ display:false } },
                    x: { grid:{ display:false }, ticks:{ color:'rgba(28,24,20,0.45)', font:{size:11} }, border:{ display:false } }
                }
            }
        });
        return () => { if (chartInst.current) { chartInst.current.destroy(); chartInst.current=null; } };
    }, [activeTab, ventas]);

    const addVendedor = async () => {
        if (!form.nombre || !form.email || saving) return;
        setSaving(true);
        await db.collection('vendedores').add({
            nombre: form.nombre,
            email:  form.email,
            activo: true,
            fechaAlta: firebase.firestore.FieldValue.serverTimestamp(),
        });
        setForm({ nombre: '', email: '' });
        setShowModal(false);
        setSaving(false);
    };

    const addGasto = async () => {
        if (!gastoForm.descripcion || !gastoForm.monto || savingGasto) return;
        setSavingGasto(true);
        setGastoError('');
        try {
            const abonoInicial = gastoForm.esCredito ? parseFloat(gastoForm.montoAbonado || 0) : 0;
            const data = {
                categoria:       gastoForm.categoria,
                descripcion:     gastoForm.descripcion,
                monto:           parseFloat(gastoForm.monto),
                moneda:          gastoForm.moneda || 'USD',
                medioPago:       gastoForm.medioPago,
                propietario:     gastoForm.propietario,
                terminal:        gastoForm.medioPago === 'Tarjeta' ? gastoForm.terminal : '',
                proveedor:       gastoForm.proveedor,
                esCredito:       gastoForm.esCredito,
                montoAbonado:    abonoInicial,
                historialAbonos: abonoInicial > 0 ? [{ monto: abonoInicial, fecha: new Date().toISOString() }] : [],
                fecha:           firebase.firestore.FieldValue.serverTimestamp(),
            };
            setGastoForm({ categoria:'Operacional', descripcion:'', monto:'', moneda:'USD', medioPago:'Efectivo', propietario:'Johander', terminal:'', proveedor:'', esCredito:false, montoAbonado:'' });
            setShowGastoModal(false);
            await db.collection('gastos').add(data);
        } catch(e) {
            setGastoError('Error: ' + (e.code === 'permission-denied' ? 'Sin permiso — revisa las reglas de Firestore.' : e.message || e.code));
            setShowGastoModal(true);
        }
        setSavingGasto(false);
    };

    const addAbono = async (gastoRef, monto, historial) => {
        if (!monto || parseFloat(monto) <= 0) return;
        const nuevoTotal  = (gastoRef.montoAbonado || 0) + parseFloat(monto);
        const nuevoHistorial = [...(gastoRef.historialAbonos || []), { monto: parseFloat(monto), fecha: new Date().toISOString() }];
        await db.collection('gastos').doc(gastoRef.id).update({ montoAbonado: nuevoTotal, historialAbonos: nuevoHistorial });
    };

    const handleAddAbono = async () => {
        if (!abonoMonto || !selectedGasto) return;
        await addAbono(selectedGasto, abonoMonto, selectedGasto.historialAbonos);
        setAbonoMonto(''); setShowAbonoModal(false); setSelectedGasto(null);
    };

    const revertirAbono = async (gasto, idx) => {
        const historial    = [...(gasto.historialAbonos || [])];
        const montoRetirar = historial[idx].monto || 0;
        historial.splice(idx, 1);
        const nuevoTotal = Math.max(0, (gasto.montoAbonado || 0) - montoRetirar);
        await db.collection('gastos').doc(gasto.id).update({ montoAbonado: nuevoTotal, historialAbonos: historial });
    };

    const handlePagoRapido = async () => {
        if (!pagoRapidoId || !abonoMonto) return;
        const g = gastos.find(x => x.id === pagoRapidoId);
        if (!g) return;
        await addAbono(g, abonoMonto, g.historialAbonos);
        setAbonoMonto(''); setPagoRapidoId(''); setShowPagoRapidoModal(false);
    };

    const totalVentas = ventas.reduce((s, v) => s + (v.monto || 0), 0);

    const navSections = [
        { label: 'Principal', items: [{ key: 'dashboard',   label: 'Dashboard',   icon: I.chart }] },
        { label: 'Gestion',   items: [
            { key: 'vendedores',  label: 'Vendedores',  icon: I.users  },
            { key: 'proveedores', label: 'Proveedores', icon: I.truck  },
            { key: 'gastos',      label: 'Gastos',      icon: I.dollar },
        ]},
    ];

    return (
        <div className="app-root">
            <img src={LOGO} aria-hidden="true" style={{position:'fixed',top:'50%',left:'50%',transform:'translate(calc(-50% + 110px), -50%)',width:'520px',maxWidth:'55vw',opacity:0.055,filter:'brightness(0)',pointerEvents:'none',userSelect:'none',zIndex:0}} />
            <Header user={user} onLogout={onLogout} activeTab={activeTab} navSections={navSections} onPhotoChange={onPhotoChange} />
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} navSections={navSections} />
            <main className="main">

                {activeTab === 'dashboard' && <>
                    <div className="kpi-grid">
                        {[
                            { label: 'Vendedores',    val: vendedores.length,        sub: 'registrados',   icon: I.users,   v: 'gold'  },
                            { label: 'Ventas hoy',    val: ventas.filter(v => { const d=v.fecha?.toDate?.(); return d&&d.toDateString()===new Date().toDateString(); }).length, sub: 'registradas hoy', icon: I.invoice, v: 'white' },
                            { label: 'Total ventas',  val: ventas.length,            sub: 'en el sistema', icon: I.chart,   v: 'white' },
                            { label: 'Monto total',   val: `$${totalVentas.toFixed(0)}`, sub: 'acumulado', icon: I.dollar,  v: 'gold'  },
                        ].map((k, i) => (
                            <div className={`kpi-card glass ${i%2===0?'glass-mid':''}`} key={i}>
                                <div className="kpi-top"><div className="kpi-label">{k.label}</div><div className={`kpi-icon ${k.v}`}>{k.icon}</div></div>
                                <div className="kpi-val">{k.val}</div>
                                <div className="kpi-sub">{k.sub}</div>
                            </div>
                        ))}
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:14,marginBottom:20}}>
                        <div className="card glass" style={{padding:'22px 24px'}}>
                            <div className="sec-header" style={{marginBottom:16}}><h2>Ventas — últimos 7 días</h2></div>
                            <div style={{height:'200px'}}><canvas ref={chartRef}></canvas></div>
                        </div>
                        <div className="card glass" style={{padding:'22px 24px'}}>
                            <div className="sec-header" style={{marginBottom:14}}><h2>Resumen</h2></div>
                            {[
                                { label:'Total acumulado', val:`$${totalVentas.toFixed(0)}`, icon:I.dollar },
                                { label:'Vendedores activos', val:vendedores.length, icon:I.users },
                                { label:'Ventas registradas', val:ventas.length, icon:I.chart },
                            ].map((r,i)=>(
                                <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:i<2?'1px solid var(--glass-border)':'none'}}>
                                    <div className="kpi-icon gold">{r.icon}</div>
                                    <div style={{flex:1}}>
                                        <div style={{fontSize:'10.5px',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'0.8px',fontWeight:'700'}}>{r.label}</div>
                                        <div style={{fontSize:'18px',fontWeight:'700',fontFamily:'Fira Code',color:'var(--text)',letterSpacing:'-0.5px',marginTop:2}}>{r.val}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {ventas.length > 0 && (
                        <>
                            <div className="sec-header" style={{marginTop:4}}><h2>Últimas ventas</h2></div>
                            <div className="card glass">
                                <table>
                                    <thead><tr><th>Vendedor</th><th>Cliente</th><th>Producto</th><th>Monto</th><th>Estado</th></tr></thead>
                                    <tbody>
                                        {ventas.slice(0,5).map((v, i) => (
                                            <tr key={i}>
                                                <td style={{color:'var(--text-dim)', fontSize:'12px'}}>{v.vendedorEmail || '—'}</td>
                                                <td><strong>{v.cliente || '—'}</strong></td>
                                                <td style={{color:'var(--text-dim)'}}>{v.producto || '—'}</td>
                                                <td className="td-num"><strong>${(v.monto||0).toFixed(2)}</strong></td>
                                                <td><span className="badge badge-gray"><span className="badge-dot"/>{v.estado || 'Pendiente'}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </>
                    )}
                </>}

                {activeTab === 'vendedores' && <>
                    <div className="page-header"><h1>Vendedores</h1><p>Equipo de ventas y control de acceso</p></div>
                    <div className="sec-header">
                        <h2>{vendedores.length} vendedor{vendedores.length !== 1 ? 'es' : ''} registrado{vendedores.length !== 1 ? 's' : ''}</h2>
                        <button className="btn btn-gold" onClick={() => setShowModal(true)}>{I.plus} Agregar vendedor</button>
                    </div>
                    <div className="card glass">
                        {vendedores.length > 0 ? (
                            <table>
                                <thead><tr><th>Nombre</th><th>Correo</th><th>Alta</th><th>Cuenta</th><th>Herramientas / Rol</th></tr></thead>
                                <tbody>
                                    {vendedores.map((v, i) => {
                                        const userDoc = usuarios.find(u => u.email === v.email || (v.uid && u.id === v.uid));
                                        return (
                                            <tr key={i}>
                                                <td>
                                                    <strong>{v.nombre}</strong>
                                                    {v.autoRegistrado && <span className="badge badge-gold" style={{marginLeft:8,fontSize:'9.5px'}}><span className="badge-dot"/>Auto-reg.</span>}
                                                </td>
                                                <td style={{color:'var(--text-dim)'}}>{v.email}</td>
                                                <td className="td-num" style={{color:'var(--text-dimmer)',fontSize:'12px'}}>
                                                    {v.fechaAlta?.toDate?.().toLocaleDateString('es') || '—'}
                                                </td>
                                                <td>
                                                    {userDoc
                                                        ? <span className="badge badge-green"><span className="badge-dot"/>Con acceso</span>
                                                        : <span className="badge badge-gray"><span className="badge-dot"/>Sin cuenta</span>}
                                                </td>
                                                <td>
                                                    {userDoc ? (
                                                        <select value={userDoc.role || 'vendedor'}
                                                            onChange={e => cambiarRol(userDoc.id, e.target.value)}
                                                            style={{fontSize:'12px',padding:'5px 10px',border:'1px solid var(--glass-border)',borderRadius:'6px',background:'var(--glass-bg-mid)',color:'var(--text)',fontFamily:'inherit',cursor:'pointer',outline:'none'}}>
                                                            <option value="vendedor">Vendedor</option>
                                                            <option value="master">Master</option>
                                                        </select>
                                                    ) : (
                                                        <span style={{fontSize:'12px',color:'var(--text-dimmer)'}}>—</span>
                                                    )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty">
                                <div className="empty-icon">{I.users}</div>
                                <h3>Sin vendedores aun</h3>
                                <p>Agrega tu primer vendedor para comenzar.</p>
                            </div>
                        )}
                    </div>
                </>}

                {activeTab === 'proveedores' && <>
                    <div className="page-header"><h1>Proveedores</h1><p>Gestion por pais de origen</p></div>
                    <div className="card glass"><div className="coming-soon"><div className="cs-icon">{I.truck}</div><h3>Modulo de Proveedores</h3><div className="cs-bar"/><p>Proxima fase — Republica Dominicana y Venezuela</p></div></div>
                </>}

                {activeTab === 'gastos' && (() => {
                    if (!activeCat) return (
                        <>
                            <div className="page-header"><h1>Gastos</h1><p>Selecciona una categoría para ver el detalle</p></div>
                            <div className="sec-header">
                                <span/>
                                <div style={{display:'flex',gap:8}}>
                                    {gastos.some(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0) && (
                                        <button className="btn btn-glass" onClick={()=>setShowPagoRapidoModal(true)}>{I.dollar} Registrar Pago</button>
                                    )}
                                    <button className="btn btn-gold" onClick={()=>setShowGastoModal(true)}>{I.plus} Nuevo Gasto</button>
                                </div>
                            </div>
                            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(148px,1fr))', gap:12}}>
                                {CATEGORIAS.map(cat => {
                                    const pendientes = gastos.filter(g=>g.categoria===cat&&g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0).length;
                                    return (
                                        <div key={cat} className="card glass"
                                            style={{padding:'22px 18px', cursor:'pointer', transition:'transform var(--t-fast), box-shadow var(--t-fast)'}}
                                            onClick={()=>setActiveCat(cat)}
                                            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.08)';}}
                                            onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='';}}>
                                            <div style={{fontSize:'13.5px',fontWeight:'600',color:'var(--text)',marginBottom:pendientes?8:0}}>{cat}</div>
                                            {pendientes>0 && <span className="badge badge-gold" style={{fontSize:'10px'}}><span className="badge-dot"/>{pendientes} crédito{pendientes>1?'s':''} pendiente{pendientes>1?'s':''}</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    );
                    const catGastos   = gastos.filter(g=>g.categoria===activeCat);
                    const catTotal    = catGastos.reduce((s,g)=>s+(g.monto||0),0);
                    const catCreditos = catGastos.filter(g=>g.esCredito);
                    const catPendiente= catCreditos.reduce((s,g)=>s+Math.max(0,(g.monto||0)-(g.montoAbonado||0)),0);
                    return (
                        <>
                            <div className="page-header" style={{display:'flex',alignItems:'center',gap:14}}>
                                <button className="btn btn-glass btn-sm" onClick={()=>setActiveCat(null)}>← Volver</button>
                                <div>
                                    <h1>{activeCat}</h1>
                                    <p>{catGastos.length} gasto{catGastos.length!==1?'s':''} registrado{catGastos.length!==1?'s':''}</p>
                                </div>
                            </div>
                            <div className="kpi-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
                                <div className="kpi-card glass glass-mid">
                                    <div className="kpi-top"><div className="kpi-label">Total</div><div className="kpi-icon white">{I.dollar}</div></div>
                                    <div className="kpi-val">${catTotal.toFixed(0)}</div>
                                    <div className="kpi-sub">{catGastos.length} gastos</div>
                                </div>
                                <div className="kpi-card glass">
                                    <div className="kpi-top"><div className="kpi-label">En crédito</div><div className="kpi-icon gold">{I.invoice}</div></div>
                                    <div className="kpi-val">${catCreditos.reduce((s,g)=>s+(g.monto||0),0).toFixed(0)}</div>
                                    <div className="kpi-sub">{catCreditos.length} gasto{catCreditos.length!==1?'s':''}</div>
                                </div>
                                <div className="kpi-card glass glass-mid">
                                    <div className="kpi-top"><div className="kpi-label">Por pagar</div><div className="kpi-icon gold">{I.dollar}</div></div>
                                    <div className="kpi-val" style={{color: catPendiente>0?'var(--sand-dark)':'var(--text)'}}>${catPendiente.toFixed(0)}</div>
                                    <div className="kpi-sub">{catCreditos.filter(g=>(g.monto||0)-(g.montoAbonado||0)>0).length} pendientes</div>
                                </div>
                            </div>
                            <div className="card glass">
                                {catGastos.length > 0 ? (
                                    <table>
                                        <thead><tr><th>Fecha</th><th>Descripción</th><th>Proveedor</th><th>Pago</th><th>Monto</th><th>Estado crédito</th><th>Historial abonos</th><th></th></tr></thead>
                                        <tbody>
                                            {catGastos.map((g,i)=>{
                                                const restante  = Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                                const sym       = g.moneda==='DOP'?'RD$':'$';
                                                const historial = g.historialAbonos||[];
                                                return (
                                                    <tr key={i}>
                                                        <td className="td-num" style={{color:'var(--text-dimmer)',fontSize:'12px'}}>{g.fecha?.toDate?.().toLocaleDateString('es-CO')||'—'}</td>
                                                        <td><strong>{g.descripcion||'—'}</strong></td>
                                                        <td style={{color:'var(--text-dim)'}}>{g.proveedor||'—'}</td>
                                                        <td style={{fontSize:'12.5px'}}>{g.medioPago}{g.terminal?<span style={{color:'var(--text-dimmer)'}}> · {g.terminal}</span>:''}<br/><span style={{fontSize:'11px',color:'var(--text-dimmer)'}}>{g.propietario}</span></td>
                                                        <td className="td-num"><strong>{sym}{(g.monto||0).toFixed(2)}</strong><br/><span style={{fontSize:'10px',color:'var(--text-dimmer)'}}>{g.moneda||'USD'}</span></td>
                                                        <td>
                                                            {!g.esCredito
                                                                ? <span className="badge badge-gray"><span className="badge-dot"/>Contado</span>
                                                                : restante <= 0
                                                                    ? <span className="badge badge-green"><span className="badge-dot"/>Pagado</span>
                                                                    : (g.montoAbonado||0) > 0
                                                                        ? <><span className="badge badge-gold"><span className="badge-dot"/>Abonado</span><br/><span style={{fontSize:'11px',color:'var(--sand-dark)',fontFamily:'Fira Code'}}>{sym}{restante.toFixed(0)} resta</span></>
                                                                        : <span className="badge badge-gray"><span className="badge-dot"/>Pendiente</span>
                                                            }
                                                        </td>
                                                        <td style={{fontSize:'11.5px',color:'var(--text-dim)',minWidth:'160px'}}>
                                                            {historial.length > 0
                                                                ? historial.map((a,ai)=>(
                                                                    <div key={ai} style={{marginBottom:4,display:'flex',gap:6,alignItems:'center'}}>
                                                                        <span style={{fontFamily:'Fira Code',fontWeight:'600',color:'var(--text)'}}>{sym}{(a.monto||0).toFixed(0)}</span>
                                                                        <span style={{color:'var(--text-dimmer)',fontSize:'10.5px'}}>{new Date(a.fecha).toLocaleDateString('es-CO')}</span>
                                                                        <button onClick={()=>revertirAbono(g,ai)} title="Eliminar este abono"
                                                                            style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-dimmer)',fontSize:'13px',lineHeight:1,padding:'0 2px',borderRadius:'3px'}}
                                                                            onMouseEnter={e=>e.currentTarget.style.color='#8B3535'}
                                                                            onMouseLeave={e=>e.currentTarget.style.color='var(--text-dimmer)'}>×</button>
                                                                    </div>
                                                                ))
                                                                : <span style={{color:'var(--text-dimmer)'}}>—</span>
                                                            }
                                                        </td>
                                                        <td>{g.esCredito && restante > 0 && (
                                                            <button className="btn btn-glass btn-sm" onClick={()=>{setSelectedGasto(g);setAbonoMonto('');setShowAbonoModal(true);}}>+ Abono</button>
                                                        )}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                ) : (
                                    <div className="empty">
                                        <div className="empty-icon">{I.dollar}</div>
                                        <h3>Sin gastos en {activeCat}</h3>
                                        <p>Registra el primer gasto en esta categoría.</p>
                                    </div>
                                )}
                            </div>
                        </>
                    );
                })()}

                {showModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Nuevo Vendedor</h2>
                                <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre completo</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    ref={firstInputRef} value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Ej. Maria Lopez" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Correo electronico</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="maria@casabrumi.com" />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => setShowModal(false)}>Cancelar</button>
                                <button className="btn btn-gold" onClick={addVendedor} disabled={saving}>
                                    {saving ? 'Guardando...' : <>{I.plus} Crear Vendedor</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showAbonoModal && selectedGasto && (
                    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:380}}>
                            <div className="modal-hd">
                                <h2>Registrar Abono</h2>
                                <button className="modal-close" onClick={()=>{setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}>×</button>
                            </div>
                            <div style={{background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',padding:'14px 16px',marginBottom:18,fontSize:'13px'}}>
                                <div style={{fontWeight:'600',color:'var(--text)',marginBottom:6}}>{selectedGasto.descripcion}</div>
                                <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                                    <span style={{color:'var(--text-dim)'}}>Total: <strong style={{color:'var(--text)'}}>${(selectedGasto.monto||0).toFixed(2)}</strong></span>
                                    <span style={{color:'var(--text-dim)'}}>Abonado: <strong style={{color:'var(--text)'}}>${(selectedGasto.montoAbonado||0).toFixed(2)}</strong></span>
                                    <span style={{color:'var(--text-dim)'}}>Resta: <strong style={{color:'var(--sand-dark)'}}>${Math.max(0,(selectedGasto.monto||0)-(selectedGasto.montoAbonado||0)).toFixed(2)}</strong></span>
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Monto del abono (USD)</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    type="number" min="0" step="0.01" inputMode="decimal" autoFocus
                                    value={abonoMonto} onChange={e=>setAbonoMonto(e.target.value)} placeholder="0.00" />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowAbonoModal(false);setSelectedGasto(null);setAbonoMonto('');}}>Cancelar</button>
                                <button className="btn btn-gold" onClick={handleAddAbono} style={{flex:1,justifyContent:'center'}}>Registrar Abono</button>
                            </div>
                        </div>
                    </div>
                )}

                {showPagoRapidoModal && (() => {
                    const pendientes = gastos.filter(g=>g.esCredito&&(g.monto||0)-(g.montoAbonado||0)>0);
                    const gastoSel   = pendientes.find(g=>g.id===pagoRapidoId);
                    const sym        = gastoSel?.moneda==='DOP'?'RD$':'$';
                    return (
                        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}}>
                            <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:420}}>
                                <div className="modal-hd">
                                    <h2>Registrar Pago</h2>
                                    <button className="modal-close" onClick={()=>{setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}>×</button>
                                </div>
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Selecciona el gasto</label>
                                    <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        value={pagoRapidoId} onChange={e=>setPagoRapidoId(e.target.value)}>
                                        <option value="">— Seleccionar —</option>
                                        {pendientes.map(g=>{
                                            const r = Math.max(0,(g.monto||0)-(g.montoAbonado||0));
                                            const s = g.moneda==='DOP'?'RD$':'$';
                                            return <option key={g.id} value={g.id}>{g.descripcion} · {g.categoria} · {s}{r.toFixed(0)} pendiente</option>;
                                        })}
                                    </select>
                                </div>
                                {gastoSel && (
                                    <div style={{background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',padding:'12px 14px',marginBottom:14,fontSize:'12.5px'}}>
                                        <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                                            <span style={{color:'var(--text-dim)'}}>Total: <strong>{sym}{(gastoSel.monto||0).toFixed(2)}</strong></span>
                                            <span style={{color:'var(--text-dim)'}}>Abonado: <strong>{sym}{(gastoSel.montoAbonado||0).toFixed(2)}</strong></span>
                                            <span style={{color:'var(--text-dim)'}}>Resta: <strong style={{color:'var(--sand-dark)'}}>{sym}{Math.max(0,(gastoSel.monto||0)-(gastoSel.montoAbonado||0)).toFixed(2)}</strong></span>
                                        </div>
                                    </div>
                                )}
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Monto del abono</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={abonoMonto} onChange={e=>setAbonoMonto(e.target.value)} placeholder="0.00" />
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-glass" onClick={()=>{setShowPagoRapidoModal(false);setPagoRapidoId('');setAbonoMonto('');}}>Cancelar</button>
                                    <button className="btn btn-gold" onClick={handlePagoRapido} disabled={!pagoRapidoId||!abonoMonto} style={{flex:1,justifyContent:'center'}}>Registrar Pago</button>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {showGastoModal && (
                    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowGastoModal(false);}}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:480}}>
                            <div className="modal-hd">
                                <h2>Nuevo Gasto</h2>
                                <button className="modal-close" onClick={()=>setShowGastoModal(false)}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Categoría</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.categoria} onChange={e=>setGastoForm({...gastoForm,categoria:e.target.value})}>
                                    {CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Descripción</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    ref={firstGastoRef} value={gastoForm.descripcion} onChange={e=>setGastoForm({...gastoForm,descripcion:e.target.value})}
                                    placeholder="Ej. Flete desde Venezuela" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Proveedor</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.proveedor} onChange={e=>setGastoForm({...gastoForm,proveedor:e.target.value})}
                                    placeholder="Nombre del proveedor o empresa" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Monto</label>
                                <div style={{display:'flex',gap:8}}>
                                    <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',width:'100px',flexShrink:0}}
                                        value={gastoForm.moneda} onChange={e=>setGastoForm({...gastoForm,moneda:e.target.value})}>
                                        <option value="USD">USD $</option>
                                        <option value="DOP">DOP RD$</option>
                                    </select>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)',flex:1}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={gastoForm.monto} onChange={e=>setGastoForm({...gastoForm,monto:e.target.value})} placeholder="0.00" />
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Medio de pago</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.medioPago} onChange={e=>setGastoForm({...gastoForm,medioPago:e.target.value,terminal:''})}>
                                    <option>Efectivo</option>
                                    <option>Tarjeta</option>
                                    <option>Transferencia</option>
                                </select>
                            </div>
                            {gastoForm.medioPago === 'Tarjeta' && (
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Terminal / Banco</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        value={gastoForm.terminal} onChange={e=>setGastoForm({...gastoForm,terminal:e.target.value})}
                                        placeholder="Ej. Bancolombia, Davivienda..." />
                                </div>
                            )}
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Propietario</label>
                                <select className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                    value={gastoForm.propietario} onChange={e=>setGastoForm({...gastoForm,propietario:e.target.value})}>
                                    {PROPIETARIOS.map(p=><option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <button type="button"
                                    style={{width:'100%',padding:'11px',border:`2px solid ${gastoForm.esCredito?'var(--text)':'var(--glass-border-h)'}`,borderRadius:'var(--r-sm)',background:gastoForm.esCredito?'var(--text)':'transparent',color:gastoForm.esCredito?'#FFFFFF':'var(--text-dim)',fontFamily:'inherit',fontWeight:'700',fontSize:'12px',letterSpacing:'1.5px',cursor:'pointer',transition:'all var(--t-fast)',textTransform:'uppercase'}}
                                    onClick={()=>setGastoForm({...gastoForm,esCredito:!gastoForm.esCredito,montoAbonado:''})}>
                                    {gastoForm.esCredito ? '✓ Crédito activo' : 'Crédito'}
                                </button>
                            </div>
                            {gastoForm.esCredito && (
                                <div className="form-group">
                                    <label style={{color:'var(--text-dim)'}}>Ya abonado (USD) — dejar en 0 si no has pagado nada</label>
                                    <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)',border:'1px solid var(--glass-border)'}}
                                        type="number" min="0" step="0.01" inputMode="decimal"
                                        value={gastoForm.montoAbonado} onChange={e=>setGastoForm({...gastoForm,montoAbonado:e.target.value})} placeholder="0.00" />
                                </div>
                            )}
                            {gastoError && <div className="error-msg" style={{marginBottom:0,marginTop:4}}>{gastoError}</div>}
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={()=>{setShowGastoModal(false);setGastoError('');}}>Cancelar</button>
                                <button className="btn btn-gold" onClick={addGasto} disabled={savingGasto} style={{flex:1,justifyContent:'center'}}>
                                    {savingGasto?'Guardando...':<>{I.plus} Registrar Gasto</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
}

// ── VENDEDOR PANEL ──
function VendedorPanel({ user, onLogout, onPhotoChange }) {
    const [activeTab, setActiveTab] = useState('ventas');
    const [ventas,    setVentas]    = useState([]);
    const [form,      setForm]      = useState({ cliente: '', producto: '', monto: '' });
    const [saving,    setSaving]    = useState(false);

    useEffect(() => {
        const unsub = db.collection('ventas').onSnapshot(snap => {
            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setVentas(all.filter(v => v.vendedorId === user.uid));
        });
        return unsub;
    }, [user.uid]);

    const addVenta = async () => {
        if (!form.monto || saving) return;
        setSaving(true);
        const data = {
            cliente:       form.cliente,
            producto:      form.producto,
            monto:         parseFloat(form.monto),
            vendedorId:    user.uid,
            vendedorEmail: user.email,
            fecha:         firebase.firestore.FieldValue.serverTimestamp(),
            estado:        'Pendiente',
        };
        setForm({ cliente: '', producto: '', monto: '' });
        setActiveTab('ventas');
        setSaving(false);
        try {
            await db.collection('ventas').add(data);
        } catch(e) {
            console.error('Error al registrar venta:', e);
        }
    };

    const total = ventas.reduce((s, v) => s + (v.monto || 0), 0);

    const navSections = [
        { label: 'Mi Trabajo', items: [
            { key: 'ventas',   label: 'Mis Ventas',  icon: I.chart },
            { key: 'registro', label: 'Nueva Venta', icon: I.plus  },
        ]},
    ];

    return (
        <div className="app-root">
            <img src={LOGO} aria-hidden="true" style={{position:'fixed',top:'50%',left:'50%',transform:'translate(calc(-50% + 110px), -50%)',width:'520px',maxWidth:'55vw',opacity:0.055,filter:'brightness(0)',pointerEvents:'none',userSelect:'none',zIndex:0}} />
            <Header user={user} onLogout={onLogout} activeTab={activeTab} navSections={navSections} onPhotoChange={onPhotoChange} />
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} navSections={navSections} />
            <main className="main">
                {activeTab === 'ventas' && <>
                    <div className="kpi-grid" style={{gridTemplateColumns:'repeat(2,1fr)', maxWidth:460, marginBottom:20}}>
                        <div className="kpi-card glass glass-mid">
                            <div className="kpi-top"><div className="kpi-label">Registradas</div><div className="kpi-icon gold">{I.invoice}</div></div>
                            <div className="kpi-val">{ventas.length}</div>
                            <div className="kpi-sub">ventas en total</div>
                        </div>
                        <div className="kpi-card glass glass-mid">
                            <div className="kpi-top"><div className="kpi-label">Monto total</div><div className="kpi-icon gold">{I.dollar}</div></div>
                            <div className="kpi-val">${total.toFixed(0)}</div>
                            <div className="kpi-sub">pendiente aprobacion</div>
                        </div>
                    </div>
                    <div className="sec-header">
                        <h2>Historial</h2>
                        <button className="btn btn-gold" onClick={() => setActiveTab('registro')}>{I.plus} Nueva venta</button>
                    </div>
                    <div className="card glass">
                        {ventas.length > 0 ? (
                            <table>
                                <thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Monto</th><th>Estado</th></tr></thead>
                                <tbody>
                                    {ventas.map((v, i) => (
                                        <tr key={i}>
                                            <td className="td-num" style={{color:'var(--text-dimmer)', fontSize:'12px'}}>
                                                {v.fecha?.toDate?.().toLocaleDateString('es') || '—'}
                                            </td>
                                            <td><strong>{v.cliente || '—'}</strong></td>
                                            <td style={{color:'var(--text-dim)'}}>{v.producto || '—'}</td>
                                            <td className="td-num"><strong>${(v.monto||0).toFixed(2)}</strong></td>
                                            <td><span className="badge badge-gray"><span className="badge-dot"/>{v.estado}</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty">
                                <div className="empty-icon">{I.inbox}</div>
                                <h3>Sin ventas aun</h3>
                                <p>Registra tu primera venta y aparecera aqui.</p>
                            </div>
                        )}
                    </div>
                </>}

                {activeTab === 'registro' && <>
                    <div className="page-header"><h1>Nueva Venta</h1><p>Completa los datos de la venta</p></div>
                    <div className="card glass card-body" style={{maxWidth:500, borderRadius:'var(--r)'}}>
                        <div className="form-group">
                            <label style={{color:'var(--text-dim)'}}>Cliente</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                value={form.cliente} onChange={e => setForm({...form, cliente: e.target.value})} placeholder="Nombre del cliente" />
                        </div>
                        <div className="form-group">
                            <label style={{color:'var(--text-dim)'}}>Producto</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                value={form.producto} onChange={e => setForm({...form, producto: e.target.value})} placeholder="Descripcion del producto" />
                        </div>
                        <div className="form-group" style={{marginBottom:22}}>
                            <label style={{color:'var(--text-dim)'}}>Monto (USD)</label>
                            <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                type="number" min="0" step="0.01" inputMode="decimal"
                                value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} placeholder="0.00" />
                        </div>
                        <div style={{display:'flex', gap:10}}>
                            <button className="btn btn-glass" onClick={() => setActiveTab('ventas')}>Cancelar</button>
                            <button className="btn btn-gold" onClick={addVenta} disabled={saving} style={{flex:1, justifyContent:'center'}}>
                                {saving ? 'Guardando...' : <>{I.plus} Registrar Venta</>}
                            </button>
                        </div>
                    </div>
                </>}
            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
