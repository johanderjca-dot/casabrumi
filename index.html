<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Brumi — Sistema de Gestion</title>

    <!-- Firebase compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

            <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
        :root {
            /* === TIERRA PALETTE === */
            --cream:       #F7F2EA;
            --cream-dark:  #EDE5D8;
            --stone:       #D9CEBC;
            --stone-mid:   #C4B89E;
            --stone-dark:  #A8977E;
            --parchment:   #FAF7F2;

            --earth:       #5C3D1E;
            --earth-2:     #7A5230;
            --earth-dim:   rgba(92,61,30,0.50);
            --earth-dimmer:rgba(92,61,30,0.28);

            --orange:      #C85C1A;
            --orange-light:#D97340;
            --orange-dim:  rgba(200,92,26,0.12);
            --orange-border:rgba(200,92,26,0.28);

            /* Sand brand — kept for compatibility */
            --sand:        #C2A878;
            --sand-light:  #D9C9A0;
            --sand-dark:   #9A8A6A;
            --sand-dim:    rgba(194,168,120,0.18);
            --sand-border: rgba(194,168,120,0.32);
            --bronze:      #A07440;
            --gold:        #C2A878;

            --ink:         #2C1F0E;
            --ink-2:       #4A3020;
            --on-ink:      #F7F2EA;
            --on-ink-dim:  rgba(247,242,234,0.65);
            --on-ink-dimmer:rgba(247,242,234,0.36);

            --bg:          #F0EAE0;
            --surface-1:   #F7F3EC;
            --surface-2:   #FAF7F2;
            --surface-3:   #FDFBF8;
            --sidebar-bg:  #EDE5D8;

            --glass-bg:      var(--surface-2);
            --glass-bg-mid:  var(--surface-1);
            --glass-bg-high: var(--surface-3);
            --glass-border:  rgba(92,61,30,0.08);
            --glass-border-h:rgba(92,61,30,0.16);
            --glass-shadow:  0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 12px rgba(92,61,30,0.07);
            --glass-shadow-lg: 0 1px 0 rgba(255,255,255,0.8) inset, 0 16px 48px rgba(92,61,30,0.14);

            --text:        #1A1008;
            --text-dim:    rgba(26,16,8,0.72);
            --text-dimmer: rgba(26,16,8,0.48);

            --header-h:  56px;
            --sidebar-w: 220px;
            --r:    12px;
            --r-sm:  8px;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --t-fast:   150ms cubic-bezier(0.23, 1, 0.32, 1);
            --t-normal: 260ms cubic-bezier(0.22, 0.68, 0.32, 1);
            --grad-ink:  linear-gradient(135deg, #C85C1A 0%, #A04010 100%);
            --grad-gold: linear-gradient(135deg, #C2A878 0%, #A98851 100%);
        }
        html, body, #root { height: 100%; }
        body { font-family: 'Fira Sans', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: var(--text); overflow-x: hidden; background: var(--bg); }
        ::selection { background: rgba(200,92,26,0.18); }
        *::-webkit-scrollbar { width: 5px; height: 5px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: var(--stone); border-radius: 99px; }
        *::-webkit-scrollbar-thumb:hover { background: var(--stone-mid); }

        /* SCENE — very subtle warm grain */
        .scene { position: fixed; inset: 0; z-index: 0; background: var(--bg); overflow: hidden; }
        .scene::before { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"); opacity: 0.6; pointer-events: none; }
        .scene::after  { content: ''; position: absolute; top: -20vh; right: -10vw; width: 55vw; height: 55vw; border-radius: 50%; background: radial-gradient(circle, rgba(200,92,26,0.06) 0%, transparent 65%); pointer-events: none; }
        @keyframes rise   { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes pop    { from { opacity: 0; transform: scale(0.95) translateY(10px); filter: blur(3px); } }

        /* SURFACES */
        .glass { background: var(--surface-2); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); position: relative; }
        .glass::before { display: none; }
        .glass > * { position: relative; z-index: 1; }
        .glass-mid  { background: var(--surface-1); }
        .glass-high { background: var(--surface-3); box-shadow: var(--glass-shadow-lg); }

        /* ========= AUTH ========= */
        .auth-wrap { position: relative; z-index: 1; min-height: 100vh; display: grid; grid-template-columns: 55fr 45fr; }
        @media (max-width: 768px) { .auth-wrap { grid-template-columns: 1fr; } .auth-left { display: none; } }
        .auth-left { display: flex; align-items: center; justify-content: flex-start; padding: 72px 64px; position: relative; background: var(--earth); overflow: hidden; }
        .auth-left::before { content: ''; position: absolute; bottom: -30%; left: -15%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(200,92,26,0.22) 0%, transparent 65%); pointer-events: none; }
        .auth-left::after  { content: ''; position: absolute; top: -10%; right: -20%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 65%); pointer-events: none; }
        .auth-left-glow { display: none; }
        .auth-logo-wrap { position: relative; z-index: 1; display: flex; align-items: flex-start; }
        .auth-logo-wrap img { filter: brightness(0) invert(1); opacity: 0.95; user-select: none; }
        .auth-right { display: flex; align-items: center; justify-content: center; padding: 48px 56px; background: var(--cream); }
        .auth-form-box { width: 100%; max-width: 360px; }
        .auth-form-box h2 { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.6px; margin-bottom: 4px; }
        .auth-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 30px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; color: var(--earth-dimmer); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 1.5px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-dimmer); pointer-events: none; }
        .input-icon svg { width: 14px; height: 14px; display: block; }
        .form-input { width: 100%; padding: 12px 14px 12px 40px; font-size: 14px; font-family: inherit; color: var(--text); outline: none; border-radius: var(--r-sm); border: 1.5px solid var(--glass-border); background: var(--parchment); transition: border-color var(--t-fast), box-shadow var(--t-fast); cursor: text; }
        .form-input.no-icon { padding-left: 14px; }
        .form-input::placeholder { color: var(--text-dimmer); }
        .form-input:focus { border-color: var(--orange) !important; box-shadow: 0 0 0 3px var(--orange-dim) !important; outline: none; }
        .error-msg { background: rgba(180,40,40,0.07); border: 1px solid rgba(180,40,40,0.20); border-radius: var(--r-sm); padding: 10px 14px; font-size: 12.5px; color: #9B3030; margin-bottom: 14px; }
        .hint-box { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-radius: var(--r-sm); font-size: 11.5px; color: var(--earth-2); font-family: 'Fira Code', monospace; font-weight: 500; margin-bottom: 18px; }
        .hint-box svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: var(--r-sm); font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer; color: #FFFFFF; background: var(--orange); transition: transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out); letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 0 4px 18px -4px rgba(200,92,26,0.45); }
        @media (hover: hover) and (pointer: fine) { .btn-submit:hover { box-shadow: 0 8px 24px -4px rgba(200,92,26,0.55); transform: translateY(-1px); } }
        .btn-submit:active { transform: scale(0.97); box-shadow: 0 2px 8px -2px rgba(200,92,26,0.30); }
        .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
        .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dimmer); }
        .auth-switch a { color: var(--orange); font-weight: 700; cursor: pointer; text-decoration: none; }

        /* ========= LAYOUT ========= */
        .app-root { position: relative; z-index: 1; display: flex; min-height: 100vh; }

        /* ========= HEADER ========= */
        .app-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 200; display: flex; align-items: center; background: rgba(240,234,224,0.92); border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .app-header-logo { width: var(--sidebar-w); flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start; height: 100%; border-right: 1px solid var(--glass-border); padding: 0 22px; }
        .app-header-logo img { height: 18px; filter: brightness(0); opacity: 0.75; object-fit: contain; }
        .app-header-title { flex: 1; padding: 0 28px; display: flex; align-items: center; gap: 10px; }
        .app-header-title strong { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.1px; }
        .app-header-title span { font-size: 11px; color: var(--text-dimmer); }
        .app-header-right { display: flex; align-items: center; gap: 10px; padding-right: 22px; }
        .app-header-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--earth); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--cream); flex-shrink: 0; box-shadow: 0 0 0 2px var(--stone); transition: transform 140ms var(--ease-out); cursor: pointer; overflow: hidden; }
        @media (hover: hover) and (pointer: fine) { .app-header-avatar:hover { transform: scale(1.06); } }
        .app-header-divider { width: 1px; height: 18px; background: var(--glass-border); }
        .hdr-role  { font-size: 8px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: 2px; }
        .hdr-email { font-size: 11px; color: var(--text-dimmer); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cmdk-hint { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 99px; background: var(--cream-dark); border: 1px solid var(--glass-border); color: var(--text-dim); font-size: 11px; font-family: inherit; cursor: pointer; transition: transform 140ms var(--ease-out), border-color 140ms ease, background 140ms ease; }
        @media (hover: hover) and (pointer: fine) { .cmdk-hint:hover { background: var(--parchment); border-color: var(--stone-mid); color: var(--text); transform: translateY(-1px); } }
        .cmdk-hint:active { transform: scale(0.97); }
        .cmdk-hint kbd { font-family: 'Fira Code', monospace; font-size: 10px; background: var(--stone); border: none; border-radius: 4px; padding: 1px 6px; color: var(--earth-2); }

        /* ========= SIDEBAR — EDITORIAL STYLE ========= */
        .sidebar { width: var(--sidebar-w); position: fixed; top: var(--header-h); left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; background: var(--sidebar-bg); border-right: 1px solid var(--glass-border); overflow-y: auto; }
        .sidebar-nav { flex: 1; padding: 24px 0; }
        .nav-label { font-size: 8px; font-weight: 800; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 3px; padding: 0 22px; margin: 28px 0 8px; }
        .nav-label:first-child { margin-top: 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 22px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-dim); transition: color 140ms ease, background 140ms ease; margin-bottom: 1px; position: relative; border-left: 2px solid transparent; }
        .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; transition: transform 150ms var(--ease-out); }
        @media (hover: hover) and (pointer: fine) { .nav-item:hover { background: rgba(92,61,30,0.05); color: var(--text); } }
        .nav-item:active { transform: scale(0.98); }
        .nav-item.active { border-left-color: var(--orange); color: var(--orange); font-weight: 700; background: rgba(200,92,26,0.06); }
        .nav-item.active svg { color: var(--orange); }
        .nav-item.active::before { display: none; }
        .sidebar-footer { padding: 14px 0; border-top: 1px solid var(--glass-border); }
        .user-tile { display: flex; align-items: center; gap: 10px; padding: 10px 22px; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--earth); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--cream); flex-shrink: 0; }
        .user-tile-info { flex: 1; min-width: 0; }
        .user-role  { font-size: 8px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: 2px; }
        .user-email { font-size: 11px; color: var(--text-dimmer); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .btn-logout { background: none; border: none; cursor: pointer; color: var(--text-dimmer); padding: 5px; border-radius: 6px; display: flex; align-items: center; transition: color 140ms ease, background 140ms ease; flex-shrink: 0; }
        .btn-logout:hover { color: #9B3030; background: rgba(155,48,48,0.08); }
        .btn-logout svg { width: 15px; height: 15px; }

        /* ========= MAIN ========= */
        .main { margin-left: var(--sidebar-w); flex: 1; padding: calc(var(--header-h) + 32px) 40px 48px; min-height: 100vh; background: transparent; }
        .main > * { animation: rise 0.50s cubic-bezier(0.22, 0.68, 0.32, 1) backwards; }
        .main > *:nth-child(2) { animation-delay: 0.06s; }
        .main > *:nth-child(3) { animation-delay: 0.12s; }
        .main > *:nth-child(4) { animation-delay: 0.18s; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.9px; margin-bottom: 4px; }
        .page-header p  { font-size: 13px; color: var(--text-dim); }

        .banner { border-radius: var(--r); padding: 24px 28px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; overflow: hidden; background: var(--earth) !important; border: none !important; }
        .banner-text h2 { font-size: 16px; font-weight: 700; color: var(--on-ink); letter-spacing: -0.3px; margin-bottom: 4px; }
        .banner-text p  { font-size: 13px; color: var(--on-ink-dim); }
        .banner-stat { border-radius: 8px; padding: 12px 18px; text-align: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); }
        .banner-stat-val   { font-size: 20px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.8px; font-family: 'Fira Code', monospace; }
        .banner-stat-label { font-size: 9px; color: var(--on-ink-dimmer); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-top: 3px; }

        /* ========= KPI GRID — FEATURE CARD LAYOUT ========= */
        .kpi-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media (max-width: 1200px) { .kpi-grid { grid-template-columns: 1fr 1fr 1fr; } }
        .kpi-card { border-radius: var(--r); padding: 22px 24px; transition: transform var(--t-normal), box-shadow var(--t-normal); cursor: default; position: relative; animation: rise 0.52s cubic-bezier(0.22, 0.68, 0.32, 1) backwards; border: 1px solid var(--glass-border); background: var(--surface-2); }
        .kpi-grid .kpi-card:first-child { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; background: var(--earth); border-color: transparent; }
        .kpi-grid .kpi-card:first-child .kpi-label { color: rgba(247,242,234,0.55); }
        .kpi-grid .kpi-card:first-child .kpi-val { font-size: 48px; letter-spacing: -2px; color: var(--cream); -webkit-text-fill-color: var(--cream); }
        .kpi-grid .kpi-card:first-child .kpi-sub { color: rgba(247,242,234,0.45); }
        .kpi-grid .kpi-card:first-child .kpi-icon.gold { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.15); color: var(--sand-light); }
        .kpi-grid .kpi-card:nth-child(2) { animation-delay: 0.08s; }
        .kpi-grid .kpi-card:nth-child(3) { animation-delay: 0.12s; }
        .kpi-grid .kpi-card:nth-child(4) { animation-delay: 0.16s; }
        .kpi-grid .kpi-card:nth-child(5) { animation-delay: 0.20s; }
        .kpi-grid .kpi-card:nth-child(6) { animation-delay: 0.24s; }
        .kpi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: var(--r) var(--r) 0 0; background: linear-gradient(90deg, var(--orange) 0%, var(--orange-light) 100%); opacity: 0; transition: opacity var(--t-normal); }
        @media (hover: hover) and (pointer: fine) { .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px -8px rgba(92,61,30,0.16); } .kpi-card:hover::after { opacity: 1; } }
        .kpi-grid .kpi-card:first-child::after { display: none; }

        /* ========= HERO ========= */
        .hero { border-radius: var(--r); padding: 28px 32px; margin-bottom: 20px; background: linear-gradient(135deg, var(--earth) 0%, var(--earth-2) 60%, #8B5E30 100%); border: none; box-shadow: 0 16px 40px -12px rgba(92,61,30,0.40), inset 0 1px 0 rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; overflow: hidden; position: relative; }
        .hero::before { content: ''; position: absolute; top: -50%; right: -8%; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(200,92,26,0.30), transparent 65%); pointer-events: none; }
        .hero::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 36%; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.05) 50%, transparent 80%); transform: translateX(-130%) skewX(-16deg); animation: heroShine 7s ease-in-out infinite; pointer-events: none; }
        @keyframes heroShine { 0% { transform: translateX(-130%) skewX(-16deg); } 55%, 100% { transform: translateX(420%) skewX(-16deg); } }
        .hero h2 { font-size: 20px; font-weight: 800; color: var(--on-ink); letter-spacing: -0.5px; margin-bottom: 5px; }
        .hero p { font-size: 12px; color: var(--on-ink-dim); }
        .hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
        .hero-stat { border-radius: 10px; padding: 12px 18px; text-align: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); min-width: 96px; transition: transform var(--t-fast), background var(--t-fast); }
        @media (hover: hover) and (pointer: fine) { .hero-stat:hover { transform: translateY(-2px); background: rgba(255,255,255,0.11); } }
        .hero-stat-val { font-size: 18px; font-weight: 700; letter-spacing: -0.6px; font-family: 'Fira Code', monospace; color: var(--cream); }
        .hero-stat-label { font-size: 8.5px; color: var(--on-ink-dimmer); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-top: 4px; }

        /* ========= COMMAND PALETTE ========= */
        .cmdk-overlay { position: fixed; inset: 0; background: rgba(44,31,14,0.35); backdrop-filter: blur(10px); display: flex; align-items: flex-start; justify-content: center; z-index: 2000; padding: 12vh 20px 20px; animation: fadeIn 0.15s ease; }
        .cmdk { width: 100%; max-width: 520px; background: var(--parchment); border-radius: 16px; box-shadow: 0 32px 80px rgba(92,61,30,0.28), 0 0 0 1px var(--glass-border) inset; overflow: hidden; border: 1px solid var(--glass-border); animation: pop 0.24s cubic-bezier(0.34, 1.4, 0.45, 1) backwards; }
        .cmdk-input { width: 100%; padding: 16px 20px; font-size: 14px; font-family: inherit; border: none; outline: none; color: var(--text); background: transparent; border-bottom: 1px solid var(--glass-border); }
        .cmdk-input::placeholder { color: var(--text-dimmer); }
        .cmdk-list { max-height: 300px; overflow-y: auto; padding: 8px; }
        .cmdk-group { font-size: 9px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 2px; padding: 10px 12px 4px; }
        .cmdk-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: background 120ms ease; }
        .cmdk-item:hover, .cmdk-item.sel { background: var(--orange-dim); }
        .cmdk-item svg { width: 15px; height: 15px; color: var(--orange); flex-shrink: 0; }
        .cmdk-item .cmdk-kind { margin-left: auto; font-size: 9.5px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 1px; }
        .cmdk-empty { padding: 28px; text-align: center; font-size: 13px; color: var(--text-dim); }

        /* COSTEO CALCULADORA */

// App secundaria de Firebase: crea cuentas de usuarios nuevos sin cerrar la sesión del master
// (el SDK de cliente cambia la sesión activa a la cuenta recién creada si se usa la app principal).
const crearUsuarioConAuth = async (email, password) => {
    const secApp = firebase.apps.find(a => a.name === 'Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
    const secAuth = secApp.auth();
    try {
        const cred = await secAuth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        await secAuth.signOut();
        return uid;
    } catch (err) {
        try { await secAuth.signOut(); } catch(e) {}
        throw err;
    }
};

// ── MOTOR DE DIAGNÓSTICO (rangos saludables RD — del Diccionario COD + FB Ads) ──
const DX = (tipo, valor) => {
    const v = parseFloat(valor);
    if (!isFinite(v) || valor === '' || valor == null) return null;
    const r = (nivel, label) => ({ nivel, label });
    switch (tipo) {
        case 'cpa':         return v<=1 ? r('green','Winner élite') : v<=3 ? r('green','Muy rentable') : v<=5 ? r('gold','Rentable (límite)') : v<=8 ? r('orange','Margen apretado') : r('red','No sostenible');
        case 'ctr':         return v>=3 ? r('green','Creativo ganador') : v>=2 ? r('green','Bueno') : v>=1 ? r('gold','Normal') : r('red','Anuncio débil');
        case 'cpc':         return v<=0.15 ? r('green','Muy bueno') : v<=0.30 ? r('gold','Aceptable') : r('red','Tráfico caro');
        case 'cpm':         return v<=6 ? r('green','Normal RD') : v<=10 ? r('gold','Competencia media') : r('red','Público saturado');
        case 'cvr':         return v>=4 ? r('green','Página winner') : v>=2 ? r('green','Buena') : v>=1 ? r('gold','Normal') : r('red','Página débil');
        case 'frecuencia':  return v<=2 ? r('green','Saludable') : v<=3 ? r('green','Bien') : v<=4 ? r('gold','Cuidado') : r('red','Fatiga publicitaria');
        case 'confirmacion':return v>=70 ? r('green','Saludable') : v>=50 ? r('gold','Bajo el ideal') : r('red','Crítico');
        case 'entrega':     return v>=80 ? r('green','Óptimo') : v>=60 ? r('gold','Mejorable') : r('red','Bajo');
        case 'devoluciones':return v<15 ? r('green','Sano') : v<=25 ? r('gold','Cuidado') : r('red','Alto');
        default: return null;
    }
};
const DX_COLORS = {
    green:  { bg:'rgba(74,120,89,0.12)',  bd:'rgba(74,120,89,0.30)', fg:'#3D6646', dot:'#4A7859' },
    gold:   { bg:'rgba(194,168,120,0.18)', bd:'rgba(194,168,120,0.40)', fg:'#9A7B3E', dot:'#C2A878' },
    orange: { bg:'rgba(200,92,26,0.12)',  bd:'rgba(200,92,26,0.28)', fg:'#B5531A', dot:'#C85C1A' },
    red:    { bg:'rgba(160,56,56,0.10)',  bd:'rgba(160,56,56,0.26)', fg:'#A03B3B', dot:'#A03B3B' },
};
function DxBadge({ tipo, valor, style }) {
    const d = DX(tipo, valor);
    if (!d) return null;
    const c = DX_COLORS[d.nivel];
    return <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 9px',borderRadius:99,fontSize:'10px',fontWeight:'700',background:c.bg,border:`1px solid ${c.bd}`,color:c.fg,whiteSpace:'nowrap',...style}}>
        <span style={{width:5,height:5,borderRadius:'50%',background:c.dot}}/>{d.label}
    </span>;
}

// ── COUNTER ANIMATION ──
function KpiVal({ value }) {
    const elRef = useRef(null);
    const raf = useRef(null);

    useEffect(() => {
        const el = elRef.current;
        if (!el) return;
        const str = String(value);
        const m = str.match(/^([^0-9]*)([0-9]+(?:\.[0-9]+)?)([^0-9]*)$/);
        if (!m) { el.textContent = str; return; }
        const prefix = m[1], num = parseFloat(m[2]), suffix = m[3];
        const isDecimal = m[2].includes('.');
        const start = performance.now();
        const dur = Math.min(900, 400 + num * 0.4);
        cancelAnimationFrame(raf.current);
        const tick = (now) => {
            const p = Math.min((now - start) / dur, 1);
            const e = 1 - Math.pow(1 - p, 3);
            const cur = num * e;
            el.textContent = prefix + (isDecimal ? cur.toFixed(0) : Math.floor(cur)) + suffix;
            if (p < 1) raf.current = requestAnimationFrame(tick);
            else el.textContent = str;
        };
        raf.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf.current);
    }, [value]);

    return <span ref={elRef}>{value}</span>;
}

function RevealTable({ children, className, style }) {
    const ref = useRef(null);
    useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const rows = el.querySelectorAll('tbody tr');
        rows.forEach((r, i) => { r.classList.add('tr-animate'); r.style.setProperty('--tr-d', `${i * 45}ms`); });
        const obs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('tr-in'); obs.unobserve(e.target); } });
        }, { threshold: 0.05, rootMargin: '0px 0px -16px 0px' });
        rows.forEach(r => obs.observe(r));
        return () => obs.disconnect();
    }, [children]);
    return <div ref={ref} className={className} style={style}>{children}</div>;
}

// ── CIERRE DIARIO ──
function CierreDiario({ productos, user, tiendaId }) {
    const _tiendaId = tiendaId || DEFAULT_TIENDA_ID;
    const FILA_VACIA = { nombre: '', cantidad: '', monto: '' };
    const [filas,     setFilas]     = useState([{ ...FILA_VACIA }]);
    const [saving,    setSaving]    = useState(false);
    const [guardado,  setGuardado]  = useState(false);
    const [historial, setHistorial] = useState([]);
    const [navOffset, setNavOffset] = useState(0); // 0=hoy, -1=ayer, etc.
    const skipFillRef      = useRef(false);
    const prevOffsetRef    = useRef(0);

    const getTodayStr = () => fechaLocalISO();
    const getDateStr  = off => { const d = new Date(); d.setDate(d.getDate() + off); return fechaLocalISO(d); };
    const selectedFechaStr = getDateStr(navOffset);
    const selectedDate     = new Date(selectedFechaStr + 'T12:00:00');
    const labelFecha       = selectedDate.toLocaleDateString('es-DO', { weekday:'long', day:'numeric', month:'long' });
    const isToday          = navOffset === 0;

    const cierreSeleccionado = historial.find(c => c.fechaStr === selectedFechaStr) || null;
    const prodActivos        = productos.filter(p => p.estado === 'Activo').map(p => p.nombre).filter(Boolean);

    useEffect(() => {
        const unsub = db.collection('cierres').orderBy('registradoEn', 'desc').limit(90).onSnapshot(
            snap => setHistorial(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => (c.tiendaId || DEFAULT_TIENDA_ID) === _tiendaId)),
            err  => console.error('Cierres:', err)
        );
        return () => unsub();
    }, [_tiendaId]);

    useEffect(() => {
        const offsetChanged = prevOffsetRef.current !== navOffset;
        prevOffsetRef.current = navOffset;
        if (!offsetChanged && skipFillRef.current) { skipFillRef.current = false; return; }
        const cierre = historial.find(c => c.fechaStr === selectedFechaStr);
        if (cierre && cierre.productos?.length) {
            setFilas(cierre.productos.map(p => ({ nombre: p.nombre||'', cantidad: String(p.cantidad||''), monto: String(p.monto||'') })));
        } else {
            setFilas([{ ...FILA_VACIA }]);
        }
    }, [navOffset, historial]);

    const addFila    = () => setFilas(f => [...f, { ...FILA_VACIA }]);
    const removeFila = i  => setFilas(f => f.length > 1 ? f.filter((_, idx) => idx !== i) : f);
    const upd        = (i, field, val) => setFilas(f => f.map((r, idx) => idx === i ? { ...r, [field]: val } : r));

    const totalMonto    = filas.reduce((s, f) => s + (parseFloat(f.monto)  || 0), 0);
    const totalCantidad = filas.reduce((s, f) => s + (parseInt(f.cantidad) || 0), 0);

    const registrarCierre = async () => {
        const validas = filas.filter(f => f.nombre.trim());
        if (saving || validas.length === 0) return;
        setSaving(true);
        try {
            const prodData = validas.map(f => ({
                nombre:   f.nombre.trim(),
                cantidad: parseInt(f.cantidad)  || 0,
                monto:    parseFloat(f.monto)   || 0,
            }));
            const payload = {
                fechaStr:      selectedFechaStr,
                productos:     prodData,
                totalMonto:    prodData.reduce((s, p) => s + p.monto,    0),
                totalCantidad: prodData.reduce((s, p) => s + p.cantidad, 0),
                registradoPor: user.email,
            };
            if (cierreSeleccionado) {
                await db.collection('cierres').doc(cierreSeleccionado.id).update({ ...payload, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp() });
            } else {
                await db.collection('cierres').add({ ...payload, tiendaId: _tiendaId, fecha: firebase.firestore.FieldValue.serverTimestamp(), registradoEn: firebase.firestore.FieldValue.serverTimestamp() });
            }
            skipFillRef.current = true;
            setFilas([{ ...FILA_VACIA }]);
            setGuardado(true);
            setTimeout(() => setGuardado(false), 3000);
        } catch(e) { console.error('Error cierre:', e); }
        setSaving(false);
    };

    return (<>
        <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
            <div>
                <h1>Cierre Diario</h1>
                <div style={{display:'flex',alignItems:'center',gap:8,marginTop:6,flexWrap:'wrap'}}>
                    <button className="btn btn-glass btn-sm" onClick={()=>setNavOffset(n=>n-1)}
                        style={{padding:'4px 10px',fontSize:16,lineHeight:1}}>‹</button>
                    <span style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>{labelFecha}</span>
                    {isToday
                        ? <span style={{fontSize:9,fontWeight:800,background:'var(--orange)',color:'#fff',borderRadius:4,padding:'2px 7px',textTransform:'uppercase',letterSpacing:'1px'}}>Hoy</span>
                        : <button className="btn btn-glass btn-sm" onClick={()=>setNavOffset(n=>Math.min(0,n+1))}
                            style={{padding:'4px 10px',fontSize:16,lineHeight:1}}>›</button>
                    }
                    <input type="date" max={getTodayStr()} value={selectedFechaStr}
                        onChange={e=>{
                            if(!e.target.value) return;
                            const diff = Math.round((new Date(e.target.value+'T12:00:00') - new Date(getTodayStr()+'T12:00:00')) / 86400000);
                            setNavOffset(Math.min(0,diff));
                        }}
                        style={{fontSize:12,padding:'4px 8px',borderRadius:'var(--r-sm)',border:'1.5px solid var(--glass-border)',background:'var(--parchment)',color:'var(--text)',fontFamily:'inherit',cursor:'pointer'}} />
                </div>
            </div>
            <button className="btn btn-gold" onClick={registrarCierre}
                disabled={saving || filas.every(f => !f.nombre.trim())} style={{flexShrink:0}}>
                {saving ? 'Guardando...' : guardado ? '✓ Guardado' : cierreSeleccionado ? 'Actualizar Cierre' : 'Registrar Cierre'}
            </button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:24}}>
            <div className="kpi-card" style={{background:'var(--earth)',border:'none',borderRadius:'var(--r)',padding:'22px 24px'}}>
                <div style={{fontSize:'9px',fontWeight:800,color:'rgba(247,242,234,0.5)',textTransform:'uppercase',letterSpacing:'2px',marginBottom:8}}>{isToday ? 'Total del día' : 'Total del cierre'}</div>
                <div style={{fontSize:'32px',fontWeight:800,letterSpacing:'-1.5px',fontFamily:"'Fira Code',monospace",lineHeight:1,marginBottom:6,color:'#fff'}}>RD${totalMonto.toLocaleString()}</div>
                <div style={{fontSize:'11px',color:'rgba(247,242,234,0.45)'}}>{totalCantidad} unidad{totalCantidad!==1?'es':''} vendida{totalCantidad!==1?'s':''}</div>
            </div>
            <div className="kpi-card glass">
                <div className="kpi-label">Productos</div>
                <div className="kpi-val">{filas.filter(f=>f.nombre.trim()).length}</div>
                <div className="kpi-sub">en este cierre</div>
            </div>
        </div>

        <div className="glass" style={{borderRadius:'var(--r)',overflow:'hidden',marginBottom:24}}>
            <div className="sec-header" style={{padding:'16px 24px',borderBottom:'1px solid var(--glass-border)',margin:0}}>
                <h2>Ventas del día por producto</h2>
                <button className="btn btn-glass btn-sm" onClick={addFila}>{I.plus} Agregar fila</button>
            </div>
            <div style={{padding:'20px 24px'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 110px 150px 32px',gap:10,marginBottom:8,padding:'0 2px'}}>
                    {['Producto','Cantidad','Monto (RD$)',''].map((h,idx)=>(
                        <div key={idx} style={{fontSize:'9px',fontWeight:700,color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.5px'}}>{h}</div>
                    ))}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {filas.map((fila, i) => (
                        <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 110px 150px 32px',gap:10,alignItems:'center'}}>
                            <select className="form-input no-icon" value={fila.nombre}
                                onChange={e => upd(i, 'nombre', e.target.value)}>
                                <option value="">— Seleccionar —</option>
                                {prodActivos.map(n => <option key={n} value={n}>{n}</option>)}
                            </select>
                            <input className="form-input no-icon" type="number" min="0"
                                value={fila.cantidad} onChange={e=>upd(i,'cantidad',e.target.value)} placeholder="0" />
                            <input className="form-input no-icon" type="number" min="0" step="0.01"
                                value={fila.monto} onChange={e=>upd(i,'monto',e.target.value)} placeholder="0.00" />
                            <button onClick={()=>removeFila(i)}
                                style={{background:'none',border:'none',color:'var(--text-dimmer)',cursor:'pointer',fontSize:20,lineHeight:1,padding:0,opacity:filas.length===1?.3:1}}
                                disabled={filas.length===1}>×</button>
                        </div>
                    ))}
                </div>
                <div style={{borderTop:'1px solid var(--glass-border)',marginTop:14,paddingTop:12,display:'grid',gridTemplateColumns:'1fr 110px 150px 32px',gap:10}}>
                    <div style={{fontSize:12,fontWeight:700,color:'var(--text)',textAlign:'right',paddingRight:4}}>Total</div>
                    <div style={{fontFamily:"'Fira Code',monospace",fontWeight:700,fontSize:13}}>{totalCantidad}</div>
                    <div style={{fontFamily:"'Fira Code',monospace",fontWeight:700,fontSize:13,color:'var(--orange)'}}>RD${totalMonto.toLocaleString()}</div>
                    <div/>
                </div>
            </div>
        </div>

        {historial.length > 0 && (
            <div className="glass" style={{borderRadius:'var(--r)',overflow:'hidden'}}>
                <div className="sec-header" style={{padding:'16px 24px',borderBottom:'1px solid var(--glass-border)',margin:0}}>
                    <h2>Historial de Cierres</h2>
                </div>
                <table>
                    <thead><tr>
                        <th>Fecha</th>
                        <th>Productos</th>
                        <th style={{textAlign:'center'}}>Unidades</th>
                        <th style={{textAlign:'right'}}>Total</th>
                    </tr></thead>
                    <tbody>
                        {historial.map(c => {
                            const diff = Math.round((new Date(c.fechaStr+'T12:00:00') - new Date(getTodayStr()+'T12:00:00')) / 86400000);
                            const isSelected = c.fechaStr === selectedFechaStr;
                            return (
                                <tr key={c.id} onClick={()=>setNavOffset(diff)}

                                    <td style={{textAlign:'right',fontWeight:700,fontFamily:"'Fira Code',monospace",color:'var(--orange)'}}>RD${(c.totalMonto||0).toLocaleString()}</td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
        )}
    </>);
}

    const ensureFirestoreDocs = (firebaseUser, isMaster) => {
        const uid   = firebaseUser.uid;
        const email = firebaseUser.email;
        const role  = isMaster ? 'master' : 'vendedor';
        db.collection('users').doc(uid).get().then(doc => {
            if (!doc.exists) {
                db.collection('users').doc(uid).set({ email, role, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(console.error);
            } else {
                // Repara docs incompletos (ej. creados solo con photoURL): rellena email/role faltantes
                const data = doc.data();
                const fix = {};
                if (!data.email) fix.email = email;
                if (!data.role)  fix.role = role;
                if (Object.keys(fix).length > 0) doc.ref.set(fix, { merge: true }).catch(console.error);
                setUser(prev => ({
                    ...prev,
                    role:     isMaster ? 'master' : (data.role || prev.role),
                    photoURL: data.photoURL || prev.photoURL,
                }));
            }
            if (isMaster) { setVendedorAutorizado(true); return; }
            // Busca su ficha en 'vendedores' — creada previamente por el master (por uid o por email)
            db.collection('vendedores').get().then(snap => {
                const emailNorm = (email || '').toLowerCase().trim();
                const match = snap.docs.find(d => {
                    const v = d.data();
                    return v.uid === uid || (v.email || '').toLowerCase().trim() === emailNorm;
                });
                if (!match) { setVendedorAutorizado(false); return; }
                const data = match.data();
                const updates = {};
                if (!data.uid) updates.uid = uid;
                if (data.email && data.email !== emailNorm) updates.email = emailNorm;
                if (Object.keys(updates).length > 0) match.ref.update(updates).catch(console.error);
                setVendedorAutorizado(data.activo !== false);
                // Cuentas de antes del sistema de permisos (sin campo 'permisos') conservan Cierre Diario.
                setUser(prev => ({ ...prev, permisos: data.permisos !== undefined ? data.permisos : { cierre: true }, tiendaId: data.tiendaId || DEFAULT_TIENDA_ID }));
            }).catch(console.error);
        }).catch(console.error);
    };

    useEffect(() => {
        return auth.onAuthStateChanged(firebaseUser => {
            if (firebaseUser) {
                const isMaster = firebaseUser.email === MASTER_EMAIL;
                setUser({ uid: firebaseUser.uid, email: firebaseUser.email, role: isMaster ? 'master' : 'vendedor', photoURL: null, permisos: {} });
                setVendedorAutorizado(isMaster ? true : null);
                setLoading(false);
                ensureFirestoreDocs(firebaseUser, isMaster);
            } else {
                setUser(null);
                setLoading(false);
            }
        });
    }, []);

    const handleAuth = async e => {
        e.preventDefault();
        setError(''); setBusy(true);
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
            const msgs = {
                'auth/user-not-found':       'Usuario no encontrado.',
                'auth/wrong-password':       'Contrasena incorrecta.',
                'auth/email-already-in-use': 'El correo ya esta registrado.',
                'auth/invalid-email':        'Correo invalido.',
                'auth/weak-password':        'La contrasena debe tener al menos 6 caracteres.',
                'auth/invalid-credential':   'Credenciales incorrectas.',
            };
            setError(msgs[err.code] || err.message);
        }
        setBusy(false);
    };

    const handleReset = async () => {
        if (!email) { setError('Ingresa tu correo para restablecer la contraseña.'); return; }
        setBusy(true); setError('');
        try {
            await auth.sendPasswordResetEmail(email);
            setResetSent(true);
        } catch (err) {
            setError('No se pudo enviar el correo. Verifica que el email sea correcto.');
        }
        setBusy(false);
    };

    const handleLogout = () => auth.signOut();

    const handlePhotoChange = (file) => {
        if (!file || !auth.currentUser) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                canvas.width = 80; canvas.height = 80;
                const ctx = canvas.getContext('2d');
                const size = Math.min(img.width, img.height);
                const ox = (img.width  - size) / 2;
                const oy = (img.height - size) / 2;
                ctx.drawImage(img, ox, oy, size, size, 0, 0, 80, 80);
                const photoURL = canvas.toDataURL('image/jpeg', 0.8);
                try {
                    await db.collection('users').doc(auth.currentUser.uid).set({ photoURL }, { merge: true });
                    setUser(prev => ({ ...prev, photoURL }));
                } catch(err) { console.error('Error guardando foto:', err); }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    if (loading) return (
        <div className="loading-screen glass">
            <div className="spinner" />
        </div>
    );

    if (!user) return (
        <div className="auth-wrap">
            <div className="auth-left">
                <div className="auth-left-content">
                    <div className="auth-logo-wrap" style={{marginBottom:0}}>
                        <img src={LOGO} alt="Casa Brumi Importaciones" style={{width:'clamp(140px,45%,200px)', filter:'brightness(0)', opacity:0.85}} />
                    </div>
                    <div>
                        <p className="auth-brand-name">Sistema de Gestión</p>
                        <h1 className="auth-headline">Control total<br/>de tu operación<br/><em>importadora.</em></h1>
                    </div>
                    <div className="auth-divider" />
                    <div className="auth-live-stats">
                        <div className="auth-stat-pill">
                            <span className="auth-stat-pill-label"><span/>Módulos activos</span>
                            <span className="auth-stat-pill-val">Ventas · Gastos · Productos</span>
                        </div>
                        <div className="auth-stat-pill">
                            <span className="auth-stat-pill-label"><span/>Sincronización</span>
                            <span className="auth-stat-pill-val">En tiempo real</span>
                        </div>
                        <div className="auth-stat-pill">
                            <span className="auth-stat-pill-label"><span/>Acceso seguro</span>
                            <span className="auth-stat-pill-val">Firebase Auth</span>
                        </div>
                    </div>
                    <p className="auth-tagline">Gestiona vendedores, registra gastos, analiza productos ganadores y toma decisiones con datos reales.</p>
                </div>
            </div>
            <div className="auth-right">
                <div className="auth-form-box glass glass-mid" style={{borderRadius:'18px', padding:'36px', boxShadow:'var(--glass-shadow-lg)'}}>
                    <h2>Bienvenido de vuelta</h2>
                    <p className="auth-subtitle">Ingresa tus credenciales para acceder</p>
                    <form onSubmit={handleAuth} noValidate>
                        <div className="form-group">
                            <label htmlFor="a-email">Correo electronico</label>
                            <div className="input-wrap">
                                <span className="input-icon">{I.mail}</span>
                                <input id="a-email" className="form-input glass" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="tu@casabrumi.com" required />
                            </div>
                        </div>
                        <div className="form-group" style={{marginBottom:12}}>
                            <label htmlFor="a-pass">Contrasena</label>
                            <div className="input-wrap">
                                <span className="input-icon">{I.lock}</span>
                                <input id="a-pass" className="form-input glass" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
                            </div>
                        </div>
                        {error && <div className="error-msg">{error}</div>}
                        {resetSent && <div style={{background:'rgba(34,197,94,0.12)', border:'1px solid rgba(34,197,94,0.25)', borderRadius:'var(--r-sm)', padding:'10px 13px', fontSize:'12.5px', color:'#4ade80', marginBottom:14}}>Correo enviado. Revisa tu bandeja de entrada.</div>}

                        <button className="btn-submit" type="submit" disabled={busy}>
                            {busy ? 'Cargando...' : 'Iniciar sesion'}
                        </button>
                    </form>
                    <p style={{textAlign:'center', marginTop:12, fontSize:'12.5px'}}>
                        <a style={{color:'var(--text-dimmer)', cursor:'pointer'}} onClick={handleReset}>¿Olvidaste tu contraseña?</a>
                    </p>
                </div>
            </div>
        </div>
    );

    if (user.role !== 'master' && vendedorAutorizado === null) {
        return <div className="loading-screen glass"><div className="spinner"/></div>;
    }
    if (user.role !== 'master' && vendedorAutorizado === false) {
        return (
            <div className="auth-wrap">
                <div className="auth-right" style={{margin:'auto'}}>
                    <div className="auth-form-box glass glass-mid" style={{borderRadius:'18px', padding:'36px', boxShadow:'var(--glass-shadow-lg)', textAlign:'center'}}>
                        <h2>Cuenta no autorizada</h2>
                        <p className="auth-subtitle">Tu cuenta ({user.email}) no tiene acceso a este panel. Pídele al administrador que te cree como usuario.</p>
                        <button className="btn-submit" style={{marginTop:16}} onClick={handleLogout}>Cerrar sesión</button>
                    </div>
                </div>
            </div>
        );
    }

    // Master o vendedor ya autorizado (permisos filtran lo que ve dentro del mismo panel).
    return <AdminPanel user={user} onLogout={handleLogout} onPhotoChange={handlePhotoChange} />;
}

    const PEDIDO_PAGO_COLOR = { paid:'badge-green', pending:'badge-gold', refunded:'badge-red', partially_refunded:'badge-orange', voided:'badge-gray', authorized:'badge-gold' };

    const [resultadoImportPedidos, setResultadoImportPedidos] = useState(null);

    // Parser CSV genérico (RFC4180): soporta campos entre comillas con comas y saltos de línea internos,
    // que el export de pedidos de Shopify usa en columnas de dirección/notas.
    const parseCSV = text => {
        const rows = []; let row = []; let field = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
                else field += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i+1] === '\n') i++;
                    row.push(field); field = '';
                    if (row.length > 1 || row[0] !== '') rows.push(row);
                    row = [];
                } else field += c;
            }
        }
        if (field !== '' || row.length) { row.push(field); rows.push(row); }
        return rows;
    };

    // (mismo formato que ya manda el webhook en tiempo real) para que ambas rutas sean consistentes.
    const parseFechaShopifyCsv = s => {
        if (!s) return null;
        const m = s.trim().match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) ([+-]\d{2})(\d{2})$/);

    const importarPedidosCSV = async file => {
        if (!file || importandoPedidos) return;
        setImportandoPedidos(true);
        setResultadoImportPedidos(null);
        try {
            const text = await file.text();
            const filas = parseCSV(text).filter(r => r.some(v => v !== ''));
            const headers = filas[0];
            const idx = nombre => headers.indexOf(nombre);
            const iId = idx('Id'), iName = idx('Name'), iEmail = idx('Email'), iTotal = idx('Total'),
                  iMoneda = idx('Currency'), iPago = idx('Financial Status'), iPrep = idx('Fulfillment Status'),
                  iCreado = idx('Created at'), iCancelado = idx('Cancelled at'), iTags = idx('Tags'),
                  iEnvio = idx('Shipping Method'), iCanal = idx('Source'), iBillingName = idx('Billing Name');

            const grupos = {};
            for (let r = 1; r < filas.length; r++) {
                const fila = filas[r];
                const numero = fila[iName];
                if (!numero) continue;
                if (!grupos[numero]) grupos[numero] = [];
                grupos[numero].push(fila);
            }

            const pedidos = Object.values(grupos).map(filasPedido => {
                const base = filasPedido.find(f => f[iId]) || filasPedido[0];
                return {
                    shopifyId: base[iId],
                    numero: base[iName],
                    cliente: base[iBillingName] || base[iEmail] || '—',
                    total: parseFloat(base[iTotal] || 0),
                    moneda: base[iMoneda] || 'USD',
                    canal: base[iCanal] || '—',
                    estadoPago: (base[iPago] || '—').toLowerCase(),
                    estadoPreparacion: (base[iPrep] || 'unfulfilled').toLowerCase() || 'unfulfilled',
                    formaEntrega: base[iEnvio] || '—',
                    etiquetas: base[iTags] || '',
                    articulos: filasPedido.length,
                    cancelado: !!base[iCancelado],
                    fechaShopify: parseFechaShopifyCsv(base[iCreado]),
                    ultimoTopic: 'import_csv',
                };
            }).filter(p => p.shopifyId);

            let escritos = 0;
            for (let i = 0; i < pedidos.length; i += 400) {
                const lote = pedidos.slice(i, i + 400);
                const batch = db.batch();
                lote.forEach(p => batch.set(db.collection('pedidos_shopify').doc(p.shopifyId), p, { merge: true }));
                await batch.commit();
                escritos += lote.length;
            }
            setResultadoImportPedidos({ ok: true, cantidad: escritos });
        } catch (err) {
            console.error('Error importando CSV de pedidos:', err);

        const reader = new FileReader();

            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 600; const ratio = Math.min(MAX/img.width, MAX/img.height);
                canvas.width = img.width*ratio; canvas.height = img.height*ratio;
                canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                cb(canvas.toDataURL('image/jpeg', 0.82));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

                    const vendedores = vendedoresScoped;

                    const norm = e => (e || '').toLowerCase().trim();
                    const byEmail = {}; // clave: email normalizado o docId

                        // Preferir nombre del registro manual (no autoRegistrado)
                        const nombre = (!existing.autoRegistrado && existing.nombre) ? existing.nombre
                                     : (!incoming.autoRegistrado && incoming.nombre)  ? incoming.nombre
                                     : existing.nombre || incoming.nombre;
                        const email  = norm(existing.email || incoming.email);
                        const uid    = existing.uid || incoming.uid;
                        return { ...existing, ...incoming, nombre, email, uid };
                    };

                    vendedores.forEach(v => {
                        const ek = norm(v.email);
                        const uk = v.uid;
                        // Buscar entrada existente por uid primero, luego por email
                        let existingKey = (uk && byUid[uk]) ? byUid[uk] : (ek || null);
                        if (existingKey && byEmail[existingKey]) {
                            byEmail[existingKey] = mergeVendedor(byEmail[existingKey], v);
                        } else {
                            const key = ek || v.id;
                            byEmail[key] = { ...v, email: ek || v.email };
                            if (uk) byUid[uk] = key;
                        }
                        // Registrar uid en índice si el doc lo tiene
                        if (uk && !byUid[uk]) byUid[uk] = ek || v.id;

                        let existingKey = (byUid[uk]) ? byUid[uk] : (ek || null);
                        // Cuenta sin email (doc incompleto): vincular al único vendedor sin uid si es inequívoco
                        if (!ek && (!existingKey || !byEmail[existingKey])) {
                            const sinUid = Object.keys(byEmail).filter(k => !byEmail[k].uid);
                            if (sinUid.length === 1) existingKey = sinUid[0];
                        }
                        if (!existingKey || !byEmail[existingKey]) {
                            // No existe ni por uid ni por email → crear sintético
                            const key = ek || u.id;

                            if (!byEmail[existingKey].uid) {

                            }
                        }

                        </>
                    );

                    // ── Detalle de producto ──
                    const p = productos.find(x=>x.id===activeProducto.id) || activeProducto;
                    const inv = p.inventario||{};
                    // Unidades vendidas = suma de lo registrado para este producto en Cierre Diario (por nombre exacto), no un campo manual.
                    const unidadesVendidasCalc = cierresScoped.reduce((s,c) => s + (c.productos||[]).filter(f=>f.nombre===p.nombre).reduce((s2,f)=>s2+(f.cantidad||0),0), 0);
                    // Ganancia total = facturado real (DOP) de este producto en Cierre Diario, no un estimado por margen.
                    const gananciaTotal = cierresScoped.reduce((s,c) => s + (c.productos||[]).filter(f=>f.nombre===p.nombre).reduce((s2,f)=>s2+(f.monto||0),0), 0);
                    const GASTO_CATS_PROD = [
                        ['publicidad', 'Gasto en Publicidad'],
                        ['empacado',   'Gasto en Empacado'],
                        ['proveedor',  'Pago a Proveedor (incl. envío China → USA)'],
                        ['usaRd',      'Envío USA → RD'],
                    ];

                    // ── Lotes: Pedidos y Gastos del producto viven POR LOTE; lo de arriba
                    // (Despachados/Entregados/Ganancia Neta) es la suma de todos los lotes juntos.
                    // Migra en caliente los datos viejos (sin lotes) a un "Lote 1" la primera vez
                    // que se guarda algo, sin perder lo ya registrado.
                    const lotesActuales = (p.lotes && p.lotes.length) ? p.lotes
                        : ((p.pedidos?.length || Object.keys(p.finanzas||{}).length) ? [{ id:'lote_legacy', nombre:'Lote 1', pedidos:p.pedidos||[], finanzas:p.finanzas||{} }] : []);

                    const totalGastoCatLote = (lote, key) => ((lote.finanzas||{})[key]||[]).reduce((s,e)=>s+(e.monto||0),0);
                    const totalGastosProd = lotesActuales.reduce((s,l)=>s+GASTO_CATS_PROD.reduce((s2,[key])=>s2+totalGastoCatLote(l,key),0),0);
                    const gananciaNeta = gananciaTotal - totalGastosProd;

                    const todosPedidos = lotesActuales.flatMap(l=>l.pedidos||[]);
                    const totalDespachados = todosPedidos.reduce((s,e)=>s+(e.despachados||0),0);
                    const totalEntregados  = todosPedidos.reduce((s,e)=>s+(e.entregados||0),0);
                    const tasaEntrega = totalDespachados>0 ? (totalEntregados/totalDespachados*100) : null;

                    const guardarLotes = nuevoLotes => db.collection('productos').doc(p.id).update({
                        lotes: nuevoLotes, pedidos: firebase.firestore.FieldValue.delete(), finanzas: firebase.firestore.FieldValue.delete(),
                    }).catch(console.error);

                    const crearLote = () => {
                        const nuevo = { id:'lote_'+Date.now(), nombre:`Lote ${lotesActuales.length+1}`, pedidos:[], finanzas:{} };
                        guardarLotes([...lotesActuales, nuevo]);
                        setLoteActivo(nuevo.id);
                    };
                    const renombrarLote = (loteId, nombre) => guardarLotes(lotesActuales.map(l=>l.id===loteId?{...l,nombre}:l));
                    const agregarPedidoLote = (loteId, fecha, despachados, entregados) => {
                        const entrada = { despachados: parseInt(despachados)||0, entregados: parseInt(entregados)||0, fecha: fecha || fechaLocalISO() };
                        guardarLotes(lotesActuales.map(l=>l.id===loteId?{...l,pedidos:[...(l.pedidos||[]),entrada]}:l));
                    };
                    const borrarPedidoLote = (loteId, idx) => {
                        guardarLotes(lotesActuales.map(l=>{
                            if (l.id!==loteId) return l;
                            const arr=[...(l.pedidos||[])]; arr.splice(idx,1); return {...l,pedidos:arr};
                        }));
                    };
                    const agregarGastoLote = (loteId, key, monto, nota) => {
                        const entrada = { monto: parseFloat(monto)||0, nota:(nota||'').trim(), fecha: new Date().toISOString() };
                        guardarLotes(lotesActuales.map(l=>{
                            if (l.id!==loteId) return l;
                            const fin={...(l.finanzas||{})}; fin[key]=[...(fin[key]||[]),entrada]; return {...l,finanzas:fin};
                        }));
                    };
                    const borrarGastoLote = (loteId, key, idx) => {
                        guardarLotes(lotesActuales.map(l=>{
                            if (l.id!==loteId) return l;
                            const fin={...(l.finanzas||{})}; const arr=[...(fin[key]||[])]; arr.splice(idx,1); fin[key]=arr; return {...l,finanzas:fin};
                        }));
                    };
                    const loteSel = lotesActuales.find(l=>l.id===loteActivo) || lotesActuales[0] || null;

                    const TABS = ['General','Análisis','Contenido','Inventario'];
                    const CONTENT_GROUPS = contenidoGrupos || [];
                    const analisis = p.analisis || {};
                    const analisisScore = ANALISIS_CHECKS.filter(([k,,,favorable='si'])=>(analisis.checks||{})[k]===favorable).length;
                    const angulosValidos = !!(analisis.angulo1Titulo && analisis.angulo1Titulo.trim());

                        <>

                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Descripción</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`angulo${n}Desc`]} onChange={e=>setAnalisisForm(f=>({...f,[`angulo${n}Desc`]:e.target.value}))} placeholder="Ej: Emocional / aspiracional — vida activa recuperada" /></div>
                                            </div>

                                        <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.2px',margin:'22px 0 12px'}}>Análisis de competencia</div>
                                        {[['1'],['2']].map(([n])=>(
                                            <div key={n} style={{display:'grid',gridTemplateColumns:'1fr 140px',gap:10,marginBottom:10}}>
                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Nombre tienda #{n}</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`comp${n}Nombre`]} onChange={e=>setAnalisisForm(f=>({...f,[`comp${n}Nombre`]:e.target.value}))} placeholder="Ej: TiendaXY.com" /></div>
                                                <div className="form-group" style={{marginBottom:0}}><label style={{color:'var(--text-dim)'}}>Precio</label><input className="form-input no-icon" style={{border:'1px solid var(--glass-border)'}} value={analisisForm[`comp${n}Precio`]} onChange={e=>setAnalisisForm(f=>({...f,[`comp${n}Precio`]:e.target.value}))} placeholder="RD$1,500" /></div>
                                            </div>
                                        ))}

                                        <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:'1.2px',margin:'22px 0 12px'}}>Creativo validado</div>
                                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
                                            {CREATIVO_CHECKS.map(([k,label,favorable='si'])=>{
                                                const v = (analisisForm.creativoChecks||{})[k];
                                                const setV = val => setAnalisisForm(f=>({...f, creativoChecks:{...(f.creativoChecks||{}),[k]:val}}));
                                                return (
                                                    <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:'var(--r-sm)',border:'1px solid var(--glass-border)',background:'var(--surface-2)',gap:8}}>
                                                        <span style={{fontSize:'12px',color:'var(--text)',flex:1}}>{label}</span>
                                                        <div style={{display:'flex',gap:4,flexShrink:0}}>
                                                            {['si','no'].map(opt=>{
                                                                const bueno = opt===favorable;
                                                                return (
                                                                    <button key={opt} onClick={()=>setV(v===opt?'':opt)}
                                                                        style={{padding:'3px 10px',borderRadius:6,border:'1.5px solid',fontSize:'11px',fontWeight:'700',cursor:'pointer',textTransform:'uppercase',letterSpacing:'0.5px',
                                                                            borderColor: v===opt?(bueno?'#4A9050':'#A03B3B'):'var(--glass-border)',
                                                                            background:  v===opt?(bueno?'rgba(74,144,80,0.12)':'rgba(160,56,56,0.10)'):'transparent',
                                                                            color:       v===opt?(bueno?'#3D6646':'#A03B3B'):'var(--text-dimmer)'}}>
                                                                        {opt}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="form-group"><label style={{color:'var(--text-dim)'}}>Notas adicionales</label><textarea className="form-input no-icon" style={{border:'1px solid var(--glass-border)',height:'60px',resize:'vertical'}} value={analisisForm.notas} onChange={e=>setAnalisisForm(f=>({...f,notas:e.target.value}))} /></div>

                                        <div style={{display:'flex',gap:10,marginTop:8}}>
                                            <button className="btn btn-glass" onClick={()=>setEditSeccion(null)}>Cancelar</button>
                                            <button className="btn btn-gold" onClick={()=>saveSeccion(p.id,'analisis',analisisForm)}>Guardar Análisis</button>

                                ) : (

                                                    {(() => {

                                                    {entradas.map(([fechaStr,texto],idx)=>{

                            {/* Modal edición producto */}

                {activeTab === 'costeo' && (() => {
                    const productos = productosScoped; // filtrado por tienda activa (selector "Cargar producto")
                    const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
                    const conf = Math.min(Math.max(n(costeo.pctConfirmacion),1),100)/100;
                    const entr = Math.min(Math.max(n(costeo.pctEntrega),1),100)/100;
                    const tasa = Math.max(n(costeo.tasaCambio),1);
                    const carrier = costeo.logistica[costeo.logisticaActiva] || costeo.logistica[0] || {costoEnvio:'0',devolucionActiva:false};
                    const fleteAjustado = carrier.devolucionActiva ? n(carrier.costoEnvio)/entr : n(carrier.costoEnvio);
                    const cpaReal = n(costeo.cpaAds)/(conf*entr);
                    const extras = (costeo.costosExtra||[]).reduce((s,e)=>s+n(e.monto),0);
                    const precio = n(costeo.precioVenta);
                    const costosOp = n(costeo.costoProducto) + fleteAjustado + extras;
                    const costosTotales = costosOp + cpaReal;
                    const profit = precio - costosTotales;
                    const roi = costosTotales>0 ? profit/costosTotales : 0;
                    const margenActual = precio>0 ? profit/precio*100 : 0;
                    const cpaBreakeven = precio - costosOp;
                    const mObj = n(costeo.margenObjetivo)/100;
                    const precioOptimoRaw = mObj<1 ? costosTotales/(1-mObj) : costosTotales;
                    const precioOptimo = Math.ceil(precioOptimoRaw/50)*50;
                    const margenOptimo = precioOptimo>0 ? (precioOptimo-costosTotales)/precioOptimo*100 : 0;
                    const usd = costeoMoneda==='USD';
                    const sym = usd ? 'US$' : 'RD$';
                    const disp = v => usd ? v/tasa : v;
                    const fmt = (v,dec=0) => disp(v).toLocaleString('es-DO',{minimumFractionDigits:dec,maximumFractionDigits:dec});
                    const money = (v,dec=0) => `${sym}${fmt(v,dec)}`;
                    const segs = [
                        { label:'Producto (Costo)', val:n(costeo.costoProducto), color:'#3B82C4' },
                        { label:'Publicidad (CPA Real)', val:cpaReal, color:'var(--orange)' },
                        { label:'Flete '+(carrier.devolucionActiva?'(Ajustado)':'(Base)'), val:fleteAjustado, color:'#7A5230' },
                        { label:'Extras (Empaque)', val:extras, color:'#C2A878' },
                    ];
                    const upd = (k,v) => setCosteo(c=>({...c,[k]:v}));
                    const updCarrier = (i,k,v) => setCosteo(c=>({...c, logistica:c.logistica.map((l,idx)=>idx===i?{...l,[k]:v}:l)}));
                    const addCarrier = () => setCosteo(c=>({...c, logistica:[...c.logistica,{nombre:'Transportadora '+String.fromCharCode(65+c.logistica.length),costoEnvio:'150',devolucionActiva:false}], logisticaActiva:c.logistica.length}));
                    const delCarrier = (i) => setCosteo(c=>{ if(c.logistica.length<=1) return c; const logistica=c.logistica.filter((_,idx)=>idx!==i); return {...c, logistica, logisticaActiva:Math.min(c.logisticaActiva,logistica.length-1)};});
                    const updExtra = (i,k,v) => setCosteo(c=>({...c, costosExtra:c.costosExtra.map((e,idx)=>idx===i?{...e,[k]:v}:e)}));
                    const addExtra = () => setCosteo(c=>({...c, costosExtra:[...(c.costosExtra||[]),{nombre:'Nuevo costo',monto:'0'}]}));
                    const delExtra = (i) => setCosteo(c=>({...c, costosExtra:c.costosExtra.filter((_,idx)=>idx!==i)}));
                    const tabs = [['calculadora','Calculadora Precio'],['proyeccion','Proyección'],['cierre','Cierre Diario'],['control','Control'],['historial','Historial']];

                                    <button key={m} onClick={()=>setCosteoMoneda(m)} className="cst-tab" style={{padding:'7px 14px',...(costeoMoneda===m?{background:'var(--surface-3)',color:'var(--orange)',boxShadow:'0 1px 4px rgba(92,61,30,0.10)'}:{})}}>{m}</button>

                            </div>

                        {tabs.map(([k,label])=>(

                            </button>

                    </div>

                    {costeoTab!=='calculadora' ? (
                        <div className="card glass"><div className="empty" style={{padding:'72px 40px'}}>
                            <div className="empty-icon">{I_calc}</div>

                            <p>Esta sección se construye en la siguiente fase. La Calculadora de Precio ya está 100% operativa.</p>
                        </div></div>
                    ) : (
                    <div className="cst-grid">
                        {/* ── PANEL DE PARÁMETROS ── */}
                        <div className="card glass cst-panel">

                                <div style={{fontSize:'15px',fontWeight:'800',color:'var(--text)',letterSpacing:'-0.3px'}}>Parámetros</div>
                                <button className="cst-add-btn" onClick={()=>setCosteo({...COSTEO_DEFAULTS})}>↺ Reset</button>

                                            const pv = a.precioVenta || inv.precioVenta || '';

                                            setCosteo(c=>({...c, precioVenta:String(pv||c.precioVenta), costoProducto:String(pp||c.costoProducto), productoCargado:prod.nombre}));

                            {(() => {

                                const colConf = dxConf ? DX_COLORS[dxConf.nivel].dot : 'var(--orange)';
                                const colEntr = dxEntr ? DX_COLORS[dxEntr.nivel].dot : 'var(--orange)';
                                return <>
                                <div style={{marginBottom:16}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8,flexWrap:'wrap'}}>
                                        <span style={{fontSize:'12px',fontWeight:'600',color:'var(--text-dim)'}}>Confirmación</span>
                                        <span style={{display:'flex',alignItems:'center',gap:7}}><DxBadge tipo="confirmacion" valor={n(costeo.pctConfirmacion)} /><span style={{fontSize:'13px',fontWeight:'800',fontFamily:'Fira Code',color:colConf}}>{n(costeo.pctConfirmacion)}%</span></span>
                                    </div>
                                    <input type="range" min="1" max="100" className="cst-range" value={n(costeo.pctConfirmacion)} onChange={e=>upd('pctConfirmacion',e.target.value)}
                                        style={{background:`linear-gradient(90deg, ${colConf} ${n(costeo.pctConfirmacion)}%, var(--stone) ${n(costeo.pctConfirmacion)}%)`}} />
                                </div>
                                <div style={{marginBottom:22}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8,flexWrap:'wrap'}}>
                                        <span style={{fontSize:'12px',fontWeight:'600',color:'var(--text-dim)'}}>Entrega efectiva</span>
                                        <span style={{display:'flex',alignItems:'center',gap:7}}><DxBadge tipo="entrega" valor={n(costeo.pctEntrega)} /><span style={{fontSize:'13px',fontWeight:'800',fontFamily:'Fira Code',color:colEntr}}>{n(costeo.pctEntrega)}%</span></span>
                                    </div>
                                    <input type="range" min="1" max="100" className="cst-range" value={n(costeo.pctEntrega)} onChange={e=>upd('pctEntrega',e.target.value)}
                                        style={{background:`linear-gradient(90deg, ${colEntr} ${n(costeo.pctEntrega)}%, var(--stone) ${n(costeo.pctEntrega)}%)`}} />
                                    <div style={{fontSize:'10px',color:'var(--text-dimmer)',marginTop:7,lineHeight:1.5}}>De cada 100 pedidos que genera el anuncio, cuántos terminas entregando. Saludable: Confirmación 70%+, Entrega 80%+.</div>
                                </div>
                                </>;
                            })()}

                            <div className="cst-sec-label" style={{justifyContent:'space-between'}}>

                                <button className="cst-add-btn" onClick={addCarrier}>+ Nueva</button>

                            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:22}}>

                                                style={{fontSize:'13px',fontWeight:'700',color:'var(--text)',background:'transparent',border:'none',outline:'none',width:'60%'}} />
                                            <div style={{display:'flex',gap:6,alignItems:'center'}}>
                                                {sel && <span style={{fontSize:'9px',fontWeight:'700',color:'var(--orange)',textTransform:'uppercase',letterSpacing:'1px'}}>Activa</span>}

                                            <div style={{flex:1}}>
                                                <label className="cst-field-label" style={{marginBottom:5}}>Costo envío</label>

                                                Devolución {l.devolucionActiva?'ON · Flete ajustado':'OFF'}

                                    </div>
                                    );

                            <div className="cst-sec-label" style={{justifyContent:'space-between'}}>

                                <button className="cst-add-btn" onClick={addExtra}>+ Item</button>

                            <div>
                                {(costeo.costosExtra||[]).map((e,i)=>(

                                        <input value={e.nombre} onChange={ev=>updExtra(i,'nombre',ev.target.value)}
                                            style={{flex:1,fontSize:'12.5px',fontWeight:'600',color:'var(--text)',background:'transparent',border:'none',outline:'none'}} />
                                        <div className="cst-input-wrap" style={{width:90}}><span className="cst-prefix" style={{fontSize:'12px'}}>$</span>
                                            <input type="number" className="cst-input has-prefix" style={{fontSize:'13px',padding:'8px 8px 8px 24px'}} value={e.monto} onChange={ev=>updExtra(i,'monto',ev.target.value)} /></div>
