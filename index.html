                            <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} disabled={limpiandoAsientosGastos} onClick={limpiarAsientosGastos}>
                                {limpiandoAsientosGastos ? 'Eliminando...' : 'Eliminar asientos automáticos de Gastos'}
                            </button>
                            <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} disabled={limpiandoAsientosCierre} onClick={limpiarAsientosCierre}>
                                {limpiandoAsientosCierre ? 'Eliminando...' : 'Eliminar asientos automáticos de Cierre Diario'}
                            </button>
                            <button className="btn btn-gold"
                                onClick={()=>{setAsientoForm({fecha:hoyISO,descripcion:'',lineas:[{...ASIENTO_LINEA_VACIA},{...ASIENTO_LINEA_VACIA}]});setShowAsientoModal(true);}}>{I.plus} Nuevo asiento</button>
                        </div>
                        {misAsientos.length===0 ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Sin asientos aún</h3><p>Registra tu primer asiento contable.</p></div></div>
                        ) : (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:640}}>
                                    <thead><tr><th>Fecha</th><th>Descripción</th><th>Moneda</th><th>Debe</th><th>Haber</th><th></th></tr></thead>
                                    <tbody>
                                        {misAsientos.map(a=>(
                                            <React.Fragment key={a.id}>
                                                <tr style={{cursor:'pointer'}} onClick={()=>setAsientoAbierto(x=>x===a.id?null:a.id)}>
                                                    <td style={{fontFamily:'Fira Code',fontSize:'12px'}}>{a.fecha}</td>
                                                    <td>{a.descripcion||'—'}{a.auto && <span className="badge badge-gray" style={{marginLeft:8,fontSize:'9px'}}><span className="badge-dot"/>Auto</span>}</td>
                                                    <td>{a.moneda}</td>
                                                    <td className="td-num">{fmtCtb(a.totalDebe,a.moneda)}</td>
                                                    <td className="td-num">{fmtCtb(a.totalHaber,a.moneda)}</td>
                                                    <td style={{whiteSpace:'nowrap',textAlign:'right'}}>
                                                        <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} onClick={e=>{e.stopPropagation();deleteAsiento(a);}}>×</button>
                                                    </td>
                                                </tr>
                                                {asientoAbierto===a.id && (
                                                    <tr><td colSpan={6} style={{background:'var(--surface-2)',padding:'10px 18px'}}>
                                                        <table style={{width:'100%',fontSize:'12px'}}>
                                                            <thead><tr><th>Cuenta</th><th>Debe</th><th>Haber</th></tr></thead>
                                                            <tbody>
                                                                {a.lineas.map((l,i)=>(
                                                                    <tr key={i}>
                                                                        <td>{l.cuentaCodigo} — {l.cuentaNombre}</td>
                                                                        <td className="td-num">{l.debe>0?fmtCtb(l.debe,l.moneda):'—'}</td>
                                                                        <td className="td-num">{l.haber>0?fmtCtb(l.haber,l.moneda):'—'}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </td></tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}

                    {contabTab==='auxiliar' && (() => {
                        const misCuentasAux = cuentas.filter(c=>c.tiendaId===activeTiendaId);
                        const cuenta = misCuentasAux.find(c=>c.id===auxCuentaId);
                        const corte = auxFecha || hoyISO;
                        const lineasCuenta = cuenta ? asientos
                            .filter(a=>a.tiendaId===activeTiendaId && a.fecha<=corte)
                            .flatMap(a => (a.lineas||[]).filter(l=>l.cuentaId===cuenta.id).map(l=>({...l, asientoFecha:a.fecha, asientoDescripcion:a.descripcion})))
                            : [];
                        const porTercero = {};
                        lineasCuenta.forEach(l => {
                            const key = l.tercero || '(Sin tercero)';
                            if (!porTercero[key]) porTercero[key] = { debe:0, haber:0, movimientos:[] };
                            porTercero[key].debe += l.debe||0;
                            porTercero[key].haber += l.haber||0;
                            porTercero[key].movimientos.push(l);
                        });
                        const naturaleza = cuenta ? CUENTA_NATURALEZA[cuenta.tipo] : 'deudora';
                        const terceros = Object.entries(porTercero).map(([nombre,v]) => ({
                            nombre, ...v, saldo: naturaleza==='deudora' ? (v.debe-v.haber) : (v.haber-v.debe),
                        })).sort((a,b)=>b.saldo-a.saldo);
                        const totalCuenta = terceros.reduce((s,t)=>s+t.saldo,0);
                        return <>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:18}}>
                            <select className="form-input glass no-icon" style={{width:'auto',minWidth:260,border:'1px solid var(--glass-border)'}}
                                value={auxCuentaId} onChange={e=>setAuxCuentaId(e.target.value)}>
                                <option value="">Selecciona una cuenta…</option>
                                {misCuentasAux.map(c=><option key={c.id} value={c.id}>{c.codigo} — {c.nombre} ({c.moneda})</option>)}
                            </select>
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Hasta</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={corte} onChange={e=>setAuxFecha(e.target.value)} />
                        </div>
                        {!cuenta ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Elige una cuenta</h3><p>Verás el saldo desglosado por tercero (proveedor, cliente, banco...).</p></div></div>
                        ) : terceros.length===0 ? (
                            <div className="card glass"><div className="empty"><h3>Sin movimientos con tercero</h3><p>Esta cuenta no tiene líneas con un tercero asignado todavía.</p></div></div>
                        ) : (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:520}}>
                                    <thead><tr><th>Tercero</th><th>Debe</th><th>Haber</th><th>Saldo</th></tr></thead>
                                    <tbody>
                                        {terceros.map(t=>(
                                            <tr key={t.nombre}>
                                                <td><strong>{t.nombre}</strong></td>
                                                <td className="td-num">{fmtCtb(t.debe,cuenta.moneda)}</td>
                                                <td className="td-num">{fmtCtb(t.haber,cuenta.moneda)}</td>
                                                <td className="td-num" style={{fontWeight:'700'}}>{fmtCtb(t.saldo,cuenta.moneda)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot><tr style={{borderTop:'2px solid var(--glass-border)'}}>
                                        <td style={{fontWeight:'700'}}>Total {cuenta.nombre}</td><td></td><td></td>
                                        <td className="td-num" style={{fontWeight:'800'}}>{fmtCtb(totalCuenta,cuenta.moneda)}</td>
                                    </tr></tfoot>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}

                    {(contabTab==='balance' || contabTab==='resultados') && (() => {
                        const cuentasScope  = cuentasCtbScope.filter(c=>c.moneda===contabMoneda);
                        const filtrosBar = (
                            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:18}}>
                                <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabScope} onChange={e=>setContabScope(e.target.value)}>
                                    <option value="activa">Esta tienda</option>
                                    <option value="todas">Todas las tiendas (consolidado)</option>
                                </select>
                                <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabMoneda} onChange={e=>setContabMoneda(e.target.value)}>
                                    {MONEDAS_CTB.map(m=><option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                        );

                        if (contabTab==='balance') {
                            const corte = balanceFecha || hoyISO;
                            const asientosHasta = asientosCtbScope.filter(a=>a.fecha<=corte);
                            const saldos = sumarSaldosCtb(cuentasScope, asientosHasta);
                            const activos    = saldos.filter(c=>c.tipo==='Activo');
                            const pasivos    = saldos.filter(c=>c.tipo==='Pasivo');
                            const patrimonio = saldos.filter(c=>c.tipo==='Patrimonio');
                            const ingresos   = saldos.filter(c=>c.tipo==='Ingreso');
                            const gastosCt   = saldos.filter(c=>c.tipo==='Gasto');
                            const totalActivos    = activos.reduce((s,c)=>s+c.saldo,0);
                            const totalPasivos    = pasivos.reduce((s,c)=>s+c.saldo,0);
                            const totalPatrimBase = patrimonio.reduce((s,c)=>s+c.saldo,0);
                            const totalIngresos   = ingresos.reduce((s,c)=>s+c.saldo,0);
                            const totalGastosCt   = gastosCt.reduce((s,c)=>s+c.saldo,0);
                            const utilidadAcum    = totalIngresos - totalGastosCt;
                            const totalPatrimonio = totalPatrimBase + utilidadAcum;
                            const cuadra = Math.abs(totalActivos-(totalPasivos+totalPatrimonio))<0.01;
                            const Bloque = ({titulo,items,total}) => (
                                <div className="card glass" style={{padding:'18px 20px'}}>
                                    <div style={{fontWeight:'700',fontSize:'13px',marginBottom:12}}>{titulo}</div>
                                    {items.length===0 ? <p style={{fontSize:'12px',color:'var(--text-dimmer)'}}>Sin cuentas</p> : items.map(c=>(
                                        <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'4px 0',color:'var(--text-dim)'}}>
                                            <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,contabMoneda)}</span>
                                        </div>
                                    ))}
                                    <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:'700',marginTop:10,paddingTop:10,borderTop:'1px solid var(--glass-border)'}}>
                                        <span>Total</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(total,contabMoneda)}</span>
                                    </div>
                                </div>
                            );
                            return <>
                            {filtrosBar}
                            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:18}}>
                                <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Fecha de corte</label>
                                <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={corte} onChange={e=>setBalanceFecha(e.target.value)} />
                                <span className={`badge ${cuadra?'badge-green':'badge-gray'}`} style={{marginLeft:'auto'}}><span className="badge-dot"/>{cuadra?'Cuadra':'No cuadra'}</span>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
                                <Bloque titulo="Activos" items={activos} total={totalActivos} />
                                <Bloque titulo="Pasivos" items={pasivos} total={totalPasivos} />
                                <Bloque titulo="Patrimonio" items={[...patrimonio, ...(utilidadAcum!==0?[{id:'_util',nombre:'Utilidad del período (no distribuida)',saldo:utilidadAcum}]:[])]} total={totalPatrimonio} />
                            </div>
                            </>;
                        }

                        // ── Estado de Resultados ──
                        const desde = resultDesde || hoyISO.slice(0,8)+'01';
                        const hasta = resultHasta || hoyISO;
                        const asientosPeriodo = asientosCtbScope.filter(a=>a.fecha>=desde && a.fecha<=hasta);
                        const saldosP = sumarSaldosCtb(cuentasScope, asientosPeriodo);
                        const ingresosP = saldosP.filter(c=>c.tipo==='Ingreso');
                        const gastosP   = saldosP.filter(c=>c.tipo==='Gasto');
                        const totalIngP = ingresosP.reduce((s,c)=>s+c.saldo,0);
                        const totalGasP = gastosP.reduce((s,c)=>s+c.saldo,0);
                        const utilidad  = totalIngP - totalGasP;
                        return <>
                        {filtrosBar}
                        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:18,flexWrap:'wrap'}}>
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Desde</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={desde} onChange={e=>setResultDesde(e.target.value)} />
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Hasta</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={hasta} onChange={e=>setResultHasta(e.target.value)} />
                        </div>
                        <div className="card glass" style={{padding:'20px 22px'}}>
                            <div style={{fontWeight:'700',fontSize:'13px',marginBottom:10}}>Ingresos</div>
                            {ingresosP.length===0 ? <p style={{fontSize:'12px',color:'var(--text-dimmer)'}}>Sin ingresos en el período</p> : ingresosP.map(c=>(
                                <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'4px 0',color:'var(--text-dim)'}}>
                                    <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,contabMoneda)}</span>
                                </div>
                            ))}
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:'700',margin:'8px 0',paddingTop:8,borderTop:'1px solid var(--glass-border)'}}>
                                <span>Total ingresos</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(totalIngP,contabMoneda)}</span>
                            </div>
                            <div style={{fontWeight:'700',fontSize:'13px',margin:'18px 0 10px'}}>Gastos</div>
                            {gastosP.length===0 ? <p style={{fontSize:'12px',color:'var(--text-dimmer)'}}>Sin gastos en el período</p> : gastosP.map(c=>(
                                <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'4px 0',color:'var(--text-dim)'}}>
                                    <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,contabMoneda)}</span>
                                </div>
                            ))}
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:'700',margin:'8px 0',paddingTop:8,borderTop:'1px solid var(--glass-border)'}}>
                                <span>Total gastos</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(totalGasP,contabMoneda)}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'15px',fontWeight:'800',marginTop:16,paddingTop:14,borderTop:'2px solid var(--glass-border)',color:utilidad>=0?'var(--sand-dark)':'#A03B3B'}}>
                                <span>Utilidad neta</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(utilidad,contabMoneda)}</span>
                            </div>
                        </div>
                        </>;
                    })()}

                    {contabTab==='salarios' && (() => {
                        const productosActivos = productos.filter(p => p.estado === 'Activo');
                        const nombresActivos = new Set(productosActivos.map(p => p.nombre));
                        const cierresParaSalarios = contabScope==='todas' ? cierres : cierres.filter(perteneceATienda);
                        const cierresDelMes = cierresParaSalarios.filter(c => c.fechaStr?.startsWith(salariosMes));
                        const gananciaTotalMes = cierresDelMes.reduce((s,c) => s + (c.productos||[]).filter(f=>nombresActivos.has(f.nombre)).reduce((s2,f)=>s2+(f.monto||0),0), 0);

                        const asientosDelMes = asientosCtbScope.filter(a => a.fecha?.startsWith(salariosMes));
                        const cuentasGastoOpDOP = cuentasCtbScope.filter(c=>c.tipo==='Gasto' && c.operativo!==false && c.moneda==='DOP');
                        const cuentasGastoOpUSD = cuentasCtbScope.filter(c=>c.tipo==='Gasto' && c.operativo!==false && c.moneda==='USD');
                        const saldosOpDOP = sumarSaldosCtb(cuentasGastoOpDOP, asientosDelMes).filter(c=>c.saldo!==0);
                        const saldosOpUSD = sumarSaldosCtb(cuentasGastoOpUSD, asientosDelMes).filter(c=>c.saldo!==0);
                        const totalGastosOpDOP = saldosOpDOP.reduce((s,c)=>s+c.saldo,0);
                        const totalGastosOpUSD = saldosOpUSD.reduce((s,c)=>s+c.saldo,0);
                        const gananciaNetaComision = gananciaTotalMes - totalGastosOpDOP;
                        const montoComision = gananciaNetaComision * (parseFloat(comisionPct)||0) / 100;

                        return <>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:20}}>
                            <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabScope} onChange={e=>setContabScope(e.target.value)}>
                                <option value="activa">Esta tienda</option>
                                <option value="todas">Todas las tiendas (consolidado)</option>
                            </select>
                            <label style={{fontSize:12,color:'var(--text-dim)'}}>Mes</label>
                            <input type="month" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={salariosMes} onChange={e=>setSalariosMes(e.target.value)} />
                            <label style={{fontSize:12,color:'var(--text-dim)'}}>% Comisión</label>
                            <input type="number" className="form-input glass no-icon" style={{width:80,border:'1px solid var(--glass-border)'}} value={comisionPct} onChange={e=>setComisionPct(e.target.value)} />
                        </div>

                        <div className="card glass" style={{padding:'20px 22px',marginBottom:16}}>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0'}}>
                                <span style={{color:'var(--text-dim)'}}>Ganancia Total (productos Activos, Cierre Diario)</span>
                                <span style={{fontFamily:'Fira Code',fontWeight:700}}>{fmtCtb(gananciaTotalMes,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0',color:'#A03B3B'}}>
                                <span>− Gastos operativos (DOP)</span>
                                <span style={{fontFamily:'Fira Code',fontWeight:700}}>{fmtCtb(totalGastosOpDOP,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:800,padding:'10px 0',marginTop:6,borderTop:'1px solid var(--glass-border)'}}>
                                <span>Ganancia neta para comisión</span>
                                <span style={{fontFamily:'Fira Code',color:gananciaNetaComision>=0?'var(--sand-dark)':'#A03B3B'}}>{fmtCtb(gananciaNetaComision,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:16,fontWeight:800,padding:'12px 0',marginTop:8,borderTop:'2px solid var(--orange)',color:'var(--orange)'}}>
                                <span>{comisionPct}% a pagar</span>
                                <span style={{fontFamily:'Fira Code'}}>{fmtCtb(montoComision,'DOP')}</span>
                            </div>
                        </div>

                        {saldosOpDOP.length>0 && (
                            <div className="card glass" style={{padding:'16px 20px',marginBottom:16}}>
                                <div style={{fontSize:12,fontWeight:700,color:'var(--text-dimmer)',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Gastos operativos descontados (DOP)</div>
                                {saldosOpDOP.map(c=>(
                                    <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'4px 0',color:'var(--text-dim)'}}>
                                        <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,'DOP')}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {saldosOpUSD.length>0 && (
                            <div className="card glass" style={{padding:'16px 20px',fontSize:12.5,color:'var(--text-dim)'}}>
                                <strong style={{color:'var(--text)'}}>Nota:</strong> también hay {fmtCtb(totalGastosOpUSD,'USD')} en gastos operativos en USD este mes — no se restaron automáticamente (moneda distinta a la venta), pero considéralos aparte:
                                {saldosOpUSD.map(c=>(
                                    <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'4px 0',marginTop:6}}>
                                        <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,'USD')}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                        </>;
                    })()}
                    </>;
                })()}

                {showModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Nuevo Usuario</h2>
                                <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre completo</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    ref={firstInputRef} value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Ej. Maria Lopez" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Correo electronico</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="maria@casabrumi.com" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Contraseña temporal</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="text" value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="Mínimo 6 caracteres" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Permisos por módulo</label>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                    {MODULOS_PERMISOS.map(([k,label])=>(
                                        <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',padding:'6px 8px',borderRadius:6,background:'var(--surface-2)'}}>
                                            <input type="checkbox" checked={!!form.permisos[k]}
                                                onChange={e=>setForm(f=>({...f,permisos:{...f.permisos,[k]:e.target.checked}}))} />
                                            {label}
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => setShowModal(false)}>Cancelar</button>
                                <button className="btn btn-gold" onClick={crearUsuario} disabled={saving||!form.nombre||!form.email||!form.password}>
                                    {saving ? 'Creando...' : <>{I.plus} Crear Usuario</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showEditUsuarioModal && editingUsuario && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowEditUsuarioModal(false); setEditingUsuario(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Permisos de {editingUsuario.nombre}</h2>
                                <button className="modal-close" onClick={() => { setShowEditUsuarioModal(false); setEditingUsuario(null); }}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={editUsuarioForm.nombre} onChange={e=>setEditUsuarioForm(f=>({...f,nombre:e.target.value}))} />
                            </div>
                            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',marginBottom:14}}>
                                <input type="checkbox" checked={editUsuarioForm.activo}
                                    onChange={e=>setEditUsuarioForm(f=>({...f,activo:e.target.checked}))} />
                                Cuenta activa (desmarca para bloquear el acceso sin borrar al usuario)
                            </label>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Permisos por módulo</label>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                    {MODULOS_PERMISOS.map(([k,label])=>(
                                        <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',padding:'6px 8px',borderRadius:6,background:'var(--surface-2)'}}>
                                            <input type="checkbox" checked={!!editUsuarioForm.permisos[k]}
                                                onChange={e=>setEditUsuarioForm(f=>({...f,permisos:{...f.permisos,[k]:e.target.checked}}))} />
                                            {label}
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowEditUsuarioModal(false); setEditingUsuario(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={guardarEditUsuario} disabled={savingEditUsuario}>
                                    {savingEditUsuario ? 'Guardando...' : <>{I.edit} Guardar</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showTiendaModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowTiendaModal(false); setEditingTienda(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>{editingTienda ? 'Editar Tienda' : 'Nueva Tienda'}</h2>
                                <button className="modal-close" onClick={() => { setShowTiendaModal(false); setEditingTienda(null); }}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre de la tienda</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    ref={firstTiendaRef} value={tiendaForm.nombre} onChange={e => setTiendaForm({...tiendaForm, nombre: e.target.value})}
                                    placeholder="Ej. Brumi Shop" onKeyDown={e => e.key === 'Enter' && addTienda()} />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowTiendaModal(false); setEditingTienda(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={addTienda} disabled={savingTienda}>
                                    {savingTienda ? 'Guardando...' : (editingTienda ? <>{I.edit} Guardar</> : <>{I.plus} Crear Tienda</>)}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showProveedorModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowProveedorModal(false); setEditingProveedor(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>{editingProveedor ? 'Editar Proveedor' : 'Nuevo Proveedor'}</h2>
                                <button className="modal-close" onClick={() => { setShowProveedorModal(false); setEditingProveedor(null); }}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre del proveedor</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={proveedorForm.nombre} onChange={e=>setProveedorForm(f=>({...f,nombre:e.target.value}))} placeholder="Ej. Shaanxi Natural Cuikang" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>País de origen</label>
                                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                    {PROVEEDOR_PAISES.map(pais=>(
                                        <button key={pais} className={`btn btn-sm ${proveedorForm.pais===pais?'btn-gold':'btn-glass'}`} onClick={()=>setProveedorForm(f=>({...f,pais}))}>{pais}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Contacto (teléfono, email, WhatsApp...)</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={proveedorForm.contacto} onChange={e=>setProveedorForm(f=>({...f,contacto:e.target.value}))} placeholder="Ej. +86 123 456 789" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Link (Alibaba, sitio web...)</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={proveedorForm.link} onChange={e=>setProveedorForm(f=>({...f,link:e.target.value}))} placeholder="https://..." />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Notas</label>
                                <textarea className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)',height:'70px',resize:'vertical'}}
                                    value={proveedorForm.notas} onChange={e=>setProveedorForm(f=>({...f,notas:e.target.value}))} placeholder="Condiciones de pago, tiempos de entrega..." />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowProveedorModal(false); setEditingProveedor(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={saveProveedor} disabled={savingProveedor||!proveedorForm.nombre.trim()}>
                                    {savingProveedor ? 'Guardando...' : (editingProveedor ? <>{I.edit} Guardar</> : <>{I.plus} Crear Proveedor</>)}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showCuentaModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowCuentaModal(false); setEditingCuenta(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>{editingCuenta ? 'Editar Cuenta' : 'Nueva Cuenta'}</h2>
                                <button className="modal-close" onClick={() => { setShowCuentaModal(false); setEditingCuenta(null); }}>×</button>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                                <div className="form-group" style={{marginBottom:0}}>
                                    <label style={{color:'var(--text-dim)'}}>Código</label>
                                    <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                        value={cuentaForm.codigo} onChange={e=>setCuentaForm(f=>({...f,codigo:e.target.value}))} placeholder="Ej. 1000" />
                                </div>
                                <div className="form-group" style={{marginBottom:0}}>
                                    <label style={{color:'var(--text-dim)'}}>Moneda</label>
                                    <select className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                        value={cuentaForm.moneda} onChange={e=>setCuentaForm(f=>({...f,moneda:e.target.value}))}>
                                        {MONEDAS_CTB.map(m=><option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre de la cuenta</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={cuentaForm.nombre} onChange={e=>setCuentaForm(f=>({...f,nombre:e.target.value}))}
                                    placeholder="Ej. Caja, Banco Popular USD, Ventas..." onKeyDown={e=>e.key==='Enter'&&saveCuenta()} />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Tipo</label>
                                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                    {CUENTA_TIPOS.map(t=>(
                                        <button key={t} className={`btn btn-sm ${cuentaForm.tipo===t?'btn-gold':'btn-glass'}`} onClick={()=>setCuentaForm(f=>({...f,tipo:t}))}>{t}</button>
                                    ))}
                                </div>
                            </div>
                            {cuentaForm.tipo==='Gasto' && (
                                <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',marginBottom:14}}>
                                    <input type="checkbox" checked={cuentaForm.operativo} onChange={e=>setCuentaForm(f=>({...f,operativo:e.target.checked}))} />
                                    Es gasto operativo (se descuenta en Salarios antes de calcular la comisión)
                                </label>
                            )}
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowCuentaModal(false); setEditingCuenta(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={saveCuenta} disabled={!cuentaForm.nombre.trim()||!cuentaForm.codigo.trim()||savingCuenta}>
                                    {savingCuenta ? 'Guardando...' : (editingCuenta ? <>{I.edit} Guardar</> : <>{I.plus} Crear Cuenta</>)}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showAsientoModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowAsientoModal(false); }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:640}}>
                            <div className="modal-hd">
                                <h2>Nuevo Asiento</h2>
                                <button className="modal-close" onClick={() => setShowAsientoModal(false)}>×</button>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:12,marginBottom:12}}>
                                <div className="form-group" style={{marginBottom:0}}>
                                    <label style={{color:'var(--text-dim)'}}>Fecha</label>
                                    <input type="date" className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                        value={asientoForm.fecha} onChange={e=>setAsientoForm(f=>({...f,fecha:e.target.value}))} />
                                </div>
                                <div className="form-group" style={{marginBottom:0}}>
                                    <label style={{color:'var(--text-dim)'}}>Descripción</label>
                                    <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                        value={asientoForm.descripcion} onChange={e=>setAsientoForm(f=>({...f,descripcion:e.target.value}))} placeholder="Ej. Pago de alquiler de julio" />
                                </div>
                            </div>
                            {asientoForm.lineas.map((l,i)=>(
                                <div key={i} style={{border:'1px solid var(--glass-border)',borderRadius:'var(--r-sm)',padding:10,marginBottom:8}}>
                                    <div style={{display:'flex',gap:8,marginBottom:8}}>
                                        <select className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)',flex:1}}
                                            value={l.cuentaId} onChange={e=>setAsientoLinea(i,{cuentaId:e.target.value})}>
                                            <option value="">Selecciona una cuenta…</option>
                                            {cuentas.filter(c=>c.tiendaId===activeTiendaId && c.activa!==false).map(c=>(
                                                <option key={c.id} value={c.id}>{c.codigo} — {c.nombre} ({c.moneda})</option>
                                            ))}
                                        </select>
                                        <button className="btn btn-glass btn-sm" disabled={asientoForm.lineas.length<=2} onClick={()=>removeAsientoLinea(i)}>×</button>
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr 1fr',gap:8}}>
                                        <input className="form-input glass no-icon" list="terceros-sugeridos" style={{border:'1px solid var(--glass-border)'}}
                                            value={l.tercero} onChange={e=>setAsientoLinea(i,{tercero:e.target.value})} placeholder="Tercero (opcional)" />
                                        <input type="number" className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                            value={l.debe} onChange={e=>setAsientoLinea(i,{debe:e.target.value, haber: e.target.value ? '' : l.haber})} placeholder="Debe" />
                                        <input type="number" className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                            value={l.haber} onChange={e=>setAsientoLinea(i,{haber:e.target.value, debe: e.target.value ? '' : l.debe})} placeholder="Haber" />
                                    </div>
                                </div>
                            ))}
                            <datalist id="terceros-sugeridos">
                                {[...new Set(asientos.flatMap(a=>a.lineas||[]).map(l=>l.tercero).filter(Boolean))].map(t=><option key={t} value={t} />)}
                            </datalist>
                            <button className="btn btn-glass btn-sm" onClick={addAsientoLinea} style={{marginBottom:16}}>{I.plus} Agregar línea</button>
                            {asientoMonedaMixta && (
                                <div style={{fontSize:'12px',color:'#A03B3B',marginBottom:10}}>Todas las líneas de un mismo asiento deben usar cuentas de la misma moneda.</div>
                            )}
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'10px 0',borderTop:'1px solid var(--glass-border)'}}>
                                <span>Debe: <strong style={{fontFamily:'Fira Code'}}>{asientoTotalDebe.toFixed(2)}</strong></span>
                                <span>Haber: <strong style={{fontFamily:'Fira Code'}}>{asientoTotalHaber.toFixed(2)}</strong></span>
                                <span className={`badge ${asientoBalanceado?'badge-green':'badge-gray'}`}><span className="badge-dot"/>{asientoBalanceado?'Balanceado':'Descuadrado'}</span>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => setShowAsientoModal(false)}>Cancelar</button>
                                <button className="btn btn-gold" onClick={saveAsiento} disabled={!asientoForm.fecha||!asientoBalanceado||savingAsiento}>
                                    {savingAsiento ? 'Guardando...' : <>{I.plus} Crear Asiento</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
