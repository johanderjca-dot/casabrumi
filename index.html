                                        {editingLink?<>{I.edit} Guardar</>:<>{I.plus} Agregar</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showGestionCategorias && (
                        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowGestionCategorias(false);setEditingCategoriaKey(null);}}}>
                            <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)',maxWidth:420}}>
                                <div className="modal-hd">
                                    <h2>Categorías de Accesos</h2>
                                    <button className="modal-close" onClick={()=>{setShowGestionCategorias(false);setEditingCategoriaKey(null);}}>×</button>
                                </div>
                                <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16,maxHeight:280,overflowY:'auto'}}>
                                    {accesosCategorias.length===0 && (
                                        <p style={{fontSize:12,color:'var(--text-dim)'}}>Aún no tienes categorías. Crea la primera abajo.</p>
                                    )}
                                    {accesosCategorias.map(cat => (
                                        <div key={cat.key} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'var(--glass-bg-mid)',borderRadius:'var(--r-sm)',border:'1px solid var(--glass-border)'}}>
                                            {editingCategoriaKey===cat.key ? (
                                                <input className="form-input glass no-icon" style={{flex:1,border:'1px solid var(--glass-border)'}}
                                                    autoFocus value={editCategoriaNombre} onChange={e=>setEditCategoriaNombre(e.target.value)}
                                                    onKeyDown={e=>e.key==='Enter'&&renombrarCategoriaAccesos(cat.key)}
                                                    onBlur={()=>renombrarCategoriaAccesos(cat.key)} />
                                            ) : (
                                                <span style={{flex:1,fontSize:13,fontWeight:600,color:'var(--text)'}}>{cat.label}</span>
                                            )}
                                            <button className="btn btn-glass btn-sm" onClick={()=>{setEditingCategoriaKey(cat.key);setEditCategoriaNombre(cat.label);}} title="Renombrar">✎</button>
                                            <button className="btn btn-glass btn-sm" style={{color:'#8B3535'}} onClick={()=>eliminarCategoriaAccesos(cat.key)} title="Eliminar">×</button>
                                        </div>
                                    ))}
                                </div>
                                <div style={{display:'flex',gap:8}}>
                                    <input className="form-input glass no-icon" style={{flex:1,border:'1px solid var(--glass-border)'}}
                                        value={nuevaCategoriaNombre} onChange={e=>setNuevaCategoriaNombre(e.target.value)}
                                        placeholder="Nueva categoría (ej. Proveedores)" onKeyDown={e=>e.key==='Enter'&&crearCategoriaAccesos()} />
                                    <button className="btn btn-gold" onClick={crearCategoriaAccesos}>{I.plus} Crear</button>
                                </div>
                                <p style={{fontSize:11,color:'var(--text-dimmer)',marginTop:12}}>Arrastra el ícono ⠿ del encabezado de cada categoría en Accesos Rápidos para reordenarlas.</p>
                            </div>
                        </div>
                    )}
                </>}

                {activeTab === 'cierre' && <CierreDiario productos={productosScoped} user={user} tiendaId={activeTiendaId} />}

                {activeTab === 'contabilidad' && (() => {
                    const fmtCtb = (v, m) => `${m==='DOP'?'RD$':'$'}${(v||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
                    const CONTAB_SUBTABS = [['plan','Plan de Cuentas'],['diario','Libro Diario'],['auxiliar','Libro Auxiliar'],['balance','Balance General'],['resultados','Estado de Resultados'],['porProducto','Por Producto'],['salarios','Salarios']];
                    return <>
                    <div className="page-header"><h1>Contabilidad</h1><p>Plan de cuentas, libro diario y reportes por partida doble — módulo manual, independiente de Gastos y Cierre Diario.</p></div>
                    <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
                        {CONTAB_SUBTABS.map(([k,l]) => (
                            <button key={k} className={`btn btn-sm ${contabTab===k?'btn-gold':'btn-glass'}`} onClick={()=>setContabTab(k)}>{l}</button>
                        ))}
                    </div>

                    {contabTab==='plan' && (() => {
                        const misCuentas = cuentas.filter(c=>c.tiendaId===activeTiendaId);
                        return <>
                        <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>
                            <button className="btn btn-gold" onClick={()=>{setEditingCuenta(null);setCuentaForm({codigo:'',nombre:'',tipo:'Activo',moneda:'DOP',operativo:true,naturaleza:'na'});setShowCuentaModal(true);}}>{I.plus} Nueva cuenta</button>
                        </div>
                        {misCuentas.length===0 ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Sin cuentas aún</h3><p>Crea tu plan de cuentas para empezar a registrar asientos.</p></div></div>
                        ) : CUENTA_TIPOS.map(tipo => {
                            const delTipo = misCuentas.filter(c=>c.tipo===tipo);
                            if (!delTipo.length) return null;
                            const groupKey = 'plan_'+tipo;
                            const open = !!cGroupsOpen[groupKey];
                            return (
                                <div key={tipo} className="card glass" style={{marginBottom:14,overflow:'hidden'}}>
                                    <div onClick={()=>setCGroupsOpen(o=>({...o,[groupKey]:!o[groupKey]}))}
                                        style={{padding:'14px 18px',borderBottom:open?'1px solid var(--glass-border)':'none',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',userSelect:'none'}}>
                                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                                            <span style={{fontWeight:'700',fontSize:'13px'}}>{tipo}</span>
                                            <span className="badge badge-gold" style={{fontSize:10}}><span className="badge-dot"/>{delTipo.length}</span>
                                        </div>
                                        <span style={{fontSize:18,color:'var(--text-dim)',lineHeight:1,transition:'transform 200ms ease',display:'inline-block',transform:open?'rotate(180deg)':'rotate(0deg)'}}>⌄</span>
                                    </div>
                                    {open && (
                                        <div style={{overflowX:'auto'}}>
                                            <table style={{minWidth:520}}>
                                                <thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th></th></tr></thead>
                                                <tbody>
                                                    {delTipo.map(c=>(
                                                        <tr key={c.id} style={{opacity:c.activa===false?0.5:1}}>
                                                            <td style={{fontFamily:'Fira Code',fontSize:'12px'}}>{c.codigo}</td>
                                                            <td><strong>{c.nombre}</strong>
                                                                {(c.tipo==='Gasto'||c.tipo==='Costo')&&c.naturaleza&&c.naturaleza!=='na'&&(
                                                                    c.naturaleza==='directo'
                                                                        ? <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 9px',marginLeft:8,borderRadius:99,fontSize:'9px',fontWeight:700,background:DX_COLORS.orange.bg,border:`1px solid ${DX_COLORS.orange.bd}`,color:DX_COLORS.orange.fg}}><span style={{width:5,height:5,borderRadius:'50%',background:DX_COLORS.orange.dot}}/>Directo</span>
                                                                        : <span className="badge badge-gray" style={{marginLeft:8,fontSize:'9px'}}><span className="badge-dot"/>Compartido</span>
                                                                )}</td>
                                                            <td><span className={`badge ${c.activa===false?'badge-gray':'badge-green'}`}><span className="badge-dot"/>{c.activa===false?'Inactiva':'Activa'}</span></td>
                                                            <td style={{whiteSpace:'nowrap',textAlign:'right'}}>
                                                                <button className="btn btn-glass btn-sm" onClick={()=>openEditCuenta(c)}>{I.edit}</button>
                                                                <button className="btn btn-glass btn-sm" style={{marginLeft:6}} onClick={()=>toggleCuentaActiva(c)}>{c.activa===false?'Activar':'Desactivar'}</button>
                                                                <button className="btn btn-glass btn-sm" style={{marginLeft:6,color:'#A03B3B'}} onClick={()=>deleteCuenta(c)}>×</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        </>;
                    })()}

                    {contabTab==='diario' && (() => {
                        const misAsientos = asientos.filter(a=>a.tiendaId===activeTiendaId);
                        return <>
                        <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginBottom:14}}>
                            <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} disabled={limpiandoAsientosGastos} onClick={limpiarAsientosGastos}>
                                {limpiandoAsientosGastos ? 'Eliminando...' : 'Eliminar asientos automáticos de Gastos'}
                            </button>
                            <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} disabled={limpiandoAsientosCierre} onClick={limpiarAsientosCierre}>
                                {limpiandoAsientosCierre ? 'Eliminando...' : 'Eliminar asientos automáticos de Cierre Diario'}
                            </button>
                            <button className="btn btn-glass btn-sm" disabled={convirtiendoUsdDop} onClick={convertirCuentasUsdADop}>
                                {convirtiendoUsdDop ? 'Convirtiendo...' : 'Convertir cuentas/asientos en USD a DOP'}
                            </button>
                            <button className="btn btn-gold"
                                onClick={()=>{setEditingAsiento(null);setAsientoForm({fecha:hoyISO,descripcion:'',lineas:[{...ASIENTO_LINEA_VACIA},{...ASIENTO_LINEA_VACIA}]});setShowAsientoModal(true);}}>{I.plus} Nuevo asiento</button>
                        </div>
                        {misAsientos.length===0 ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Sin asientos aún</h3><p>Registra tu primer asiento contable.</p></div></div>
                        ) : (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:640}}>
                                    <thead><tr><th>Fecha</th><th>Descripción</th><th>Moneda</th><th>Debe</th><th>Haber</th><th></th></tr></thead>
                                    <tbody>
                                        {misAsientos.map(a=>(
                                            <React.Fragment key={a.id}>
                                                <tr style={{cursor:'pointer'}} onClick={()=>setAsientoAbierto(x=>x===a.id?null:a.id)}>
                                                    <td style={{fontFamily:'Fira Code',fontSize:'12px'}}>{a.fecha}</td>
                                                    <td>{a.descripcion||'—'}{a.auto && <span className="badge badge-gray" style={{marginLeft:8,fontSize:'9px'}}><span className="badge-dot"/>Auto</span>}</td>
                                                    <td>{a.moneda}</td>
                                                    <td className="td-num">{fmtCtb(a.totalDebe,a.moneda)}</td>
                                                    <td className="td-num">{fmtCtb(a.totalHaber,a.moneda)}</td>
                                                    <td style={{whiteSpace:'nowrap',textAlign:'right'}}>
                                                        <button className="btn btn-glass btn-sm" onClick={e=>{e.stopPropagation();openEditAsiento(a);}}>{I.edit}</button>{' '}
                                                        <button className="btn btn-glass btn-sm" style={{color:'#A03B3B'}} onClick={e=>{e.stopPropagation();deleteAsiento(a);}}>×</button>
                                                    </td>
                                                </tr>
                                                {asientoAbierto===a.id && (
                                                    <tr><td colSpan={6} style={{background:'var(--surface-2)',padding:'10px 18px'}}>
                                                        <table style={{width:'100%',fontSize:'12px'}}>
                                                            <thead><tr><th>Cuenta</th><th>Producto</th><th>Debe</th><th>Haber</th></tr></thead>
                                                            <tbody>
                                                                {a.lineas.map((l,i)=>(
                                                                    <tr key={i}>
                                                                        <td>{l.cuentaCodigo} — {l.cuentaNombre}</td>
                                                                        <td>{l.productoCodigo || '—'}</td>
                                                                        <td className="td-num">{l.debe>0?fmtCtb(l.debe,l.moneda):'—'}</td>
                                                                        <td className="td-num">{l.haber>0?fmtCtb(l.haber,l.moneda):'—'}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </td></tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}

                    {contabTab==='auxiliar' && (() => {
                        const misCuentasAux = cuentas.filter(c=>c.tiendaId===activeTiendaId);
                        const cuenta = misCuentasAux.find(c=>c.id===auxCuentaId);
                        const corte = auxFecha || hoyISO;
                        const lineasCuenta = cuenta ? asientos
                            .filter(a=>a.tiendaId===activeTiendaId && a.fecha<=corte)
                            .flatMap(a => (a.lineas||[]).filter(l=>l.cuentaId===cuenta.id).map(l=>({...l, asientoFecha:a.fecha, asientoDescripcion:a.descripcion})))
                            : [];
                        const porTercero = {};
                        lineasCuenta.forEach(l => {
                            const key = l.tercero || '(Sin tercero)';
                            if (!porTercero[key]) porTercero[key] = { debe:0, haber:0, movimientos:[] };
                            porTercero[key].debe += l.debe||0;
                            porTercero[key].haber += l.haber||0;
                            porTercero[key].movimientos.push(l);
                        });
                        const naturaleza = cuenta ? CUENTA_NATURALEZA[cuenta.tipo] : 'deudora';
                        const terceros = Object.entries(porTercero).map(([nombre,v]) => ({
                            nombre, ...v, saldo: naturaleza==='deudora' ? (v.debe-v.haber) : (v.haber-v.debe),
                        })).sort((a,b)=>b.saldo-a.saldo);
                        const totalCuenta = terceros.reduce((s,t)=>s+t.saldo,0);
                        return <>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:18}}>
                            <select className="form-input glass no-icon" style={{width:'auto',minWidth:260,border:'1px solid var(--glass-border)'}}
                                value={auxCuentaId} onChange={e=>setAuxCuentaId(e.target.value)}>
                                <option value="">Selecciona una cuenta…</option>
                                {misCuentasAux.map(c=><option key={c.id} value={c.id}>{c.codigo} — {c.nombre} ({c.moneda})</option>)}
                            </select>
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Hasta</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={corte} onChange={e=>setAuxFecha(e.target.value)} />
                        </div>
                        {!cuenta ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Elige una cuenta</h3><p>Verás el saldo desglosado por tercero (proveedor, cliente, banco...).</p></div></div>
                        ) : terceros.length===0 ? (
                            <div className="card glass"><div className="empty"><h3>Sin movimientos con tercero</h3><p>Esta cuenta no tiene líneas con un tercero asignado todavía.</p></div></div>
                        ) : (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:520}}>
                                    <thead><tr><th>Tercero</th><th>Debe</th><th>Haber</th><th>Saldo</th></tr></thead>
                                    <tbody>
                                        {terceros.map(t=>(
                                            <tr key={t.nombre}>
                                                <td><strong>{t.nombre}</strong></td>
                                                <td className="td-num">{fmtCtb(t.debe,cuenta.moneda)}</td>
                                                <td className="td-num">{fmtCtb(t.haber,cuenta.moneda)}</td>
                                                <td className="td-num" style={{fontWeight:'700'}}>{fmtCtb(t.saldo,cuenta.moneda)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot><tr style={{borderTop:'2px solid var(--glass-border)'}}>
                                        <td style={{fontWeight:'700'}}>Total {cuenta.nombre}</td><td></td><td></td>
                                        <td className="td-num" style={{fontWeight:'800'}}>{fmtCtb(totalCuenta,cuenta.moneda)}</td>
                                    </tr></tfoot>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}

                    {(contabTab==='balance' || contabTab==='resultados') && (() => {
                        const cuentasScope  = cuentasCtbScope.filter(c=>c.moneda===contabMoneda);
                        const filtrosBar = (
                            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:18}}>
                                <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabScope} onChange={e=>setContabScope(e.target.value)}>
                                    <option value="activa">Esta tienda</option>
                                    <option value="todas">Todas las tiendas (consolidado)</option>
                                </select>
                            </div>
                        );

                        if (contabTab==='balance') {
                            const corte = balanceFecha || hoyISO;
                            const asientosHasta = asientosCtbScope.filter(a=>a.fecha<=corte);
                            const saldos = sumarSaldosCtb(cuentasScope, asientosHasta);
                            const activos    = saldos.filter(c=>c.tipo==='Activo');
                            const pasivos    = saldos.filter(c=>c.tipo==='Pasivo');
                            const patrimonio = saldos.filter(c=>c.tipo==='Patrimonio');
                            const ingresos   = saldos.filter(c=>c.tipo==='Ingreso');
                            // Costo cuenta como deudora igual que Gasto para la utilidad acumulada —
                            // si se dejara afuera, el balance dejaría de cuadrar en cuanto se registre
                            // costo de mercancía vendida en una cuenta tipo Costo.
                            const gastosCt   = saldos.filter(c=>c.tipo==='Gasto' || c.tipo==='Costo');
                            const totalActivos    = activos.reduce((s,c)=>s+c.saldo,0);
                            const totalPasivos    = pasivos.reduce((s,c)=>s+c.saldo,0);
                            const totalPatrimBase = patrimonio.reduce((s,c)=>s+c.saldo,0);
                            const totalIngresos   = ingresos.reduce((s,c)=>s+c.saldo,0);
                            const totalGastosCt   = gastosCt.reduce((s,c)=>s+c.saldo,0);
                            const utilidadAcum    = totalIngresos - totalGastosCt;
                            const totalPatrimonio = totalPatrimBase + utilidadAcum;
                            const cuadra = Math.abs(totalActivos-(totalPasivos+totalPatrimonio))<0.01;
                            const Bloque = ({titulo,items,total}) => (
                                <div className="card glass" style={{padding:'18px 20px'}}>
                                    <div style={{fontWeight:'700',fontSize:'13px',marginBottom:12}}>{titulo}</div>
                                    {items.length===0 ? <p style={{fontSize:'12px',color:'var(--text-dimmer)'}}>Sin cuentas</p> : items.map(c=>(
                                        <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'4px 0',color:'var(--text-dim)'}}>
                                            <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,contabMoneda)}</span>
                                        </div>
                                    ))}
                                    <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:'700',marginTop:10,paddingTop:10,borderTop:'1px solid var(--glass-border)'}}>
                                        <span>Total</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(total,contabMoneda)}</span>
                                    </div>
                                </div>
                            );
                            return <>
                            {filtrosBar}
                            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:18}}>
                                <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Fecha de corte</label>
                                <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={corte} onChange={e=>setBalanceFecha(e.target.value)} />
                                <span className={`badge ${cuadra?'badge-green':'badge-gray'}`} style={{marginLeft:'auto'}}><span className="badge-dot"/>{cuadra?'Cuadra':'No cuadra'}</span>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
                                <Bloque titulo="Activos" items={activos} total={totalActivos} />
                                <Bloque titulo="Pasivos" items={pasivos} total={totalPasivos} />
                                <Bloque titulo="Patrimonio" items={[...patrimonio, ...(utilidadAcum!==0?[{id:'_util',nombre:'Utilidad del período (no distribuida)',saldo:utilidadAcum}]:[])]} total={totalPatrimonio} />
                            </div>
                            </>;
                        }

                        // ── Estado de Resultados ──
                        // Cascada: Ingresos − Costo = MARGEN BRUTO − Gastos de Venta (61xx) = MARGEN DE
                        // CONTRIBUCIÓN − Gastos de Operación (62xx) − Gastos Financieros (63xx) = UTILIDAD
                        // NETA. "Otros Gastos" atrapa cualquier cuenta de Gasto que no siga la convención
                        // de código 61/62/63 para que el reporte nunca pierda un saldo en silencio.
                        const desde = resultDesde || hoyISO.slice(0,8)+'01';
                        const hasta = resultHasta || hoyISO;
                        const asientosPeriodo = asientosCtbScope.filter(a=>a.fecha>=desde && a.fecha<=hasta);
                        const saldosP = sumarSaldosCtb(cuentasScope, asientosPeriodo);
                        const ingresosP    = saldosP.filter(c=>c.tipo==='Ingreso');
                        const costoP       = saldosP.filter(c=>c.tipo==='Costo');
                        const gastosVentaP = saldosP.filter(c=>c.tipo==='Gasto' && GASTO_GRUPO(c)==='venta');
                        const gastosOperP  = saldosP.filter(c=>c.tipo==='Gasto' && GASTO_GRUPO(c)==='operacion');
                        const gastosFinP   = saldosP.filter(c=>c.tipo==='Gasto' && GASTO_GRUPO(c)==='financiero');
                        const gastosOtrosP = saldosP.filter(c=>c.tipo==='Gasto' && GASTO_GRUPO(c)==='otros');

                        const totalIngP   = ingresosP.reduce((s,c)=>s+c.saldo,0);
                        const totalCostoP = costoP.reduce((s,c)=>s+c.saldo,0);
                        const margenBruto    = totalIngP - totalCostoP;
                        const margenBrutoPct = totalIngP>0 ? margenBruto/totalIngP*100 : null;

                        const totalGVentaP = gastosVentaP.reduce((s,c)=>s+c.saldo,0);
                        const margenContrib    = margenBruto - totalGVentaP;
                        const margenContribPct = totalIngP>0 ? margenContrib/totalIngP*100 : null;

                        const totalGOperP  = gastosOperP.reduce((s,c)=>s+c.saldo,0);
                        const totalGFinP   = gastosFinP.reduce((s,c)=>s+c.saldo,0);
                        const totalGOtrosP = gastosOtrosP.reduce((s,c)=>s+c.saldo,0);
                        const utilidad    = margenContrib - totalGOperP - totalGFinP - totalGOtrosP;
                        const utilidadPct = totalIngP>0 ? utilidad/totalIngP*100 : null;

                        const Seccion = ({titulo, items, total, vacio}) => (
                            <div style={{marginBottom:18}}>
                                <div style={{fontWeight:'700',fontSize:'13px',marginBottom:10}}>{titulo}</div>
                                {items.length===0 ? <p style={{fontSize:'12px',color:'var(--text-dimmer)'}}>{vacio}</p> : items.map(c=>(
                                    <div key={c.id} style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'4px 0',color:'var(--text-dim)'}}>
                                        <span>{c.nombre}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(c.saldo,contabMoneda)}</span>
                                    </div>
                                ))}
                                <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:'700',marginTop:4,paddingTop:8,borderTop:'1px solid var(--glass-border)'}}>
                                    <span>Total {titulo.toLowerCase()}</span><span style={{fontFamily:'Fira Code'}}>{fmtCtb(total,contabMoneda)}</span>
                                </div>
                            </div>
                        );
                        const Cascada = ({label, val, pct, highlight}) => (
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',padding: highlight?'14px 16px':'10px 0',margin: highlight?'8px 0 18px':'0 0 8px',borderRadius: highlight?12:0,
                                background: highlight?(val>=0?'var(--orange-dim)':'rgba(160,56,56,0.08)'):undefined,
                                border: highlight?`1px solid ${val>=0?'var(--orange-border)':'rgba(160,56,56,0.24)'}`:'none',
                                borderTop: !highlight?'2px solid var(--glass-border)':undefined}}>
                                <span style={{fontWeight:800,fontSize:highlight?14:13,letterSpacing:highlight?'0.3px':0}}>{label}</span>
                                <span style={{textAlign:'right'}}>
                                    <span style={{fontFamily:'Fira Code',fontWeight:800,fontSize:highlight?18:15,color: val>=0?(highlight?'var(--orange)':'var(--text)'):'#A03B3B'}}>{fmtCtb(val,contabMoneda)}</span>
                                    <span style={{fontSize:11,color:'var(--text-dimmer)',marginLeft:8,fontFamily:'Fira Code'}}>{pct===null?'—':`${pct.toFixed(1)}%`}</span>
                                </span>
                            </div>
                        );
                        return <>
                        {filtrosBar}
                        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:18,flexWrap:'wrap'}}>
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Desde</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={desde} onChange={e=>setResultDesde(e.target.value)} />
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Hasta</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={hasta} onChange={e=>setResultHasta(e.target.value)} />
                        </div>
                        <div className="card glass" style={{padding:'20px 22px'}}>
                            <Seccion titulo="Ingresos" items={ingresosP} total={totalIngP} vacio="Sin ingresos en el período" />
                            <Seccion titulo="Costo de Ventas" items={costoP} total={totalCostoP} vacio="Sin costo de ventas en el período" />
                            <Cascada label="MARGEN BRUTO" val={margenBruto} pct={margenBrutoPct} highlight />
                            <Seccion titulo="Gastos de Venta" items={gastosVentaP} total={totalGVentaP} vacio="Sin gastos de venta (61xx) en el período" />
                            <Cascada label="MARGEN DE CONTRIBUCIÓN" val={margenContrib} pct={margenContribPct} highlight />
                            <Seccion titulo="Gastos de Operación" items={gastosOperP} total={totalGOperP} vacio="Sin gastos de operación (62xx) en el período" />
                            <Seccion titulo="Gastos Financieros" items={gastosFinP} total={totalGFinP} vacio="Sin gastos financieros (63xx) en el período" />
                            {gastosOtrosP.length>0 && <Seccion titulo="Otros Gastos" items={gastosOtrosP} total={totalGOtrosP} vacio="" />}
                            <Cascada label="UTILIDAD NETA" val={utilidad} pct={utilidadPct} highlight />
                        </div>
                        </>;
                    })()}

                    {contabTab==='porProducto' && (() => {
                        const cuentasScope   = cuentasCtbScope.filter(c=>c.moneda===contabMoneda);
                        const desde = resultDesde || hoyISO.slice(0,8)+'01';
                        const hasta = resultHasta || hoyISO;
                        const asientosPeriodo = asientosCtbScope.filter(a=>a.fecha>=desde && a.fecha<=hasta);

                        // Productos activos en el scope elegido — reciben una parte igual del gasto
                        // general (gastos sin producto asignado, ej. suscripciones/operación del negocio).
                        const productosActivosScope = (contabScope==='todas' ? productos : productos.filter(perteneceATienda)).filter(p=>p.estado==='Activo');
                        const nProductosActivos = productosActivosScope.length;

                        const { filas: filasProdSinOrdenar, gastoGeneral, gastoGeneralPorProducto } = calcularUtilidadesPorProducto(cuentasScope, asientosPeriodo, productosActivosScope);
                        const filasProd = [...filasProdSinOrdenar].sort((a,b)=>b.utilidad-a.utilidad);

                        // Desglose por cuenta (ej. Publicidad, Salarios, Suscripciones...) tanto de los gastos
                        // directos de cada producto como del gasto general sin producto asignado, para poder
                        // ver en qué se fue el gasto y no solo el total.
                        const cuentasById = Object.fromEntries(cuentasScope.map(c=>[c.id,c]));
                        const gastosPorCuenta = {};
                        const gastoGeneralPorCuenta = {};
                        asientosPeriodo.forEach(a => (a.lineas||[]).forEach(l => {
                            const cuenta = cuentasById[l.cuentaId];
                            if (!cuenta || (cuenta.tipo!=='Gasto' && cuenta.tipo!=='Costo')) return;
                            const monto = (l.debe||0) - (l.haber||0);
                            if (!l.productoId) {
                                const fila = gastoGeneralPorCuenta[cuenta.id] || (gastoGeneralPorCuenta[cuenta.id] = { nombre: cuenta.nombre, monto: 0 });
                                fila.monto += monto;
                                return;
                            }
                            const acc = gastosPorCuenta[l.productoId] || (gastosPorCuenta[l.productoId] = {});
                            const fila = acc[cuenta.id] || (acc[cuenta.id] = { nombre: cuenta.nombre, monto: 0 });
                            fila.monto += monto;
                        }));
                        const filasGastoGeneral = Object.values(gastoGeneralPorCuenta).sort((a,b)=>b.monto-a.monto);

                        // Lista para el dropdown: todos los productos del scope, activos o no,
                        // para poder aislar uno específico aunque no tenga movimientos todavía.
                        const productosParaFiltro = contabScope==='todas' ? productos : productos.filter(perteneceATienda);
                        const filasMostradas = porProductoFiltro ? filasProd.filter(p=>p.id===porProductoFiltro) : filasProd;
                        const totalIngProd = filasMostradas.reduce((s,p)=>s+p.ingresos,0);
                        const totalGasProd = filasMostradas.reduce((s,p)=>s+p.gastos,0);
                        const totalUtilProd = totalIngProd - totalGasProd;

                        return <>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:18}}>
                            <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabScope} onChange={e=>setContabScope(e.target.value)}>
                                <option value="activa">Esta tienda</option>
                                <option value="todas">Todas las tiendas (consolidado)</option>
                            </select>
                            <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={porProductoFiltro} onChange={e=>setPorProductoFiltro(e.target.value)}>
                                <option value="">Todos los productos</option>
                                {productosParaFiltro.map(p=>(
                                    <option key={p.id} value={p.id}>{p.codigo?`${p.codigo} — ${p.nombre}`:p.nombre}</option>
                                ))}
                            </select>
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Desde</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={desde} onChange={e=>setResultDesde(e.target.value)} />
                            <label style={{fontSize:'12px',color:'var(--text-dim)'}}>Hasta</label>
                            <input type="date" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={hasta} onChange={e=>setResultHasta(e.target.value)} />
                        </div>
                        {gastoGeneral>0 && (
                            <div style={{marginTop:-8,marginBottom:14}}>
                                <p style={{fontSize:12,color:'var(--text-dimmer)',marginBottom:filasGastoGeneral.length>1?4:0}}>
                                    {nProductosActivos>0
                                        ? <>Gasto general del período (sin producto asignado): <strong>{fmtCtb(gastoGeneral,contabMoneda)}</strong> — dividido entre {nProductosActivos} producto{nProductosActivos===1?'':'s'} activo{nProductosActivos===1?'':'s'} ({fmtCtb(gastoGeneralPorProducto,contabMoneda)} c/u).</>
                                        : <>Hay {fmtCtb(gastoGeneral,contabMoneda)} en gastos generales sin producto asignado, pero no hay productos activos para repartirlos.</>}
                                </p>
                                {filasGastoGeneral.length>1 && (
                                    <div style={{display:'flex',flexWrap:'wrap',gap:'4px 18px'}}>
                                        {filasGastoGeneral.map(g=>(
                                            <div key={g.nombre} style={{fontSize:11.5,color:'var(--text-dimmer)'}}>
                                                {g.nombre}: <span style={{fontFamily:'Fira Code',fontWeight:700,color:'var(--text-dim)'}}>{fmtCtb(g.monto,contabMoneda)}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        {filasMostradas.length===0 ? (
                            <div className="card glass"><div className="empty"><div className="empty-icon">{I_balanza}</div><h3>Sin movimientos por producto</h3><p>{porProductoFiltro ? 'Este producto no tiene ingresos, gastos directos ni parte de gasto general en el período.' : 'Activa un producto en Productos, o asigna un producto a las líneas de Ventas/Gastos en el Libro Diario, para ver aquí la utilidad por producto.'}</p></div></div>
                        ) : (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:520}}>
                                    <thead><tr><th>Producto</th><th className="td-num">Ingresos</th><th className="td-num">Gastos</th><th className="td-num">Utilidad</th></tr></thead>
                                    <tbody>
                                        {filasMostradas.map(p=>{
                                            const desglose = Object.values(gastosPorCuenta[p.id]||{}).sort((a,b)=>b.monto-a.monto);
                                            const expandible = desglose.length>0 || p.gastoAsignado>0;
                                            const expandido = porProductoExpandido===p.id;
                                            return (
                                                <React.Fragment key={p.id}>
                                                    <tr style={expandible?{cursor:'pointer'}:undefined} onClick={()=>expandible && setPorProductoExpandido(expandido?null:p.id)}>
                                                        <td>
                                                            {expandible && <span style={{display:'inline-block',width:10,marginRight:6,fontSize:10,color:'var(--text-dimmer)',transition:'transform var(--t-fast)',transform:expandido?'rotate(90deg)':'none'}}>›</span>}
                                                            {p.codigo?`${p.codigo} — ${p.nombre}`:p.nombre}
                                                        </td>
                                                        <td className="td-num">{fmtCtb(p.ingresos,contabMoneda)}</td>
                                                        <td className="td-num">{fmtCtb(p.gastos,contabMoneda)}</td>
                                                        <td className="td-num" style={{fontWeight:'700',color:p.utilidad>=0?'var(--sand-dark)':'#A03B3B'}}>{fmtCtb(p.utilidad,contabMoneda)}</td>
                                                    </tr>
                                                    {expandido && expandible && (
                                                        <tr>
                                                            <td colSpan={4} style={{background:'var(--glass-bg-mid)',padding:'12px 16px'}}>
                                                                <div style={{display:'flex',flexWrap:'wrap',gap:'6px 24px'}}>
                                                                    {desglose.map(d=>(
                                                                        <div key={d.nombre} style={{fontSize:12,color:'var(--text-dim)'}}>
                                                                            {d.nombre}: <span style={{fontFamily:'Fira Code',fontWeight:700,color:'var(--text)'}}>{fmtCtb(d.monto,contabMoneda)}</span>
                                                                        </div>
                                                                    ))}
                                                                    {p.gastoAsignado>0 && (filasGastoGeneral.length>1 ? filasGastoGeneral.map(g=>(
                                                                        <div key={'gg_'+g.nombre} style={{fontSize:12,color:'var(--text-dim)'}}>
                                                                            {g.nombre} (gral.): <span style={{fontFamily:'Fira Code',fontWeight:700,color:'var(--text)'}}>{fmtCtb(g.monto/nProductosActivos,contabMoneda)}</span>
                                                                        </div>
                                                                    )) : (
                                                                        <div style={{fontSize:12,color:'var(--text-dim)'}}>
                                                                            Gasto general (prorrateado): <span style={{fontFamily:'Fira Code',fontWeight:700,color:'var(--text)'}}>{fmtCtb(p.gastoAsignado,contabMoneda)}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )}
                                                </React.Fragment>
                                            );
                                        })}
                                    </tbody>
                                    <tfoot><tr style={{borderTop:'2px solid var(--glass-border)'}}>
                                        <td style={{fontWeight:'700'}}>Total</td>
                                        <td className="td-num" style={{fontWeight:'800'}}>{fmtCtb(totalIngProd,contabMoneda)}</td>
                                        <td className="td-num" style={{fontWeight:'800'}}>{fmtCtb(totalGasProd,contabMoneda)}</td>
                                        <td className="td-num" style={{fontWeight:'800',color:totalUtilProd>=0?'var(--sand-dark)':'#A03B3B'}}>{fmtCtb(totalUtilProd,contabMoneda)}</td>
                                    </tr></tfoot>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}

                    {contabTab==='salarios' && (() => {
                        // La comisión sale de la ganancia neta de TODOS los productos activos en el mes
                        // (ingresos del Libro Diario menos sus gastos directos y su parte de gasto general),
                        // no de Cierre Diario — misma fórmula que Contabilidad → Por Producto, sumada.
                        const asientosDelMes = asientosCtbScope.filter(a => a.fecha?.startsWith(salariosMes));
                        const productosActivosSalarios = (contabScope==='todas' ? productos : productos.filter(perteneceATienda)).filter(p=>p.estado==='Activo');
                        const { filas: filasSalarios } = calcularUtilidadesPorProducto(cuentasCtbScope, asientosDelMes, productosActivosSalarios);
                        const filasSalariosOrdenadas = [...filasSalarios].sort((a,b)=>b.utilidad-a.utilidad);
                        const totalIngSalarios = filasSalarios.reduce((s,p)=>s+p.ingresos,0);
                        const totalGasSalarios = filasSalarios.reduce((s,p)=>s+p.gastos,0);
                        const gananciaNetaComision = totalIngSalarios - totalGasSalarios;
                        const montoComision = gananciaNetaComision * (parseFloat(comisionPct)||0) / 100;

                        return <>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:20}}>
                            <select className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={contabScope} onChange={e=>setContabScope(e.target.value)}>
                                <option value="activa">Esta tienda</option>
                                <option value="todas">Todas las tiendas (consolidado)</option>
                            </select>
                            <label style={{fontSize:12,color:'var(--text-dim)'}}>Mes</label>
                            <input type="month" className="form-input glass no-icon" style={{width:'auto',border:'1px solid var(--glass-border)'}} value={salariosMes} onChange={e=>setSalariosMes(e.target.value)} />
                            <label style={{fontSize:12,color:'var(--text-dim)'}}>% Comisión</label>
                            <input type="number" className="form-input glass no-icon" style={{width:80,border:'1px solid var(--glass-border)'}} value={comisionPct} onChange={e=>setComisionPct(e.target.value)} />
                        </div>

                        <div className="card glass" style={{padding:'20px 22px',marginBottom:16}}>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0'}}>
                                <span style={{color:'var(--text-dim)'}}>Ingresos totales (productos activos, Libro Diario)</span>
                                <span style={{fontFamily:'Fira Code',fontWeight:700}}>{fmtCtb(totalIngSalarios,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0',color:'#A03B3B'}}>
                                <span>− Gastos totales (directos + gasto general repartido)</span>
                                <span style={{fontFamily:'Fira Code',fontWeight:700}}>{fmtCtb(totalGasSalarios,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:800,padding:'10px 0',marginTop:6,borderTop:'1px solid var(--glass-border)'}}>
                                <span>Ganancia neta de todos los productos (mes)</span>
                                <span style={{fontFamily:'Fira Code',color:gananciaNetaComision>=0?'var(--sand-dark)':'#A03B3B'}}>{fmtCtb(gananciaNetaComision,'DOP')}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:16,fontWeight:800,padding:'12px 0',marginTop:8,borderTop:'2px solid var(--orange)',color:'var(--orange)'}}>
                                <span>{comisionPct}% a pagar</span>
                                <span style={{fontFamily:'Fira Code'}}>{fmtCtb(montoComision,'DOP')}</span>
                            </div>
                        </div>

                        {filasSalariosOrdenadas.length>0 && (
                            <div className="card glass" style={{overflowX:'auto'}}>
                                <table style={{minWidth:480}}>
                                    <thead><tr><th>Producto</th><th className="td-num">Ingresos</th><th className="td-num">Gastos</th><th className="td-num">Utilidad</th></tr></thead>
                                    <tbody>
                                        {filasSalariosOrdenadas.map(p=>(
                                            <tr key={p.id}>
                                                <td>{p.codigo?`${p.codigo} — ${p.nombre}`:p.nombre}</td>
                                                <td className="td-num">{fmtCtb(p.ingresos,'DOP')}</td>
                                                <td className="td-num">{fmtCtb(p.gastos,'DOP')}</td>
                                                <td className="td-num" style={{fontWeight:700,color:p.utilidad>=0?'var(--sand-dark)':'#A03B3B'}}>{fmtCtb(p.utilidad,'DOP')}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        </>;
                    })()}
                    </>;
                })()}

                {showModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Nuevo Usuario</h2>
                                <button className="modal-close" onClick={() => setShowModal(false)}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre completo</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    ref={firstInputRef} value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Ej. Maria Lopez" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Correo electronico</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="maria@casabrumi.com" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Contraseña temporal</label>
                                <input className="form-input glass no-icon" style={{backdropFilter:'blur(10px)', border:'1px solid var(--glass-border)'}}
                                    type="text" value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="Mínimo 6 caracteres" />
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Permisos por módulo</label>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                    {MODULOS_PERMISOS.map(([k,label])=>(
                                        <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',padding:'6px 8px',borderRadius:6,background:'var(--surface-2)'}}>
                                            <input type="checkbox" checked={!!form.permisos[k]}
                                                onChange={e=>setForm(f=>({...f,permisos:{...f.permisos,[k]:e.target.checked}}))} />
                                            {label}
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => setShowModal(false)}>Cancelar</button>
                                <button className="btn btn-gold" onClick={crearUsuario} disabled={saving||!form.nombre||!form.email||!form.password}>
                                    {saving ? 'Creando...' : <>{I.plus} Crear Usuario</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showEditUsuarioModal && editingUsuario && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowEditUsuarioModal(false); setEditingUsuario(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>Permisos de {editingUsuario.nombre}</h2>
                                <button className="modal-close" onClick={() => { setShowEditUsuarioModal(false); setEditingUsuario(null); }}>×</button>
                            </div>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Nombre</label>
                                <input className="form-input glass no-icon" style={{border:'1px solid var(--glass-border)'}}
                                    value={editUsuarioForm.nombre} onChange={e=>setEditUsuarioForm(f=>({...f,nombre:e.target.value}))} />
                            </div>
                            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',marginBottom:14}}>
                                <input type="checkbox" checked={editUsuarioForm.activo}
                                    onChange={e=>setEditUsuarioForm(f=>({...f,activo:e.target.checked}))} />
                                Cuenta activa (desmarca para bloquear el acceso sin borrar al usuario)
                            </label>
                            <div className="form-group">
                                <label style={{color:'var(--text-dim)'}}>Permisos por módulo</label>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                    {MODULOS_PERMISOS.map(([k,label])=>(
                                        <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:'12.5px',color:'var(--text-dim)',cursor:'pointer',padding:'6px 8px',borderRadius:6,background:'var(--surface-2)'}}>
                                            <input type="checkbox" checked={!!editUsuarioForm.permisos[k]}
                                                onChange={e=>setEditUsuarioForm(f=>({...f,permisos:{...f.permisos,[k]:e.target.checked}}))} />
                                            {label}
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowEditUsuarioModal(false); setEditingUsuario(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={guardarEditUsuario} disabled={savingEditUsuario}>
                                    {savingEditUsuario ? 'Guardando...' : <>{I.edit} Guardar</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showTiendaModal && (
                    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) { setShowTiendaModal(false); setEditingTienda(null); } }}>
                        <div className="modal glass glass-high" style={{boxShadow:'var(--glass-shadow-lg)'}}>
                            <div className="modal-hd">
                                <h2>{editingTienda ? 'Editar Tienda' : 'Nueva Tienda'}</h2>
                                <button className="modal-close" onClick={() => { setShowTiendaModal(false); setEditingTienda(null); }}>×</button>
                            </div>
                            <div className="form-group">

                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',padding:'10px 0',borderTop:'1px solid var(--glass-border)'}}>
                                <span>Debe: <strong style={{fontFamily:'Fira Code'}}>{asientoTotalDebe.toFixed(2)}</strong></span>
                                <span>Haber: <strong style={{fontFamily:'Fira Code'}}>{asientoTotalHaber.toFixed(2)}</strong></span>
                                <span className={`badge ${asientoBalanceado?'badge-green':'badge-gray'}`}><span className="badge-dot"/>{asientoBalanceado?'Balanceado':'Descuadrado'}</span>
                            </div>
                            {!asientoProductoOk && (
                                <p style={{fontSize:'12px',color:'#A03B3B',marginTop:6}}>Faltan productos en {asientoLineasSinProducto.length} línea{asientoLineasSinProducto.length!==1?'s':''} de costo directo.</p>
                            )}
                            <div className="modal-actions">
                                <button className="btn btn-glass" onClick={() => { setShowAsientoModal(false); setEditingAsiento(null); }}>Cancelar</button>
                                <button className="btn btn-gold" onClick={saveAsiento} disabled={!asientoForm.fecha||!asientoBalanceado||!asientoProductoOk||savingAsiento}>
                                    {savingAsiento ? 'Guardando...' : editingAsiento ? <>{I.edit} Guardar Cambios</> : <>{I.plus} Crear Asiento</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

            </main>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
